<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRYNOX — Área do aluno</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#131316;--line:#29292f;--text:#f3f3f5;--muted:#a5a5ae;--silver:#d9dbe1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#202024 0%,var(--bg) 48%);color:var(--text);font:16px/1.55 system-ui,Arial,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(100%,440px)}.brand{text-align:center;font:700 42px 'UnifrakturCook',Georgia,serif;color:var(--silver);margin-bottom:8px}.eyebrow{text-align:center;color:var(--muted);letter-spacing:.22em;font-size:11px;text-transform:uppercase;margin-bottom:26px}.card{border:1px solid var(--line);background:rgba(19,19,22,.96);border-radius:18px;padding:26px;box-shadow:0 18px 60px #0007}h1{font-size:23px;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;font-size:14px}label{display:block;font-size:12px;color:#c9c9d0;margin:14px 0 6px}input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#09090b;color:white;font:inherit;outline:none}input:focus{border-color:#c9ccd3}button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:1px solid #f5f6f8;border-radius:12px;padding:14px 16px;margin-top:14px;font:800 15px/1.2 system-ui,Arial,sans-serif;letter-spacing:.02em;cursor:pointer;pointer-events:auto;touch-action:manipulation;user-select:none;background:linear-gradient(180deg,#f7f7f9 0%,#d5d7dc 48%,#aeb2ba 100%);color:#09090b;box-shadow:0 4px 0 #6f737b,0 8px 18px #0008;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}button:hover{filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 6px 0 #6f737b,0 12px 22px #0009}button:active{transform:translateY(3px);box-shadow:0 1px 0 #6f737b,0 3px 8px #0008}button:focus-visible{outline:3px solid #fff;outline-offset:4px}button:disabled{cursor:wait;opacity:.65;transform:none}button.secondary{background:linear-gradient(180deg,#292a30 0%,#1b1c21 100%);border:1px solid #bfc2ca;color:#f7f7f9;box-shadow:0 4px 0 #050506,0 8px 18px #0008;margin-top:12px}button.secondary:hover{box-shadow:0 6px 0 #050506,0 12px 22px #0009}button.secondary:active{box-shadow:0 1px 0 #050506,0 3px 8px #0008}.message{margin-top:16px;padding:12px;border-radius:10px;background:#0b0b0d;border:1px solid var(--line);font-size:13px;white-space:pre-wrap;display:none}.foot{color:#85858f;font-size:11px;text-align:center;margin-top:18px}
</style></head><body><main class="wrap"><div class="brand">𝕭𝖗𝖞𝖓𝖔𝖝</div><div class="eyebrow">Área do aluno</div><section class="card"><h1>Entre na sua conta</h1><p>Use seu e-mail e senha para verificar sua conta BRYNOX.</p>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="email">
<label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6">
<button id="login" type="button"><span aria-hidden="true">↪</span> Entrar</button><button id="signup" class="secondary" type="button"><span aria-hidden="true">＋</span> Criar conta</button><div id="message" class="message" role="status" aria-live="polite"></div></section><div class="foot">BRYNOX • Preto, cinza e prata</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const email=document.getElementById('email'), password=document.getElementById('password'), message=document.getElementById('message');
function show(text){message.style.display='block';message.textContent=text}
// Confirma visualmente cada clique antes de iniciar a requisição.
document.getElementById('login').addEventListener('click',()=>{document.getElementById('login').style.filter='brightness(1.12)'},{once:false});
document.getElementById('signup').addEventListener('click',()=>{document.getElementById('signup').style.filter='brightness(1.12)'},{once:false});
function values(){return {email:email.value.trim(),password:password.value}}
document.getElementById('login').addEventListener('click', async function(){
 const v=values(); if(!v.email||!v.password){show('Digite seu e-mail e sua senha.');return}
 if(!window.supabase){show('O serviço de login não carregou. Recarregue a página. Seus dados não foram enviados.');return}
 this.disabled=true;show('Verificando sua conta…');
 try{const client=window.supabase.createClient('https://qtfingdojmzwgidkcrcr.supabase.co','sb_publishable_A5fvZ8PwNhIiJsk_ycExYA_l6I6-2sG');
 const {data,error}=await client.auth.signInWithPassword(v);
 if(error){show('Não foi possível entrar: '+error.message);return}
 const {data:access,error:ae}=await client.from('student_course_access').select('access_granted').eq('user_id',data.user.id).maybeSingle();
 if(ae){show('Entrou na conta, mas não foi possível verificar o acesso: '+ae.message);return}
 show(access&&access.access_granted?'Login confirmado. A página das aulas ainda precisa ser conectada.':'Login confirmado, mas o acesso ao curso ainda não foi liberado.');
 }catch(e){show('Falha de conexão: '+(e&&e.message?e.message:'erro desconhecido'))}finally{this.disabled=false}
});
document.getElementById('signup').addEventListener('click', async function(){
 const v=values();if(!v.email||v.password.length<6){show('Digite um e-mail válido e uma senha com pelo menos 6 caracteres.');return}
 if(!window.supabase){show('O serviço de cadastro não carregou. Recarregue a página. Seus dados não foram enviados.');return}
 this.disabled=true;show('Criando conta…');
 try{const client=window.supabase.createClient('https://qtfingdojmzwgidkcrcr.supabase.co','sb_publishable_A5fvZ8PwNhIiJsk_ycExYA_l6I6-2sG');
 const {data,error}=await client.auth.signUp(v);
 if(error){show('Não foi possível criar a conta: '+error.message);return}
 show(data.session?'Conta criada. O acesso ao curso ainda precisa ser liberado.':'Cadastro iniciado. Confira seu e-mail para confirmar a conta. Depois, o acesso ao curso precisa ser liberado.');
 }catch(e){show('Falha de conexão: '+(e&&e.message?e.message:'erro desconhecido'))}finally{this.disabled=false}
});
</script>
</body></html>
