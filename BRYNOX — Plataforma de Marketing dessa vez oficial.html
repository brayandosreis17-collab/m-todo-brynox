órmulas diferentes, então escolha uma e mantenha para comparar ao longo do tempo.',['Escolha uma fórmula de engajamento e use sempre a mesma.','Registre curtidas, comentários, compartilhamentos e salvamentos de cada post.','Compare por tema e formato e leia os comentários para entender o motivo.','Ajuste o conteúdo com base no que gera conversas e salvamentos.'],'Exemplo hipotético: um post alcançou 2.000 pessoas e teve 40 curtidas, 10 comentários, 20 compartilhamentos e 30 salvamentos, somando 100 interações. Taxa: 100 dividido por 2.000, vezes 100, igual a 5%. Valores ilustrativos.','Erros comuns: valorizar só curtidas, achar que engajamento alto significa vendas, comparar contas de tamanhos muito diferentes, ignorar o conteúdo dos comentários e usar três fórmulas diferentes sem perceber.','Engajamento mede reação do público, mas não garante venda. Use sempre a mesma fórmula, observe quais interações indicam utilidade e leia os comentários para entender o que realmente interessa às pessoas.')),L('Cliques e visitas ao perfil',Q('Cliques são as vezes em que as pessoas tocam em um link ou botão. Visitas ao perfil mostram quantas pessoas entraram na sua página depois de ver um conteúdo. Ambas indicam um passo além da simples visualização: a pessoa quis saber mais.','Essas métricas mostram se o conteúdo desperta curiosidade suficiente para a ação. Visitas ao perfil indicam interesse na marca; cliques no link indicam interesse na oferta ou no material. Ajudam a avaliar chamadas para ação.','A taxa de cliques, o CTR, é calculada dividindo cliques por impressões e multiplicando por 100. Visitas ao perfil podem ser comparadas com o alcance. Se muitos visitam e poucos clicam, o perfil ou o link precisam de ajustes.',['Registre cliques e visitas ao perfil por conteúdo e por semana.','Calcule o CTR: cliques divididos por impressões vezes 100.','Compare chamadas para ação diferentes e posições do link.','Revise bio e página de destino se os cliques forem baixos.'],'Exemplo hipotético: um anúncio teve 8.000 impressões e 72 cliques. CTR: 72 dividido por 8.000, vezes 100, igual a 0,9%. Se outro anúncio tiver 1,5%, ele despertou mais interesse. Valores ilustrativos.','Erros comuns: comemorar cliques sem verificar se a página carrega ou converte, comparar CTR de plataformas diferentes, usar links quebrados, não separar cliques por origem e confundir clique com compra.','Cliques e visitas ao perfil mostram interesse concreto, mas ainda não são vendas. Calcule o CTR, compare chamadas para ação e verifique o que acontece depois do clique para entender se o caminho está funcionando.')),L('Leads e taxa de conversão',Q('Lead é uma pessoa que demonstrou interesse e deixou um contato, como e-mail ou telefone, normalmente em troca de um material ou informação. A taxa de conversão mede o percentual de pessoas que realizam a ação desejada, como se cadastrar ou comprar.','Leads permitem continuar a conversa com quem já mostrou interesse. A taxa de conversão mostra a eficiência de uma página, anúncio ou etapa do funil e permite comparar versões e identificar onde melhorar.','Taxa de conversão é igual a conversões divididas por visitas, vezes 100. Para leads, divide-se o número de cadastros pelo número de visitas à página. O contato deve ser coletado com consentimento e de acordo com as regras de privacidade.',['Defina qual ação conta como conversão em cada página.','Conte visitas e conversões no mesmo período.','Calcule a taxa e anote junto com a data e a versão testada.','Teste mudanças no título ou na chamada e compare.'],'Exemplo hipotético: uma página de download teve 400 visitas e 40 cadastros. Taxa: 40 dividido por 400, vezes 100, igual a 10%. Se uma nova versão tiver 12% com tráfego parecido, pode ser melhor, mas confirme com mais dados.','Erros comuns: coletar contatos sem consentimento, calcular com períodos diferentes, concluir com poucos dados, buscar muitos cadastros sem qualidade e esquecer de acompanhar se os leads avançam no funil.','Lead é um contato interessado; conversão é a ação desejada. Calcule a taxa dividindo conversões por visitas e compare com cautela, respeitando a privacidade das pessoas e verificando se os leads têm qualidade.')),L('Receita, ticket médio e margem',Q('Receita é todo o dinheiro recebido pelas vendas. Ticket médio é o valor médio gasto por compra. Margem de contribuição é o que sobra de cada venda depois de descontar os custos diretos, como produto, taxas, frete e comissões.','Essas métricas mostram quanto entra, quanto cada cliente costuma gastar e quanto realmente sobra para cobrir as outras despesas e gerar lucro. Receita alta com margem baixa pode significar pouco ou nenhum ganho.','Ticket médio é igual à receita dividida pelo número de vendas. A margem de contribuição unitária é o preço menos os custos variáveis, e pode ser vista em percentual do preço. Use a calculadora da aba Ferramentas para praticar.',['Some a receita do período e conte o número de vendas.','Calcule o ticket médio dividindo a receita pelas vendas.','Liste os custos diretos de cada venda e calcule a margem.','Use essas informações para definir preços e ofertas.'],'Exemplo hipotético: 20 vendas somaram R$ 740, então o ticket médio é R$ 37. Se cada venda tem R$ 15 de custos diretos, a margem é R$ 22, ou cerca de 59% do preço. Valores ilustrativos.','Erros comuns: confundir receita com lucro, esquecer taxas, frete e comissões no cálculo, olhar apenas o ticket médio sem considerar a margem e comparar períodos com campanhas muito diferentes.','Receita é o que entra, ticket médio é quanto cada compra vale em média e margem é o que sobra depois dos custos diretos. Avaliar apenas a receita pode esconder prejuízos e levar a decisões erradas.')),L('CPA, lucro e ROI',Q('Custo por aquisição, o CPA, é quanto você gasta, em média, para conseguir um cliente ou uma venda. Lucro é o que sobra depois de todos os custos. Retorno sobre investimento, o ROI, compara o ganho obtido com o valor investido.','Servem para saber se uma campanha vale a pena. Um CPA menor que a margem de cada venda indica que a conta fecha; maior indica prejuízo. O ROI ajuda a comparar investimentos diferentes de forma padronizada.','CPA é igual ao gasto dividido pelo número de vendas. Lucro é igual à receita menos todos os custos. ROI é igual ao lucro líquido dividido pelo investimento, vezes 100. Receita, lucro e ROI são coisas diferentes e não devem ser confundidas.',['Some todo o gasto com divulgação no período.','Divida pelo número de vendas para obter o CPA.','Compare o CPA com a margem de cada venda.','Calcule o ROI com o lucro líquido e o valor investido.'],'Exemplo hipotético: você gastou R$ 100 em anúncios e teve 4 vendas, com CPA de R$ 25. Cada venda deixa R$ 20 de margem, somando R$ 80. O resultado é negativo em R$ 20, ou ROI de menos 20%. Valores ilustrativos.','Erros comuns: calcular o CPA sem incluir todos os custos, comparar receita com investimento como se fosse lucro, ignorar reembolsos, decidir com poucas vendas e achar que ROI positivo em um teste se repetirá sempre.','CPA mostra o custo de cada venda, lucro mostra o que sobra e ROI mostra o retorno sobre o que foi investido. Compare sempre o CPA com a margem de cada venda e lembre que um resultado isolado não garante o próximo.')),L('Correlação e causa',Q('Correlação é quando duas coisas variam juntas, como mais publicações e mais vendas. Causa e efeito significa que uma delas realmente provoca a outra. Nem toda correlação indica causa, e muitos fatores podem influenciar um mesmo resultado.','Entender essa diferença evita decisões erradas, como repetir uma ação achando que ela causou um resultado que, na verdade, veio de outro fator, como uma data comemorativa, um anúncio ou uma indicação de terceiros.','Para se aproximar de uma conclusão mais segura, compare períodos e grupos parecidos, mude uma variável por vez e repita o teste. Mesmo assim, resultados podem variar, e uma métrica isolada nunca determina o sucesso de uma estratégia.',['Anote tudo o que mudou no período, e não só a ação que você quer avaliar.','Mude uma variável de cada vez nos testes.','Compare com um período ou grupo parecido para ter referência.','Repita o teste antes de concluir que a mudança funcionou.'],'Exemplo hipotético: as vendas subiram na semana em que você mudou o título da página, mas também houve promoção e um criador citou seu produto. Não dá para dizer que só o título causou o aumento.','Erros comuns: concluir com poucos dados, mudar várias coisas ao mesmo tempo, ignorar fatores externos, olhar apenas uma métrica isolada e atribuir sucesso ou fracasso a um único motivo sem testar.','Duas coisas que variam juntas não provam que uma causa a outra. Registre mudanças, teste uma variável por vez e analise várias métricas em conjunto antes de tomar decisões, mantendo cautela nas conclusões.'))];
M.find(x=>x.n==='Métricas e Análise').l.push(L('Reembolsos e recompra',Q('Reembolso é quando o cliente pede o dinheiro de volta depois de comprar, dentro das regras de garantia e da plataforma. Recompra é quando um cliente que já comprou volta a comprar de você. São duas métricas que mostram a satisfação depois da venda.','A taxa de reembolso ajuda a perceber se o produto, a oferta ou a promessa estão gerando frustração. A taxa de recompra mostra se os clientes ficaram satisfeitos o bastante para voltar, e permite estimar quanto vale cada cliente ao longo do tempo.','Taxa de reembolso é igual aos reembolsos divididos pelas vendas, vezes 100. Taxa de recompra é igual aos clientes que compraram mais de uma vez divididos pelo total de clientes, vezes 100. Elas variam por produto, público e período de análise.',['Registre vendas, reembolsos e motivos informados pelos clientes.','Calcule a taxa de reembolso por produto e por origem das vendas.','Leia os motivos e corrija promessas, páginas ou entregas problemáticas.','Acompanhe a recompra para entender quem volta a comprar.'],'Exemplo hipotético: de 50 vendas, 4 foram reembolsadas, o que dá uma taxa de 8%. Se os motivos mostram que a pessoa esperava outra coisa, a página de vendas precisa explicar melhor o que é entregue. Em uma loja fictícia, 10 de 100 clientes voltaram a comprar, taxa de recompra de 10%.','Erros comuns: ignorar os motivos dos reembolsos, tentar dificultar pedidos que seguem as regras, calcular o resultado de uma campanha sem descontar os reembolsos, olhar a recompra em períodos curtos demais e não diferenciar produtos diferentes.','Reembolsos mostram frustração e recompras mostram satisfação. Acompanhe as duas taxas, leia os motivos dos pedidos e ajuste a promessa e a entrega, lembrando de descontar reembolsos ao calcular o resultado real de uma campanha.')),L('Análise de campanhas',Q('Análise de campanhas é o estudo dos resultados de uma ação de divulgação, orgânica ou paga, comparando o que foi planejado com o que aconteceu. Ela reune dados como alcance, cliques, conversões, custos e receita em uma visão única e organizada.','Serve para decidir o que manter, ajustar ou encerrar. Sem análise, você repete erros e gasta dinheiro sem saber o motivo. Com ela, você descobre quais públicos, criativos e mensagens trazem melhor resultado em relação ao custo.','Você define antes o objetivo e as métricas de sucesso, registra os dados durante a campanha e compara no final. Olha o funil completo: impressões, cliques, visitas, conversões, custo por venda e margem. Assim, percebe em qual etapa houve perda.',['Defina o objetivo da campanha e as métricas antes de começar.','Registre os dados em uma planilha com data e investimento.','Compare as etapas do funil e os custos por resultado.','Escreva o que aprendeu e o que será testado na próxima campanha.'],'Exemplo hipotético: uma campanha fictícia de R$ 200 teve 20.000 impressões, 300 cliques, 12 vendas e CPA de cerca de R$ 16,70. Como cada venda deixa R$ 22 de margem, a campanha teve resultado positivo, mas o teste precisa ser repetido para confirmar.','Erros comuns: analisar sem objetivo definido, olhar apenas cliques, esquecer custos e reembolsos, encerrar a campanha cedo demais com poucos dados, não registrar o que foi mudado e não guardar os aprendizados para o próximo teste.','Analisar campanhas é comparar planejamento e resultado em todas as etapas do funil, considerando custos e reembolsos. Registre dados e aprendizados para que cada campanha melhore a próxima, sem tratar um único resultado como garantia.')),L('Identificação de gargalos',Q('Gargalo é a etapa do processo em que mais pessoas deixam de avançar, limitando o resultado final. Pode estar no conteúdo, na página, no preço, no checkout ou no atendimento. Identificar o gargalo mostra onde vale concentrar esforço primeiro.','Serve para priorizar melhorias. Melhorar uma etapa que já funciona bem traz pouco efeito; corrigir a etapa em que a maioria desiste costuma gerar mais impacto. Também evita gastar mais em divulgação quando o problema está depois do clique.','Você calcula a taxa de passagem entre cada etapa do funil e procura a menor. Depois, levanta hipóteses para explicar a queda, como página lenta, dúvidas sem resposta ou preço confuso, e testa uma de cada vez para confirmar.',['Liste as etapas do caminho, do primeiro contato até a compra.','Calcule a taxa de passagem de cada etapa para a seguinte.','Escolha a etapa com a maior perda e levante hipóteses.','Teste uma mudança por vez e acompanhe o resultado.'],'Exemplo hipotético: de 1.000 visitas, 300 chegam à página de vendas, 30 chegam ao checkout e 6 compram. A maior queda está entre a página e o checkout, de 300 para 30. Esse pode ser o gargalo, e a página ou o preço merecem teste.','Erros comuns: tentar melhorar tudo ao mesmo tempo, corrigir a etapa errada, concluir a causa sem testar, ignorar o tempo de carregamento no celular e culpar o público em vez de revisar a experiência oferecida.','Gargalo é a etapa em que mais gente desiste. Calcule a taxa de cada passagem, concentre-se na maior perda e teste hipóteses uma a uma, sem presumir a causa antes de verificar com dados.')),L('Comparação de resultados ao longo do tempo',Q('Comparar resultados ao longo do tempo é olhar as mesmas métricas em períodos diferentes, como semana contra semana ou mês contra mês, para perceber tendências, melhorias e quedas. A comparação precisa ser feita com critérios iguais.','Serve para saber se a estratégia está evoluindo, se uma mudança teve efeito aparente e se existe sazonalidade. Um número isolado diz pouco; a sequência de números mostra o caminho e ajuda a planejar os próximos passos.','Você registra as métricas em intervalos regulares, na mesma ordem e com a mesma fórmula, e compara com períodos de duração parecida. Considera fatores externos, como datas comemorativas, promoções e mudanças de plataforma, que podem influenciar os números.',['Escolha de 3 a 5 métricas principais e a frequência de análise.','Registre os valores em uma planilha com data e observações.','Compare com períodos equivalentes e anote o que mudou.','Decida o próximo teste com base na tendência, não em um dia isolado.'],'Exemplo hipotético: a taxa de conversão foi 2,0% na semana 1, 2,4% na semana 2 e 2,2% na semana 3. A variação pode ser normal, e não prova melhora. Depois de 8 semanas, se a média ficar acima de 2,3%, há mais segurança para concluir algo.','Erros comuns: comparar períodos muito diferentes, mudar a fórmula no meio do caminho, reagir a oscilações de um único dia, ignorar sazonalidade e promoções, e não anotar as mudanças feitas, o que impede entender o que influenciou os números.','Compare períodos equivalentes com a mesma fórmula e registre o que mudou. Tendências ao longo de semanas dizem mais do que um dia isolado, mas nenhuma comparação prova sozinha a causa de uma melhora ou de uma queda.')));
let TAB=0;const TABS=['Copywriting e comunicação','Planejamento de conteúdo','Planejamento de vendas','Calculadoras','Recursos com IA'];
const TA="style='background:#0a0a0b;border:1px solid #26262b;color:#fff;border-radius:10px;padding:12px;width:100%;min-height:150px;font:inherit;margin:10px 0'";
const TP=[[0,'Modelos de títulos','Títulos curtos e claros ajudam a pessoa a entender rapidamente o assunto e o benefício. Troque os trechos entre colchetes pelo seu produto e público, mantenha a promessa realista e evite exageros. Teste duas ou três versões e compare os cliques antes de escolher a melhor.','Como [resultado] em [tempo realista] sem [obstáculo]\n3 erros que fazem [público] perder [algo] e como evitar\nO guia simples para [objetivo] mesmo começando do zero\n[Número] perguntas para fazer antes de comprar [produto]\nPor que [problema] acontece e o que fazer a respeito'],[0,'Estruturas de copy: AIDA e PAS','AIDA organiza o texto em Atenção, Interesse, Desejo e Ação. PAS segue Problema, Agitação e Solução, mostrando a dificuldade, suas consequências reais e o caminho. Adapte ao produto e ao público, sem inventar problemas nem prometer resultados que não pode garantir.','AIDA\nAtenção: [frase que chama a atenção do público]\nInteresse: [explique o problema ou a novidade]\nDesejo: [mostre benefícios reais e provas verdadeiras]\nAção: [próximo passo claro]\n\nPAS\nProblema: [descreva a dificuldade]\nAgitação: [consequência real de não resolver, sem exagerar]\nSolução: [apresente o produto como caminho possível]'],[0,'Modelos de chamada para ação (CTA)','Uma boa chamada para ação diz exatamente o que a pessoa deve fazer e o que ela recebe ao fazer. Use verbos claros, uma ação por vez e linguagem honesta. Evite pressionar ou criar urgência falsa, e combine o CTA com o estágio em que a pessoa está.','Salve este conteúdo para consultar depois\nBaixe o modelo gratuito pelo link da bio\nVeja como funciona a [produto] na página\nComente [palavra] e eu explico em detalhes\nConheça as condições e escolha com calma'],[0,'Estrutura de página de vendas','A página de vendas precisa responder as dúvidas da pessoa na ordem em que elas surgem. Comece pelo benefício, explique o que é entregue, mostre provas verdadeiras, trate objeções e termine com preço e chamada para ação. Revise para não prometer o que o produto não faz.','1. Título com o benefício principal\n2. Para quem é (e para quem não é)\n3. O problema que resolve\n4. O que está incluso\n5. Como funciona, passo a passo\n6. Provas verdadeiras e autorizadas\n7. Perguntas frequentes\n8. Preço, garantia e formas de pagamento\n9. Chamada para ação'],[0,'Modelo de e-mail marketing','Um e-mail eficiente tem assunto claro, uma ideia principal e um único próximo passo. Envie apenas para quem autorizou receber, informe como sair da lista e escreva como se falasse com uma pessoa. Teste assuntos diferentes e acompanhe aberturas, cliques e cancelamentos.','Assunto: [benefício ou dúvida em poucas palavras]\n\nOlá, [nome],\n\n[1 parágrafo sobre o problema ou assunto]\n\n[1 parágrafo com a dica ou a solução]\n\n[Chamada para ação: link ou resposta]\n\nAbraços, [seu nome]\nPara deixar de receber, clique em [link de cancelamento].'],[0,'Modelo de legenda','Uma legenda forte começa com um gancho claro, entrega uma informação útil e termina com uma chamada para ação simples. Mantenha parágrafos curtos e use as palavras do público. Se for divulgação de produto, deixe claro quando houver parceria ou link de afiliado.','[Gancho em uma frase]\n\n[Explique o problema em 1 ou 2 linhas]\n\n[Dica ou passo a passo em 3 itens]\n\n[Chamada para ação: salvar, comentar ou clicar]\n\n[Aviso de divulgação, se houver]'],[1,'Roteiro de vídeo curto','Um roteiro simples evita improviso e mantém o vídeo focado em uma ideia. Defina o gancho dos primeiros segundos, o desenvolvimento em poucos passos e uma chamada para ação. Leia em voz alta para ajustar o ritmo e corte tudo que não ajuda o espectador.','Ideia única: [tema]\nGancho (0-3s): [frase que prende]\nProblema (3-8s): [dúvida do público]\nSolução (8-25s): [3 passos curtos]\nChamada para ação (final): [salvar, comentar ou clicar]\nLegenda e hashtags: [texto]'],[1,'Calendário editorial','O calendário organiza o que será publicado, onde e com qual objetivo. Defina poucos pilares de conteúdo, uma frequência que você consegue manter e revise a cada mês com base nos resultados. Preencha os campos e ajuste sem rigidez conforme aprender com o público.','Semana: [datas]\nSegunda: [tema] | [formato] | [objetivo]\nQuarta: [tema] | [formato] | [objetivo]\nSexta: [tema] | [formato] | [objetivo]\nPilares: [1] [2] [3]\nResultados da semana: [alcance, cliques, aprendizados]'],[1,'Checklist de revisão de conteúdo',['O assunto está claro já nos primeiros segundos ou linhas?','Existe uma única ideia principal?','As informações são verdadeiras e conferidas?','A linguagem é simples e sem termos não explicados?','Há uma chamada para ação clara?','A divulgação comercial está identificada, se houver?','Imagens, áudio e legenda estão legíveis no celular?'],'Use esta lista antes de publicar. Revisar o conteúdo em poucos minutos evita erros de informação, promessas exageradas e mensagens confusas. Marque os itens na tela; nada é salvo, então refaça a revisão a cada publicação e ajuste os pontos que mais falham.'],[1,'Briefing de produto','O briefing reune as informações essenciais sobre o produto antes de criar conteúdo ou anúncios. Quanto mais claro e verdadeiro, menos chance de promessas erradas. Preencha com dados reais do produto, confirme as regras do vendedor e atualize sempre que algo mudar.','Produto: [nome]\nTipo: [físico ou digital]\nPara quem é: [público]\nProblema que resolve: [descrição]\nPrincipais benefícios: [3 itens verdadeiros]\nO que NÃO faz: [limites]\nPreço e condições: [valores, garantia, prazo]\nRegras de divulgação: [do produtor ou plataforma]'],[2,'Checklist para preparar uma oferta',['O problema do público está descrito com clareza?','O benefício principal cabe em uma frase?','O que está incluso está listado sem exageros?','Preço, prazo e garantia estão visíveis?','As dúvidas mais comuns têm resposta?','O caminho até o checkout funciona no celular?','Existe um jeito simples de pedir suporte?'],'Antes de divulgar ou anunciar, confira se a oferta está pronta para ser entendida e comprada. Uma oferta confusa desperdiça tráfego, mesmo com bom conteúdo. Use a lista para encontrar falhas simples e corrija antes de investir tempo ou dinheiro.'],[2,'Planejamento de campanha','Planejar a campanha antes de começar evita gastar sem rumo. Defina objetivo, público, criativos, orçamento máximo e como medir. Escreva também o que você fará se o resultado for bom ou ruim, para decidir com calma e não no impulso.','Objetivo: [cadastros, visitas ou vendas]\nPúblico: [descrição]\nOferta e destino: [página ou link]\nCriativos: [versão A] | [versão B]\nOrçamento máximo: R$ [valor] por [período]\nMétricas: [cliques, conversões, custo por resultado]\nSe der certo: [ação]\nSe der errado: [ação]'],[2,'Estrutura para organizar um funil','Desenhar o funil no papel mostra onde as pessoas entram, o que veem e qual é o próximo passo em cada etapa. Preencha cada etapa com o conteúdo e a métrica que você vai acompanhar. Comece simples e só aumente o funil depois de testar o básico.','Entrada: [conteúdo ou anúncio] | Métrica: [alcance ou cliques]\nInteresse: [perfil ou página de captura] | Métrica: [visitas]\nConsideração: [e-mails, provas, perguntas] | Métrica: [cadastros]\nDecisão: [página de vendas e checkout] | Métrica: [conversão]\nPós-compra: [suporte e relacionamento] | Métrica: [reembolsos e recompra]'],[2,'Checklist de revisão da página de vendas',['O título mostra o benefício principal?','Está claro para quem o produto serve e para quem não serve?','As provas e depoimentos são verdadeiros e autorizados?','Preço, garantia e prazo estão fáceis de achar?','As perguntas frequentes respondem as principais dúvidas?','A página carrega rápido no celular?','Todos os links e botões funcionam?'],'Revise a página como se fosse um cliente que nunca viu o produto. Procure dificuldades de entendimento, promessas exageradas e links quebrados. Peça que outra pessoa teste a compra do início ao fim e anote onde ela teve dúvidas.']];
function tpls(t){return TP.filter(x=>TABS[x[0]]===t).map(x=>{const i=TP.indexOf(x),ck=Array.isArray(x[2]);return `<div class='card'><b>${x[1]}</b><p class='sub' style='margin:8px 0'>${ck?x[3]:x[2]}</p>${ck?x[2].map(c=>`<label style='display:block;text-transform:none;letter-spacing:0;font-size:14px;color:#f2f2f4;margin:6px 0'><input type='checkbox' style='width:auto;margin-right:8px'>${c}</label>`).join(''):`<textarea id='t${i}' ${TA}>${x[3].replace(/</g,'&lt;')}</textarea><button class='btn g' onclick='cp(${i})'>Copiar texto</button>`}</div>`}).join('')}
function cp(i){const e=document.getElementById('t'+i);try{navigator.clipboard.writeText(e.value)}catch(x){e.select()}}
const CAL=[['Taxa de conversão','Conversões ÷ visitas × 100','Mostra qual percentual das pessoas que chegaram a uma página ou anúncio realizou a ação desejada, como comprar ou se cadastrar. Use para comparar versões e etapas do funil sempre com períodos e públicos parecidos.',['Visitas','Conversões'],v=>v[0]>0?[f(v[1]/v[0]*100)+'%','De cada 100 visitas, cerca de '+f(v[1]/v[0]*100)+' realizaram a ação. Compare com outros períodos antes de concluir algo.']:null],['Ticket médio','Receita ÷ número de vendas','O ticket médio indica quanto cada compra vale, em média. Ele ajuda a planejar preços, ofertas e quanto pode ser investido para conquistar um cliente, mas precisa ser lido junto com a margem e os custos.',['Receita (R$)','Vendas'],v=>v[1]>0?['R$ '+f(v[0]/v[1]),'Cada venda rendeu em média R$ '+f(v[0]/v[1])+'. Isso é receita, não lucro.']:null],['Receita','Preço × número de vendas','A receita é o total recebido pelas vendas antes de descontar custos, taxas e despesas. Serve como ponto de partida para outras contas, mas sozinha não mostra se o negócio está tendo ganho ou prejuízo.',['Preço (R$)','Vendas'],v=>['R$ '+f(v[0]*v[1]),'Com essas vendas, o total recebido seria R$ '+f(v[0]*v[1])+'. Ainda falta descontar custos para saber o lucro.']],['Custos e lucro estimado','(Preço − custo unitário) × vendas − outras despesas','Estima quanto sobra depois dos custos do produto e das despesas do período, como anúncios e ferramentas. É uma estimativa: inclua taxas, frete e impostos aplicáveis ao seu caso para não superestimar o ganho.',['Preço (R$)','Custo por unidade (R$)','Vendas','Outras despesas (R$)'],v=>{const l=(v[0]-v[1])*v[2]-v[3];return [(l<0?'− ':'')+'R$ '+f(Math.abs(l)),l>=0?'Lucro estimado positivo de R$ '+f(l)+'. Confira se todos os custos foram incluídos.':'Resultado estimado negativo de R$ '+f(Math.abs(l))+'. Revise preço, custos ou despesas.']}],['Margem de contribuição','Preço − custos variáveis','A margem de contribuição é o que sobra de cada venda depois dos custos que variam com ela, como produto, taxas e frete. Esse valor ajuda a pagar as outras despesas e gerar lucro, e define quanto pode ser gasto para conseguir um cliente.',['Preço (R$)','Custos variáveis por venda (R$)'],v=>v[0]>0?['R$ '+f(v[0]-v[1])+' ('+f((v[0]-v[1])/v[0]*100)+'%)','Cada venda deixa R$ '+f(v[0]-v[1])+', ou '+f((v[0]-v[1])/v[0]*100)+'% do preço, para cobrir as demais despesas.']:null],['Custo por aquisição (CPA)','Gasto com divulgação ÷ número de vendas','O CPA mostra quanto foi gasto, em média, para conseguir uma venda ou cliente. Compare com a margem de contribuição: se o CPA for maior que a margem, a campanha dá prejuízo, mesmo com vendas.',['Gasto (R$)','Vendas'],v=>v[1]>0?['R$ '+f(v[0]/v[1]),'Cada venda custou em média R$ '+f(v[0]/v[1])+' de divulgação. Compare com a margem de cada venda.']:null]];
function calcs(){return CAL.map((c,i)=>`<div class='card'><b>${c[0]}</b><p class='sub' style='margin:8px 0'>${c[2]}</p><p style='font-size:13px'>Fórmula: ${c[1]}</p>${c[3].map((n,j)=>`<label>${n}</label><input id='k${i}_${j}' type='number' min='0' step='any'>`).join('')}<button class='btn' onclick='calc(${i})'>Calcular</button><div id='o${i}' style='margin-top:14px'></div></div>`).join('')}
function calc(i){const c=CAL[i],v2=c[3].map((_,j)=>parseFloat(document.getElementById('k'+i+'_'+j).value)),ok=v2.every(x=>isFinite(x)&&x>=0),r=ok?c[4](v2):null;document.getElementById('o'+i).innerHTML=r?`<div class='res'>${r[0]}</div><p class='sub'>${r[1]}</p>`:`<p class='sub'>Preencha todos os campos com números válidos, iguais ou maiores que zero, e use valores maiores que zero nos campos usados como divisor.</p>`}
function ia(){return `<div class='card'><b>Recursos com inteligência artificial</b><p class='sub' style='margin:8px 0'>Esta plataforma não possui integração com nenhuma IA. Por isso, não existe aqui um gerador automático de títulos, textos, roteiros ou e-mails, e nada na plataforma finge gerar conteúdo sozinho.</p><p class='sub'>Em vez disso, use os modelos editáveis das outras abas: preencha os campos entre colchetes com os dados do seu produto e público. Se quiser a ajuda de uma IA externa, copie o modelo preenchido para a ferramenta que preferir e sempre revise o resultado antes de publicar.</p></div>`}
function tools(t){if(t!==undefined)TAB=t;E(`<div class='eb'>Ferramentas</div><h1>BRYNOX Tools</h1><p class='sub'>Ferramentas práticas para aplicar o que você aprende. Nada é salvo: copie o que precisar.</p><div class='bar' style='margin:0 0 20px;justify-content:flex-start'>${TABS.map((x,i)=>`<button class='btn ${i==TAB?'':'g'}' onclick='tools(${i})'>${x}</button>`).join('')}</div>`+(TAB==3?calcs():TAB==4?ia():tpls(TABS[TAB])))}
Object.assign(D,{24:['Segmentação de anúncios é a escolha de quem verá sua publicidade, usando critérios que a plataforma oferece, como localização, idade, interesses, comportamentos e intenção de busca. Em vez de mostrar o anúncio a todos, você direciona a quem tem mais chance de se interessar.','Serve para reduzir o desperdício de dinheiro e aumentar a relevância do anúncio. Quando a mensagem chega a quem tem o problema que o produto resolve, o custo por clique e por resultado tende a ser mais saudável, embora nenhum resultado seja garantido.','A plataforma permite combinar critérios para formar públicos. Quanto mais específico, mais direcionado, mas públicos muito pequenos limitam a entrega e encarecem os testes. As opções disponíveis mudam ao longo do tempo e variam por plataforma e país.',['Descreva seu cliente ideal com base em conversas e dados reais.','Escolha critérios disponíveis na plataforma que representem esse perfil.','Crie dois ou três públicos diferentes, com tamanho suficiente para teste.','Rode o mesmo anúncio e compare custo por clique e conversões.'],'Exemplo hipotético: uma loja fictícia de planilhas de finanças cria dois públicos, um de jovens de 20 a 30 anos interessados em finanças pessoais e outro de freelancers. Com o mesmo anúncio e R$ 25 em cada, compara qual traz mais cadastros.','Erros comuns: segmentar tanto que o público fica pequeno demais, usar interesses amplos sem teste, ignorar as políticas de anúncios sobre uso de dados e critérios, mudar o público e o criativo ao mesmo tempo e concluir com poucos dados.','Compare custo por clique, taxa de conversão e custo por aquisição entre os públicos testados, no mesmo período e com orçamento parecido. Observe também a qualidade das pessoas que chegam, como tempo na página e perguntas que fazem.','Segmentar é escolher bem quem verá o anúncio, usando critérios permitidos e testando públicos de tamanho adequado. A segmentação ajuda a gastar melhor, mas depende de teste e não garante vendas.','Use ao criar qualquer campanha paga, ao lançar um produto para um público novo, quando o custo por resultado estiver alto ou quando o anúncio estiver sendo exibido a pessoas pouco interessadas no que você oferece.'],25:['Criativos publicitários são os elementos visuais e textuais do anúncio: imagem ou vídeo, título, texto e botão. Eles são a parte que o público realmente vê e que decide se vai ignorar ou clicar, por isso precisam comunicar a oferta com clareza e honestidade.','Servem para chamar atenção no meio de muitos conteúdos e explicar rapidamente o benefício do produto. Um bom criativo atrai o público certo e filtra quem não tem interesse, reduzindo cliques inúteis e custos desnecessários com a campanha.','O criativo precisa ser coerente com o público, com a oferta e com a página de destino. Em poucos segundos, a pessoa deve entender o que é o produto e o que ganha. Se o anúncio promete algo que a página não mostra, a pessoa sai e o investimento é perdido.',['Escolha um único benefício principal para destacar no anúncio.','Use imagem ou vídeo claro, que mostre o produto ou o resultado possível.','Escreva um texto curto, com chamada para a ação específica e honesta.','Crie de duas a três versões para comparar o desempenho.'],'Exemplo hipotético: para uma planilha de finanças, um vídeo de 15 segundos mostra a tela preenchida, o texto diz Organize seu salário em 10 minutos e o botão leva à página com o mesmo título. Tudo conversa entre si.','Erros comuns: prometer resultados exagerados, usar imagens que não pertencem a você, colocar texto demais, esconder o produto, fazer um anúncio diferente da página de destino e usar técnicas enganosas que violam as políticas da plataforma.','Compare a taxa de cliques, o custo por clique e a taxa de conversão entre os criativos. Se o CTR é alto e a conversão baixa, o anúncio pode estar atraindo pessoas erradas ou prometendo algo que a página não cumpre.','Um criativo eficiente é claro, honesto e coerente com a oferta e a página de destino. Ele chama atenção para o benefício principal e deve ser testado em mais de uma versão, sem prometer o que não entrega.','Use em toda campanha paga, ao lançar uma oferta nova, quando o CTR estiver baixo, quando os anúncios estiverem cansando o público ou ao preparar testes entre diferentes abordagens de comunicação.'],26:['Teste A/B de anúncios é a comparação entre duas versões de um anúncio que diferem em um único elemento, como o título, a imagem ou a chamada para ação. Elas rodam ao mesmo tempo, em condições parecidas, para descobrir qual tem melhor desempenho.','Serve para decidir com dados, e não por opinião, o que comunicar melhor com o público. Também ajuda a reduzir desperdício, pois você passa a investir na versão com melhor resultado e aprende o que o público valoriza.','A plataforma exibe as duas versões a grupos semelhantes e mede cliques, conversões e custos. Para que o teste seja confiável, apenas uma variável deve mudar, o orçamento deve ser parecido e o teste precisa durar o suficiente para reunir dados.',['Defina a pergunta do teste, como qual título gera mais cliques.','Crie duas versões que só diferem nesse elemento.','Use o mesmo público, período e orçamento nas duas.','Espere dados suficientes antes de decidir e registre o aprendizado.'],'Exemplo hipotético: uma loja fictícia testa dois ganchos para o mesmo vídeo, A com uma pergunta e B com um número. Com R$ 25 em cada, A teve CTR de 0,9% e B de 1,3%. Se a diferença se repetir em outro teste, B pode ser mantida.','Erros comuns: mudar várias coisas ao mesmo tempo, encerrar o teste cedo com poucos dados, comparar versões com orçamentos muito diferentes, olhar apenas cliques sem observar conversões e tratar uma vitória isolada como regra definitiva.','Compare as métricas ligadas ao objetivo, como custo por resultado e taxa de conversão, e não apenas cliques. Verifique se a diferença se mantém ao repetir o teste, pois pequenas variações podem ser apenas acaso.','Teste A/B compara duas versões alterando uma coisa por vez, com dados suficientes e condições parecidas. Ele orienta decisões melhores, mas os resultados dependem de público e momento e precisam ser repetidos.','Use quando houver dúvida entre duas ideias, quando o desempenho estiver abaixo do esperado, ao lançar um anúncio importante ou quando houver volume suficiente de visualizações para comparar versões de forma justa.'],27:['Remarketing é a estratégia de se comunicar novamente com pessoas que já tiveram contato com sua marca, por meio de anúncios ou mensagens, como e-mails enviados a quem se cadastrou com consentimento. O objetivo é lembrar e continuar a conversa com quem já demonstrou interesse.','Serve para reaproveitar o interesse que já existe. Muitas pessoas não decidem na primeira visita; um lembrete bem feito, com informação útil, pode ajudar quem estava considerando a compra, sem substituir uma boa oferta e uma boa experiência.','Você forma listas de pessoas que interagiram, como quem se cadastrou, assistiu um vídeo ou abriu uma página. Depois cria mensagens diferentes para cada grupo. O uso de dados deve seguir as regras de privacidade e as políticas de cada plataforma.',['Defina quem entra na lista, como cadastrados ou quem viu um vídeo.','Crie uma mensagem diferente da primeira, com informação nova ou resposta a dúvidas.','Limite a frequência para não cansar as pessoas.','Remova quem já comprou ou não quer mais receber mensagens.'],'Exemplo hipotético: quem baixou o checklist gratuito de uma loja fictícia recebe, dias depois, um e-mail com uma dica extra e um convite para conhecer a planilha completa, com opção clara de cancelar o recebimento.','Erros comuns: insistir com a mesma mensagem, ignorar o consentimento e as regras de privacidade, não excluir quem já comprou, exagerar na frequência, usar dados de forma não permitida e tratar todos os contatos como se estivessem no mesmo estágio.','Acompanhe taxa de abertura, cliques, conversões, cancelamentos e custo por venda recuperada. Se muita gente cancela ou ignora, reduza a frequência e revise a mensagem. Compare com um grupo que não recebeu para estimar o efeito.','Remarketing reconecta com quem já se interessou, usando mensagens úteis e diferentes da primeira, com consentimento, frequência controlada e respeito à privacidade. Funciona como lembrete, e não como garantia de venda.','Use depois de cadastros, vídeos assistidos ou conversas iniciadas, quando a pessoa demonstrou interesse e não decidiu. Evite com quem pediu para não receber mensagens ou com quem já comprou aquele mesmo produto.'],28:['Retargeting de visitantes é a exibição de anúncios para pessoas que visitaram seu site ou páginas específicas, usando ferramentas de medição das plataformas, como cookies ou pixels. Diferente do remarketing por e-mail, ele depende de dados de navegação e das regras de consentimento.','Serve para lembrar quem visitou uma página e saiu sem concluir a ação, como ver o produto e não comprar. Pode trazer de volta pessoas já interessadas por um custo menor que o de alcançar públicos novos, mas exige cuidado com a privacidade.','Você instala o código de medição, informa os visitantes conforme as regras aplicáveis e cria listas por página visitada. Depois exibe anúncios específicos, como lembrar do produto visto ou responder uma dúvida comum. Regras e limites mudam com as políticas e leis.',['Instale a ferramenta de medição e cumpra as regras de consentimento e privacidade.','Crie listas por etapa, como quem viu o produto ou chegou ao checkout.','Faça anúncios diferentes para cada etapa, com informação útil.','Exclua quem já comprou e limite a frequência dos anúncios.'],'Exemplo hipotético: alguém visita a página da planilha de uma loja fictícia e sai sem comprar. Nos dias seguintes, vê um anúncio mostrando as perguntas frequentes e a garantia, e pode voltar à página para decidir com mais segurança.','Erros comuns: não informar o uso de ferramentas de medição, mostrar o mesmo anúncio muitas vezes, não excluir compradores, criar listas pequenas demais, esperar resultados mágicos e usar o retargeting para esconder uma página de vendas fraca.','Acompanhe custo por conversão recuperada, frequência média, taxa de cliques e vendas atribuídas. Compare com campanhas de público novo para ver se o retargeting realmente adiciona vendas ou apenas atribui a ele compras que aconteceriam de qualquer modo.','Retargeting de visitantes lembra quem já viu sua página, usando ferramentas de medição com respeito à privacidade, listas por etapa e frequência controlada. Ele ajuda a recuperar interesse, mas não corrige uma oferta ou página fracas.','Use quando já houver volume de visitas, quando a página de vendas tiver muitos visitantes sem compra ou ao divulgar uma oferta nova. Evite quando não for possível cumprir as regras de privacidade e medição.']});
function tech(){let n=0;E(`<div class='eb'>Biblioteca</div><h1>As 80 Técnicas</h1><p class='sub'>80 técnicas em 12 categorias. Escolha qualquer uma. Nenhuma garante vendas: teste e meça.</p>${C.map(c=>`<h2>${c[0]}</h2><div class='grid'>${c[1].map(t=>{const j=n++;return `<div class='tile' onclick='go(${j})'>${String(j+1).padStart(2,'0')} · ${t}${D[j]?'':'<small>Texto em preparação</small>'}</div>`}).join('')}</div>`).join('')}`)}
function tk(j){j=+j;const d=D[j];const s=(h,x)=>`<h2>${h}</h2><p>${x}</p>`;E(`<span class='back' onclick='goList()'>← Voltar à lista</span><div class='eb' style='margin-top:22px'>Técnica ${String(j+1).padStart(2,'0')} de 80</div><h1>${N[j]}</h1>${d?s('O que é',d[0])+s('Para que serve',d[1])+s('Como funciona',d[2])+(d[8]?s('Quando utilizar',d[8]):'')+`<h2>Como aplicar na prática</h2><ol>${d[3].map(x=>`<li>${x}</li>`).join('')}</ol>`+s('Exemplo prático',d[4])+s('Erros comuns',d[5])+s('Como avaliar os resultados',d[6])+`<div class='card key'><div class='eb'>Resumo prático</div><b>${d[7]}</b></div>`:`<div class='card'>O texto completo desta técnica ainda não foi escrito. A biblioteca está sendo publicada por partes.</div>`}<div class='bar'><button class='btn g' ${j?'':'disabled'} onclick='go(${j-1})'>← Anterior</button><button class='btn' ${j<79?'':'disabled'} onclick='go(${j+1})'>Próxima →</button></div>`)}
const KEEP=[...Array(29).keys(),30,31,32,36,40,41,43,45,50,51,56,58,61,62,63,64,69,72,76,78,79];
Object.assign(D,{30:['Controle de orçamento publicitário é a prática de definir antecipadamente quanto você pode investir em anúncios, como esse valor será dividido entre campanhas e testes e quando você vai revisar ou interromper o gasto. Ele transforma o investimento em algo planejado, e não em impulso.','Serve para evitar perdas que comprometam suas finanças e para dar previsibilidade aos testes. Com um limite claro, você consegue aprender com pouco dinheiro, decidir com base em dados e impedir que uma campanha mal configurada consuma mais do que você poderia perder.','Você define um valor total e um valor diário, divide entre poucos testes e acompanha o gasto e os resultados com frequência. A plataforma cobra conforme a configuração, então é preciso conferir os limites configurados e pausar anúncios que gastam sem trazer resultados relevantes.',['Defina um valor total que você pode perder sem prejudicar suas contas.','Divida o valor entre dois ou três testes pequenos, com prazo definido.','Configure limites diários ou totais na plataforma e confira se foram salvos.','Revise os números todos os dias e pause o que não estiver funcionando.'],'Exemplo hipotético: uma loja fictícia define R$ 100 para testar uma planilha. Divide em dois anúncios de R$ 10 por dia durante cinco dias. No terceiro dia, um deles tem custo por clique muito mais alto e sem cadastros, então é pausado, e o restante do valor vai para o anúncio melhor.','Erros comuns: gastar sem limite definido, aumentar o orçamento rapidamente após um bom resultado isolado, investir dinheiro que faz falta, não conferir o gasto diário, esquecer anúncios ligados e comparar campanhas com valores muito diferentes sem ajustar a análise.','Compare o gasto total com as vendas e a margem obtida, calculando o custo por aquisição e o retorno sobre o investimento. Verifique se você respeitou o limite planejado e se as decisões de pausar ou ampliar foram baseadas em dados.','Defina quanto pode perder, divida em testes pequenos, acompanhe o gasto e só aumente o investimento com base em dados consistentes. O controle de orçamento protege você de perdas, mas não garante resultados positivos.','Use sempre que for anunciar, principalmente em suas primeiras campanhas, ao testar uma oferta nova, ao trabalhar com poucos recursos ou quando o custo por resultado estiver aumentando sem explicação clara.'],31:['Otimização de campanhas é o processo de ajustar anúncios, públicos, orçamento e páginas de destino com base nos dados coletados, para melhorar o resultado em relação ao custo. É um trabalho contínuo de observar, testar uma mudança e comparar o efeito.','Serve para reduzir desperdício e aumentar a eficiência do investimento. Em vez de manter uma campanha sem mudanças, você identifica o que funciona, amplia com cuidado e encerra o que não traz retorno, usando as informações para decidir o próximo passo.','Você acompanha métricas ligadas ao objetivo, como custo por resultado, taxa de cliques e taxa de conversão. Depois compara anúncios, públicos e páginas, muda uma coisa por vez e espera dados suficientes. Mudanças muito frequentes atrapalham a análise e o aprendizado da plataforma.',['Defina a métrica principal que mostra se a campanha está funcionando.','Identifique o anúncio ou público com pior desempenho e o com melhor.','Mude uma coisa por vez, como o título ou o público, e registre a data.','Aguarde dados suficientes e compare com o período anterior.'],'Exemplo hipotético: um anúncio tem muitos cliques, mas poucos cadastros. A loja fictícia suspeita da página, simplifica o formulário e mantém todo o resto igual. Depois de alguns dias, compara a taxa de cadastro com a anterior antes de concluir se a mudança ajudou.','Erros comuns: mudar tudo ao mesmo tempo, decidir com poucos dados, encerrar anúncios cedo demais, aumentar muito o orçamento de uma vez, esquecer de registrar as mudanças feitas e otimizar apenas para cliques, sem observar vendas e custos.','Compare custo por resultado, taxa de conversão e retorno antes e depois de cada mudança, considerando fatores externos como datas e promoções. Registre o que mudou para entender o que influenciou os números, sem presumir causa sem evidências.','Otimizar é observar dados, mudar uma coisa por vez e comparar com cuidado. O objetivo é melhorar o retorno do investimento, e não existe ajuste que garanta resultados em todas as situações ou para todos os públicos.','Use depois que a campanha reunir dados suficientes, quando o custo por resultado estiver alto, quando o desempenho piorar com o tempo ou ao preparar o próximo ciclo de testes de anúncios.'],32:['Construção de comunidade é a criação de um espaço, como um grupo, canal ou perfil ativo, onde pessoas com interesse em comum conversam, trocam experiências e se sentem parte de algo. A marca atua como organizadora, e não apenas como vendedora.','Serve para fortalecer o relacionamento, a confiança e a lembrança de marca. Em uma comunidade ativa, as pessoas tiram dúvidas, ajudam umas às outras e compartilham ideias, o que gera feedback valioso para melhorar produtos e conteúdos.','Funciona quando há um tema claro, regras de convivência e participação constante de quem organiza. As pessoas permanecem se encontram valor, como aprendizado ou apoio. Isso exige tempo, moderação e paciência, pois comunidades se formam aos poucos.',['Defina o tema e o objetivo da comunidade e para quem ela é.','Escolha o canal onde seu público já está e crie regras simples de convivência.','Proponha conversas, perguntas e conteúdos úteis em frequência regular.','Escute os membros, responda com respeito e ajuste o que não funciona.'],'Exemplo hipotético: uma marca fictícia de planilhas cria um grupo para quem está organizando as finanças. Toda semana, propõe um desafio simples e pede que os membros compartilhem dúvidas, sem cobrar nenhuma compra para participar do grupo.','Erros comuns: usar a comunidade apenas para divulgar produtos, não moderar conversas, abandonar o espaço por semanas, ignorar críticas, criar regras confusas e tentar forçar participação, o que afasta as pessoas e prejudica a confiança.','Observe participação ativa, perguntas respondidas, permanência dos membros e feedbacks recebidos. Números de integrantes isolados dizem pouco; a qualidade das conversas e a recorrência dos participantes são sinais mais úteis.','Construir comunidade é criar um espaço útil e respeitoso onde as pessoas conversam e aprendem. Exige constância e moderação, não é um canal de venda rápida e os resultados aparecem a médio e longo prazo.','Use quando já houver um público interessado no tema, ao querer fortalecer o relacionamento, coletar feedback ou educar clientes. Evite se não houver tempo para moderar e participar de forma constante.'],36:['Marketing de influência é a parceria com pessoas que têm credibilidade e audiência em determinado tema para apresentar um produto ou marca ao público delas. A divulgação precisa ser identificada como parceria comercial e seguir as regras de cada plataforma.','Serve para alcançar pessoas novas por meio de alguém que elas já acompanham e consideram confiável. Pode aumentar a descoberta da marca, mas a influência depende da afinidade entre o criador, o público e o produto, e não garante vendas.','Você escolhe criadores cujo público se parece com o seu, combina o formato, as regras e o que será divulgado, e acompanha os resultados com links ou códigos próprios. A confiança que o público tem no criador é o principal ativo e deve ser respeitada.',['Pesquise criadores com público e valores alinhados ao seu produto.','Combine objetivos, formato, prazos, valores e regras de identificação da parceria.','Envie informações verdadeiras sobre o produto e deixe o criador testar, quando possível.','Acompanhe cliques, cadastros e vendas por link ou código exclusivo.'],'Exemplo hipotético: uma loja fictícia de capinhas envia o produto a um criador de tecnologia, que mostra o uso por uma semana e avisa que é parceria. O link exclusivo permite medir os cliques e as vendas vindas desse conteúdo.','Erros comuns: escolher apenas por número de seguidores, não identificar a parceria, pedir elogios falsos, não alinhar expectativas, não medir os resultados, escolher um criador sem afinidade com o produto e esperar vendas imediatas e garantidas.','Compare alcance, cliques, cadastros, vendas e custo por resultado de cada parceria, usando links ou códigos exclusivos. Observe também os comentários para entender se o público do criador tem interesse real no produto.','Marketing de influência funciona melhor com afinidade, transparência e medição. A parceria deve ser identificada e honesta, e os resultados dependem do público, do produto e da qualidade do conteúdo, sem garantia de vendas.','Use quando quiser alcançar um público novo, lançar um produto ou ganhar credibilidade em um nicho. Evite quando não for possível medir resultados ou quando não houver afinidade entre o criador e o produto.'],40:['AIDA é um modelo de estrutura de texto com quatro etapas: Atenção, Interesse, Desejo e Ação. Ele organiza uma mensagem de modo que a pessoa primeiro perceba o conteúdo, depois entenda por que importa, queira a solução e saiba qual é o próximo passo.','Serve para escrever anúncios, legendas, e-mails e páginas com uma ordem clara de ideias. Ajuda a evitar textos confusos ou sem direção, guiando a leitura até uma ação específica, como clicar, cadastrar ou conhecer uma oferta.','Na primeira etapa, uma frase relevante chama atenção. Em seguida, você desenvolve o interesse explicando o problema ou o contexto. No desejo, mostra benefícios reais e provas verdadeiras. Na ação, indica com clareza o que fazer. O modelo é um guia, e não uma fórmula garantida.',['Escreva uma abertura específica que fale diretamente com o público.','Explique o problema e por que ele importa para essa pessoa.','Mostre os benefícios do produto e provas verdadeiras, sem exagero.','Termine com um único próximo passo claro e honesto.'],'Exemplo hipotético: Cansado de ver o salário acabar antes do fim do mês? (atenção). Muita gente não sabe para onde o dinheiro vai (interesse). Uma planilha simples mostra seus gastos em 10 minutos (desejo). Baixe o modelo pelo link (ação).','Erros comuns: pular etapas, prometer resultados garantidos, usar provas inventadas, escrever uma abertura vaga, colocar várias chamadas para ação ao mesmo tempo e seguir o modelo de forma mecânica sem considerar o público e o contexto.','Compare a taxa de cliques e de resposta entre textos escritos com e sem essa estrutura, mantendo o mesmo público e período. Observe em que ponto as pessoas desistem da leitura para ajustar a etapa que está falhando.','AIDA organiza o texto em Atenção, Interesse, Desejo e Ação. Use como guia para dar ordem à mensagem, com informações verdadeiras, e lembre que nenhuma estrutura garante venda sem uma oferta que faça sentido.','Use ao escrever anúncios, legendas, e-mails e páginas de vendas, principalmente quando o texto parecer confuso ou não levar a nenhuma ação. Para conteúdos puramente educativos, outras estruturas podem funcionar melhor.']});
function tech(){E(`<div class='eb'>Biblioteca</div><h1>As 50 Técnicas</h1><p class='sub'>50 técnicas em 11 categorias. Escolha qualquer uma. Nenhuma garante vendas: teste e meça.</p>${C.map(c=>{const it=c[1].map(t=>N.indexOf(t)).filter(o=>KEEP.includes(o));return it.length?`<h2>${c[0]}</h2><div class='grid'>${it.map(o=>{const p=KEEP.indexOf(o);return `<div class='tile' onclick='go(${p})'>${String(p+1).padStart(2,'0')} · ${N[o]}${D[o]&&D[o][0].length>200?'':'<small>Texto em preparação</small>'}</div>`}).join('')}</div>`:''}).join('')}`)}
function tk(p){p=+p;const j=KEEP[p],d=D[j]&&D[j][0].length>200?D[j]:null;const s=(h,x)=>`<h2>${h}</h2><p>${x}</p>`;E(`<span class='back' onclick='goList()'>← Voltar à lista</span><div class='eb' style='margin-top:22px'>Técnica ${String(p+1).padStart(2,'0')} de 50</div><h1>${N[j]}</h1>${d?s('O que é',d[0])+s('Para que serve',d[1])+s('Como funciona',d[2])+(d[8]?s('Quando utilizar',d[8]):'')+`<h2>Como aplicar na prática</h2><ol>${d[3].map(x=>`<li>${x}</li>`).join('')}</ol>`+s('Exemplo prático',d[4])+s('Erros comuns',d[5])+s('Como avaliar os resultados',d[6])+`<div class='card key'><div class='eb'>Resumo prático</div><b>${d[7]}</b></div>`:`<div class='card'>O texto completo desta técnica ainda não foi escrito. A biblioteca está sendo publicada por partes.</div>`}<div class='bar'><button class='btn g' ${p?'':'disabled'} onclick='go(${p-1})'>← Anterior</button><button class='btn' ${p<49?'':'disabled'} onclick='go(${p+1})'>Próxima →</button></div>`)}
Object.assign(D,{41:['PAS é um modelo de texto com três partes: Problema, Agitação e Solução. Primeiro você descreve uma dificuldade real do público, depois mostra as consequências reais de não resolvê-la e, por fim, apresenta um caminho possível, que pode incluir o seu produto.','Serve para escrever mensagens que partem do que a pessoa já sente e sabe, em vez de começar pelo produto. Funciona bem em anúncios, legendas e páginas de vendas quando o problema é conhecido e o público procura alguma forma de resolvê-lo.','Na parte do problema, você mostra que entende a situação. Na agitação, explica com honestidade o que pode acontecer se nada mudar, sem exagerar nem assustar. Na solução, apresenta o caminho e para quem ele serve. O limite é ético: não inventar ou ampliar problemas.',['Escolha um problema específico e frequente do seu público.','Descreva as consequências reais com linguagem simples e sem dramatizar.','Apresente a solução e explique como ela ajuda, incluindo seus limites.','Finalize com um próximo passo claro e sem pressão.'],'Exemplo hipotético: Você recebe o salário e ele some antes do fim do mês (problema). Sem saber para onde vai o dinheiro, fica difícil planejar (agitação). Uma planilha simples mostra seus gastos em 10 minutos (solução). Veja como funciona.','Erros comuns: exagerar a dor para vender, inventar problemas que o público não tem, dramatizar demais, esconder as limitações da solução, usar o mesmo problema para todos os públicos e apresentar a solução como garantia de resultado.','Compare cliques, respostas e conversões de textos escritos nesse modelo com os de outras estruturas, no mesmo público e período. Leia os comentários para saber se as pessoas se reconheceram no problema descrito e se a solução ficou clara.','PAS parte do problema, mostra consequências reais e apresenta uma solução honesta. Use com respeito ao público, sem exageros, e lembre que o modelo organiza a mensagem, mas não garante que a pessoa vá comprar.','Use quando o público já reconhece o problema e procura soluções, em anúncios e páginas de vendas de produtos que resolvem uma dificuldade específica. Evite em temas sensíveis em que a dramatização poderia magoar as pessoas.'],43:['Uma chamada para ação, ou CTA, é a frase ou o botão que diz à pessoa qual é o próximo passo, como salvar, comentar, baixar, cadastrar ou conhecer um produto. Ela transforma a atenção em uma ação específica que pode ser medida.','Serve para evitar que a pessoa chegue ao fim de um conteúdo sem saber o que fazer. Uma boa chamada para ação facilita o caminho entre as etapas do funil e permite medir cliques, cadastros e respostas, ajudando a entender o que funciona.','Funciona quando é clara, específica e coerente com o momento da pessoa. Quem acabou de conhecer a marca tende a aceitar melhor um passo leve, como salvar ou seguir; quem já conhece a oferta pode estar pronto para um passo maior, como ver o preço.',['Defina uma única ação que você quer que a pessoa faça.','Use um verbo claro e diga o que ela recebe ao agir.','Combine a chamada com o estágio em que a pessoa está.','Teste variações e compare cliques ou respostas.'],'Exemplo hipotético: em um vídeo de dica, a chamada é Salve para consultar depois. Em um post sobre a planilha, é Baixe o modelo gratuito pelo link da bio. Em uma página de vendas, é Conheça as condições e escolha com calma.','Erros comuns: colocar várias chamadas ao mesmo tempo, usar frases vagas como clique aqui sem contexto, pressionar com urgência falsa, pedir uma compra a quem ainda não conhece a marca e não acompanhar os resultados de cada chamada.','Compare a taxa de cliques, de cadastros ou de respostas entre chamadas diferentes, mantendo o restante do conteúdo igual. Verifique também se o destino do clique funciona bem e se corresponde ao que a chamada prometeu.','Uma boa chamada para ação é clara, única e adequada ao momento da pessoa. Ela facilita o próximo passo, mas deve ser honesta, sem urgência falsa, e testada para saber quais variações funcionam melhor.','Use ao final de vídeos, legendas, e-mails, anúncios e páginas, e sempre que o conteúdo não levar a nenhuma ação. Para conteúdos curtos e leves, uma chamada simples costuma ser suficiente.'],45:['Tratamento de objeções é a técnica de identificar as dúvidas e resistências que impedem a pessoa de comprar e responder a elas com informação clara e honesta. As objeções mais comuns envolvem preço, qualidade, prazo, utilidade e confiança.','Serve para reduzir inseguranças antes da decisão e evitar que a pessoa desista por falta de informação. Também mostra o que está confuso na oferta e ajuda a melhorar páginas, anúncios e atendimento com base no que o público realmente pergunta.','Você reúne as perguntas e reclamações frequentes em comentários, mensagens e avaliações, agrupa por tema e responde cada uma com fatos, exemplos e garantias reais. O objetivo é ajudar a decidir bem, mesmo que a pessoa conclua que o produto não serve.',['Liste as cinco dúvidas mais comuns que você recebe.','Escreva uma resposta clara, honesta e curta para cada uma.','Coloque as respostas na página, em perguntas frequentes e em conteúdos.','Atualize a lista conforme surgirem novas dúvidas.'],'Exemplo hipotético: diante de não sei se vou conseguir usar a planilha, a página fictícia mostra um vídeo de dois minutos com o passo a passo, explica a garantia e deixa um canal de suporte. A pessoa decide com mais segurança.','Erros comuns: ignorar dúvidas, responder com pressão, minimizar a preocupação do cliente, prometer o que o produto não faz só para vencer uma objeção e insistir com quem claramente não é o público do produto.','Observe se o número de dúvidas repetidas diminui, se a taxa de conversão da página melhora e se os pedidos de reembolso caem. Leia os motivos de desistência para descobrir objeções que ainda não foram respondidas.','Objeções mostram o que falta para a pessoa decidir. Responda com clareza, provas verdadeiras e honestidade, aceitando que nem todos serão clientes. Isso melhora a oferta e evita compras que gerariam arrependimento.','Use ao montar páginas de vendas, perguntas frequentes e roteiros de atendimento, quando muitas pessoas chegam e poucas compram, ou quando as mesmas dúvidas aparecem repetidamente nas mensagens.'],50:['Reciprocidade é a tendência que muitas pessoas têm de retribuir quando recebem algo de valor. No marketing, aparece quando uma marca entrega conteúdo útil, um material gratuito ou uma ajuda genuína antes de pedir qualquer compra.','Serve para construir relacionamento e confiança antes da oferta. Ao ajudar de verdade, você mostra competência e boa vontade, e as pessoas passam a considerar a marca com mais abertura, sem que isso seja uma obrigação ou garantia de compra.','Funciona quando o que é oferecido é realmente útil e dado sem condições escondidas. Se a pessoa percebe manipulação, o efeito se inverte. A reciprocidade não deve ser usada para pressionar ninguém, e a pessoa tem total liberdade de não comprar.',['Identifique uma dúvida do público que você consegue resolver bem.','Crie um conteúdo ou material gratuito realmente útil e completo.','Entregue sem exigir mais do que o necessário, como um e-mail com consentimento.','Mantenha o relacionamento com conteúdos úteis, sem cobrança.'],'Exemplo hipotético: uma loja fictícia de planilhas oferece um modelo gratuito de orçamento mensal. Quem usa percebe a qualidade e, depois, se interessa pela versão completa, mas ninguém é pressionado a comprar para ficar com o material.','Erros comuns: oferecer algo inútil só para captar contatos, esconder condições, cobrar o retorno como se fosse dívida, entregar pouco valor, exagerar na quantidade de pedidos depois e tratar quem recebeu o material como obrigado a comprar.','Observe quantas pessoas usam o material, como avaliam, se voltam ao conteúdo e se avançam para outras etapas. Compare com quem não recebeu, sem concluir que o presente foi a única causa de uma compra.','Reciprocidade é oferecer valor real antes de pedir algo. Use com honestidade, sem condições escondidas e sem pressão, entendendo que ela ajuda a criar relacionamento, mas não garante que a pessoa vai comprar.','Use no início do relacionamento, ao captar contatos, ao lançar um produto novo ou quando a marca é desconhecida. Evite quando não houver algo realmente útil para oferecer ou quando não for possível cumprir o prometido.'],51:['Escassez real é a limitação verdadeira e verificável de quantidade ou de vagas, como um lote pequeno, uma turma com número máximo de pessoas ou uma edição limitada. Quando existe de fato, comunicá-la é uma informação honesta para quem está decidindo.','Serve para ajudar quem já está interessado a decidir antes que algo realmente se esgote. Também demonstra transparência quando a limitação é verdadeira. Se for inventada, destrói a confiança e pode violar regras de publicidade e de defesa do consumidor.','Quando a quantidade é realmente limitada, as pessoas valorizam mais o que pode acabar e decidem com mais atenção. Para ser ética, a limitação precisa ser verificada por você e comunicada com clareza, sem exageros e sem reabrir vendas falsamente encerradas.',['Confirme o limite real de estoque ou de vagas.','Informe a quantidade ou o prazo de forma clara na oferta.','Atualize a informação conforme as vendas acontecem.','Cumpra o que anunciou: ao esgotar, encerre mesmo.'],'Exemplo hipotético: uma loja fictícia produz 50 unidades de uma edição especial e informa que existem 50 disponíveis. O contador diminui a cada compra real, e a venda é encerrada ao esgotar, sem reabrir depois.','Erros comuns: dizer que restam poucas unidades quando há muitas, reabrir uma oferta encerrada, usar contadores falsos, pressionar a pessoa a decidir na hora, esconder condições importantes e criar escassez artificial apenas para vender mais rápido.','Compare as vendas e as objeções antes e depois de comunicar a limitação, sem presumir causa. Verifique também reclamações, pedidos de reembolso e se os clientes confiam nas informações de estoque e prazo que você divulga.','Use escassez somente quando for real, verificável e bem explicada. Ela ajuda a decidir quem já quer comprar, mas nunca deve ser inventada ou usada para pressionar, pois o engano prejudica pessoas e a reputação da marca.','Use em lotes pequenos, edições limitadas, turmas com vagas reais ou itens sob encomenda. Evite quando não houver um limite verdadeiro ou quando não for possível cumprir o encerramento anunciado.'],56:['Isca digital é um material gratuito e útil, como um checklist, e-book curto, modelo de planilha ou aula, oferecido em troca de um cadastro. Ela serve de porta de entrada para uma relação com quem tem interesse no tema, desde que haja consentimento para contato.','Serve para captar contatos de pessoas interessadas e começar um relacionamento com utilidade. Também permite que o público conheça a qualidade do seu trabalho antes de decidir comprar algo, e você passa a ter um canal de comunicação autorizado.','A pessoa deixa um contato porque percebe valor no material. Depois, você envia o conteúdo prometido e mensagens úteis, respeitando as regras de privacidade e oferecendo a opção de cancelar. A isca precisa ter relação direta com o produto que você vende.',['Escolha um problema pequeno do público que você possa resolver rápido.','Crie um material curto, prático e fácil de usar.','Faça uma página de captura clara e peça consentimento para o contato.','Entregue o material e acompanhe com mensagens úteis.'],'Exemplo hipotético: uma loja fictícia de planilhas oferece o checklist Primeiros passos para organizar o orçamento. Quem se cadastra recebe o arquivo e, nos dias seguintes, dicas curtas e, depois, um convite opcional para conhecer a planilha completa.','Erros comuns: oferecer material sem relação com o produto, coletar contatos sem consentimento, entregar algo fraco, pedir dados demais, não enviar o que prometeu e encher a pessoa de mensagens comerciais logo depois do cadastro.','Acompanhe a taxa de cadastro da página, a abertura dos e-mails, os cliques, os cancelamentos e quantas pessoas avançam para a oferta. Verifique também se os contatos captados têm o perfil do seu público.','Isca digital é um material útil oferecido em troca de cadastro com consentimento. Ela inicia o relacionamento, mas precisa ser coerente com a oferta e não garante vendas, pois o resultado depende do público e do acompanhamento.','Use quando quiser construir uma lista de contatos autorizados, ao lançar um produto ou quando muitas pessoas visitam sua página e saem sem ação. Evite se não puder manter contato útil e respeitar a privacidade.'],58:['Página de vendas é a página dedicada a apresentar uma oferta e ajudar a pessoa a decidir. Ela explica o produto, o benefício, o que está incluso, o preço, as garantias e como comprar, e responde às dúvidas mais comuns antes da compra.','Serve para reunir em um só lugar todas as informações necessárias para uma decisão segura. Uma página clara reduz dúvidas, diminui o abandono e evita compras baseadas em expectativas erradas, o que também reduz reembolsos e reclamações.','A pessoa chega com curiosidade e algumas dúvidas. A página segue uma ordem lógica: benefício, para quem é, o que inclui, como funciona, provas verdadeiras, perguntas frequentes, preço e ação. Quanto mais transparente, maior a chance de decisão consciente.',['Escreva o benefício principal no título, de forma clara e realista.','Explique para quem o produto serve, para quem não serve e o que está incluso.','Inclua provas verdadeiras, perguntas frequentes, preço e garantia.','Revise no celular e teste a compra do início ao fim.'],'Exemplo hipotético: a página fictícia da planilha mostra o título Organize seu salário em 10 minutos, imagens das telas, uma lista do que está incluso, perguntas frequentes, o preço de R$ 37, a garantia e um botão claro de compra.','Erros comuns: prometer resultados exagerados, usar depoimentos inventados, esconder preço ou custos, escrever um texto confuso, não responder dúvidas, página lenta no celular, botões que não funcionam e não revisar a página depois de mudanças.','Acompanhe visitas, cliques no botão de compra, taxa de conversão, tempo na página, pontos de saída e reembolsos. Compare versões da página em períodos parecidos e mude um elemento por vez para entender o efeito.','Uma boa página de vendas é clara, honesta e completa, responde às dúvidas na ordem em que surgem e facilita a compra. Ela ajuda a decidir, mas não garante vendas, pois depende da oferta e do público.','Use sempre que houver uma oferta a ser apresentada, ao lançar um produto, ao receber tráfego de anúncios ou conteúdos, ou quando muitas pessoas visitam e poucas compram. Para itens simples, uma página curta pode bastar.']});
Object.assign(D,{61:['Order bump é uma oferta complementar, de valor menor, apresentada no checkout, antes de a pessoa concluir a compra principal. Ela pode adicionar o item com um clique, como um material extra ou um acessório que combina com o que está sendo comprado.','Serve para oferecer algo útil que complementa a compra no momento em que a pessoa já decidiu comprar. Quando faz sentido, melhora a experiência e aumenta o ticket médio, sem exigir uma nova campanha para atrair outro cliente.','Funciona porque a oferta aparece no ponto de decisão, simples e com informação clara. Precisa ser relevante para o produto principal, ter preço e descrição transparentes e nunca atrapalhar a compra. A pessoa deve poder ignorá-la facilmente.',['Escolha um complemento que realmente ajude quem compra o produto principal.','Defina um preço menor e descreva com clareza o que é entregue.','Mostre a oferta no checkout sem esconder ou atrapalhar o botão principal.','Acompanhe a taxa de aceitação e os reembolsos.'],'Exemplo hipotético: ao comprar uma planilha de orçamento por R$ 37, o checkout mostra um modelo extra de controle de metas por R$ 9, com descrição curta e uma caixa para adicionar. Quem não quer simplesmente conclui a compra principal.','Erros comuns: oferecer algo sem relação com a compra, esconder o preço ou a inclusão automática, marcar a caixa por padrão, criar confusão no checkout, prometer demais no complemento e não observar se aumenta os pedidos de reembolso.','Acompanhe a taxa de aceitação, o ticket médio, a taxa de conversão do checkout e os reembolsos. Se o order bump reduzir a conversão da compra principal ou aumentar reclamações, revise a oferta ou retire-a.','Order bump é uma oferta complementar simples, relevante e transparente no checkout. Ajuda quem quer algo a mais e pode aumentar o ticket médio, mas não deve confundir nem pressionar o cliente e precisa ser testada.','Use quando existir um complemento natural e de baixo custo para o produto principal e o checkout permitir a oferta. Evite se o complemento não tiver relação com a compra ou se deixar o processo mais confuso.'],62:['Upsell é oferecer uma versão melhor, maior ou mais completa do que a pessoa está comprando. Cross-sell é oferecer um produto diferente, mas que complementa a compra. São duas formas de apresentar mais valor ao cliente que já demonstrou interesse.','Servem para ajudar o cliente a encontrar uma opção mais adequada ou complementos úteis e, ao mesmo tempo, aumentar o valor médio de cada compra. Funcionam melhor quando a sugestão é relevante e resolve uma necessidade real da pessoa.','A oferta aparece depois da decisão inicial, em uma página seguinte, no carrinho ou em um e-mail. Deve explicar claramente a diferença de valor e permitir recusar sem dificuldade. Ofertas mal pensadas irritam e podem aumentar reembolsos e cancelamentos.',['Liste versões melhores e complementos que ajudam quem compra o produto atual.','Explique a diferença e o benefício extra em linguagem simples.','Mostre a oferta no momento certo, sem atrapalhar a compra principal.','Acompanhe aceitação, reembolsos e a satisfação dos clientes.'],'Exemplo hipotético: quem compra a planilha básica vê a opção completa com mais abas por R$ 20 a mais (upsell) e, em outra tela, um modelo de controle de metas (cross-sell). Cada oferta traz uma explicação clara e permite seguir sem comprar.','Erros comuns: oferecer algo sem relação, insistir várias vezes, esconder o botão de recusar, confundir o cliente sobre o que já comprou, aumentar muito o preço de uma vez e não analisar se as ofertas geram reembolsos ou reclamações.','Acompanhe a taxa de aceitação, o ticket médio, a margem, os reembolsos e a satisfação. Se as ofertas aumentam a receita, mas também os pedidos de devolução, pode ser sinal de que a sugestão não está adequada.','Upsell oferece uma versão melhor e cross-sell um complemento. Ambos devem ser relevantes, claros e opcionais, ajudando o cliente a escolher bem. Resultados variam e ofertas insistentes prejudicam a confiança.','Use após a decisão de compra, em páginas de agradecimento ou e-mails, quando houver uma versão ou complemento que realmente ajude o cliente. Evite quando o cliente já demonstrou insatisfação ou quando a oferta for apenas insistência.'],63:['Recuperação de carrinho abandonado é o contato com pessoas que colocaram produtos no carrinho ou iniciaram o checkout, mas saíram sem concluir a compra. O contato pode ser feito por e-mail ou mensagem, desde que a pessoa tenha dado consentimento.','Serve para entender e resolver o motivo da desistência, lembrando da compra e respondendo dúvidas. Muitas pessoas abandonam por distração, dúvida sobre frete ou preço ou problemas no pagamento, e um lembrete útil pode ajudar quem ainda quer comprar.','O sistema identifica o carrinho não finalizado e envia uma mensagem depois de algumas horas, com os itens, as dúvidas comuns e um caminho fácil de volta. Respeitar privacidade, consentimento e frequência é essencial para não parecer insistência ou invasão.',['Verifique se o contato pode ser feito com consentimento e conforme a lei.','Envie uma primeira mensagem curta, lembrando os itens e oferecendo ajuda.','Responda dúvidas comuns, como frete, prazo e garantia.','Limite o número de mensagens e permita sair da lista.'],'Exemplo hipotético: uma loja fictícia envia, 3 horas depois, um e-mail Esqueceu algo? com a imagem do produto, o prazo de entrega, a garantia e um botão para retomar a compra. Se a pessoa não responder, envia um único lembrete no dia seguinte.','Erros comuns: enviar mensagens sem consentimento, insistir demais, criar urgência falsa ou descontos enganosos, não resolver os motivos do abandono, não permitir cancelar o recebimento e não excluir quem já comprou depois do lembrete.','Acompanhe a taxa de abertura, de cliques, de compras recuperadas, de cancelamentos e o custo da ação. Compare também os motivos de abandono para corrigir causas como frete, preço ou dificuldade no checkout.','Recuperar carrinhos é lembrar com respeito quem não concluiu a compra e resolver as causas da desistência. Faça com consentimento, poucas mensagens e informação útil, e lembre que nem todo abandono pode ser recuperado.','Use quando houver carrinhos abandonados com contato autorizado e um sistema que permita registrar o abandono. Evite quando não for possível cumprir as regras de privacidade ou quando o motivo do abandono estiver em um problema técnico que precisa ser corrigido.'],64:['Escolha estratégica de produtos para divulgar é o processo de selecionar, entre várias ofertas de afiliados, aquelas que combinam com seu público, merecem sua recomendação e têm condições justas de comissão, qualidade e suporte.','Serve para proteger sua reputação e aumentar a chance de a divulgação ser útil. Divulgar produtos ruins ou inadequados pode gerar reembolsos, reclamações e perda de confiança, mesmo que a comissão prometida seja atraente.','Você avalia o problema que o produto resolve, a clareza da página de vendas, a reputação do produtor, as avaliações, a política de reembolso, as regras de afiliação e o interesse do seu público. Quanto mais você conhece o produto, mais honesta pode ser sua divulgação.',['Defina o público que você quer ajudar e o problema dele.','Pesquise produtos que resolvem esse problema e leia avaliações reais.','Confira página de vendas, suporte, reembolso e regras de afiliação.','Teste ou estude o produto antes de recomendar.'],'Exemplo hipotético: entre duas ofertas, uma tem comissão de 70% mas página confusa e promessas exageradas. A outra tem 40%, explica o conteúdo com clareza e tem suporte. Você escolhe a segunda por ser mais segura para sua reputação.','Erros comuns: escolher só pela comissão, divulgar sem conhecer o produto, ignorar a política de reembolso, não ler as regras do programa, divulgar muitos produtos ao mesmo tempo e não acompanhar reclamações depois da divulgação.','Acompanhe cliques, vendas, reembolsos, dúvidas e comentários sobre o produto. Se muitos compradores pedem reembolso ou reclamam, reavalie a recomendação. Compare produtos pelo resultado líquido, e não só pela comissão recebida.','Escolha produtos úteis, bem explicados e adequados ao seu público, com regras claras e suporte. A comissão importa, mas a reputação e a satisfação de quem compra por sua indicação importam mais ao longo do tempo.','Use antes de começar a divulgar um produto, ao trocar de nicho, quando os reembolsos estiverem altos ou ao receber muitas dúvidas sobre uma oferta. Reavalie periodicamente, pois produtos e condições mudam.'],69:['Demonstrações e avaliações honestas são conteúdos em que você mostra o produto em uso e explica os pontos fortes e as limitações, com base em testes reais. Quando houver parceria ou link de afiliado, isso deve ser informado com clareza ao público.','Servem para ajudar quem está decidindo a entender o que esperar do produto. Uma avaliação equilibrada gera mais confiança do que elogios sem restrições e tende a levar a compras mais conscientes, com menos arrependimento e menos pedidos de reembolso.','Você usa o produto por tempo suficiente, registra o que funciona e o que não funciona, e mostra isso de forma organizada. Ao informar limitações e para quem o produto não é indicado, o público percebe honestidade e passa a confiar nas suas recomendações.',['Teste o produto em situações reais antes de publicar.','Anote pontos positivos, negativos e para quem ele serve ou não.','Mostre o uso real em vídeo ou fotos próprias e explique as limitações.','Informe com clareza se houver parceria ou link de afiliado.'],'Exemplo hipotético: um criador fictício testa uma capinha por duas semanas, mostra quedas e arranhões reais, diz que ela protege bem, mas deixa o celular um pouco maior, e avisa que o link na descrição é de afiliado.','Erros comuns: elogiar sem testar, esconder limitações, usar imagens de terceiros como se fossem suas, não informar a parceria, exagerar resultados, copiar avalia
