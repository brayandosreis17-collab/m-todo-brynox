ão. Elas funcionam como apoio ao bom conteúdo, e os resultados variam conforme a plataforma, o tema e o momento.','Use ao publicar em redes que dão importância à classificação por assunto, ao entrar em um novo nicho ou ao querer ser encontrado por quem pesquisa um tema. Evite exagerar na quantidade ou usar termos sem relação com o conteúdo.'],20:['Otimização de perfil é o ajuste dos elementos do seu perfil, como nome, foto, biografia, link, destaques e publicações fixadas, para que quem chegar entenda rapidamente quem você é, o que oferece e qual é o próximo passo a seguir.','Serve para transformar visitas em seguidores, mensagens e cliques. O perfil é a vitrine da marca: muita gente chega por um conteúdo e decide em segundos se continua explorando ou sai, e um perfil claro ajuda a reter e orientar essas pessoas.','Funciona pela clareza. Em poucos segundos, o visitante precisa entender o assunto, o benefício e a ação recomendada. Nome e biografia explicam o tema, a foto dá reconhecimento, os destaques respondem dúvidas e o link leva ao destino que você deseja.',['Escreva um nome e uma biografia que digam para quem é o perfil e o benefício principal.','Use uma foto ou logotipo reconhecível, com boa qualidade e que combine com a marca.','Coloque um link com uma ação clara, como cadastro, produto ou página de contatos.','Organize destaques e publicações fixadas com perguntas frequentes, provas reais e os melhores conteúdos.'],'Exemplo hipotético: um perfil fictício de planilhas usa na biografia a frase Planilhas simples para organizar suas finanças, tem destaques com como usar, dúvidas e depoimentos autorizados e um link único para a página de download do modelo.','Erros comuns: biografia vaga ou confusa, excesso de links sem foco, foto de baixa qualidade, destaques desatualizados, promessas exageradas, informações de contato erradas e perfis que não explicam o que a pessoa ou a marca faz.','Observe visitas ao perfil, a taxa de pessoas que seguem depois de visitar, cliques no link e mensagens recebidas. Se muitas pessoas visitam e poucas agem, revise a clareza da biografia, a oferta do link e a organização dos destaques.','Um bom perfil responde rapidamente a quem é, o que oferece e o que fazer em seguida. Ele transforma curiosidade em ação, mas depende de conteúdos úteis para atrair visitas e de manutenção para continuar atual.','Use ao criar um perfil novo, antes de investir em divulgação, quando as visitas não viram seguidores ou cliques, e sempre que mudar de produto, oferta ou posicionamento. Revise periodicamente para manter as informações corretas.'],21:['Estratégia de vídeos curtos é o planejamento de vídeos rápidos, geralmente de poucos segundos a cerca de um minuto, para plataformas como TikTok e Instagram. Cada vídeo traz uma única ideia, apresentada com clareza, ritmo e uma chamada para a próxima ação.','Serve para ganhar descoberta e alcance, apresentar a marca a pessoas novas e testar ideias com rapidez. Como o formato é leve, dá para publicar com frequência, observar o que prende a atenção e ajustar os próximos conteúdos conforme a resposta do público.','Funciona porque as plataformas mostram vídeos a pessoas que podem se interessar pelo assunto e observam sinais como tempo assistido, compartilhamentos e comentários. Se a ideia é clara e o vídeo mantém o interesse, a chance de ser exibido a mais pessoas pode aumentar.',['Escolha uma ideia única e defina o que a pessoa vai aprender ou sentir.','Planeje gancho, desenvolvimento e chamada para a ação antes de gravar.','Mantenha ritmo rápido, corte pausas e use legendas, pois muitos assistem sem som.','Publique, compare o desempenho e repita os formatos que tiverem melhor retenção.'],'Exemplo hipotético: um perfil fictício publica um vídeo de 25 segundos sobre um erro comum ao organizar o orçamento. Começa com o erro, mostra a correção em dois passos e termina convidando a salvar o vídeo para consultar depois.','Erros comuns: colocar muitas ideias no mesmo vídeo, demorar para chegar ao ponto, gravar com áudio ruim, não usar legendas, copiar tendências sem relação com a marca, desistir após poucos vídeos e esquecer de analisar os dados.','Acompanhe tempo médio assistido, retenção, compartilhamentos, salvamentos, visitas ao perfil e cliques. Compare vídeos com temas, ganchos e durações diferentes e use os resultados para decidir o que repetir, ajustar ou abandonar.','Um vídeo curto funciona melhor com uma ideia clara, ritmo ágil e um próximo passo definido. A consistência e a análise dos resultados importam mais do que um único vídeo de sucesso, e nenhuma plataforma garante alcance.','Use para atrair público novo, testar temas, mostrar produtos em uso e responder dúvidas rapidamente. Evite quando o assunto exigir explicação longa e detalhada, que pode ser melhor em vídeos maiores, artigos ou aulas.'],22:['Gancho nos primeiros segundos é a técnica de usar o início de um vídeo, de uma legenda ou de um anúncio para chamar atenção e dar um motivo claro para a pessoa continuar assistindo ou lendo, geralmente com uma pergunta, um problema, uma promessa realista ou uma curiosidade concreta.','Serve para reduzir a saída rápida e melhorar a retenção. Em feeds cheios de opções, a pessoa decide em poucos instantes se continua ou passa para o próximo conteúdo, então o início influencia bastante o desempenho de todo o restante.','Funciona porque entender logo o que se ganha ao continuar motiva a atenção. Um bom gancho é específico, relevante para o público e cumpre o que promete no desenvolvimento. Se o conteúdo não entrega o que o início prometeu, as pessoas saem e a confiança diminui.',['Defina para quem é o conteúdo e qual problema ou interesse ele trata.','Escreva de três a cinco opções de abertura, curtas e específicas.','Escolha a mais clara, grave com ela logo no primeiro segundo e evite saudações longas.','Teste versões diferentes do início para o mesmo conteúdo e compare a retenção.'],'Exemplo hipotético: em vez de começar com um olá, pessoal, um vídeo fictício começa com três erros que fazem o dinheiro do mês acabar antes da hora. Em seguida, explica cada erro rapidamente e termina com uma dica prática.','Erros comuns: gancho vago, promessas exageradas que o conteúdo não cumpre, início com apresentações longas, uso de sustos ou polêmicas sem relação com o tema e repetição do mesmo formato até o público perder o interesse.','Observe a retenção nos primeiros segundos, o tempo médio assistido e a taxa de pessoas que abandonam logo no início. Compare publicações com ganchos diferentes para entender o que prende mais o seu público, usando vídeos parecidos para uma comparação justa.','Um gancho eficiente é claro, específico e honesto: mostra rapidamente o valor do conteúdo e é cumprido no desenvolvimento. Ele melhora a chance de a pessoa continuar, mas não substitui um conteúdo realmente útil.','Use em vídeos curtos, legendas, títulos, e-mails e anúncios, principalmente quando a retenção inicial está baixa. Evite ganchos chamativos que não têm relação com o conteúdo, pois isso prejudica a confiança.'],23:['Colaborações com criadores é a técnica de produzir conteúdo em parceria com outras pessoas que já têm público, como lives, vídeos em dupla, entrevistas, indicações e conteúdos conjuntos, com regras e objetivos combinados antes da publicação.','Serve para apresentar sua marca a um público novo por meio de alguém que ele já conhece. Também permite trocar experiências, enriquecer conteúdos e gerar interesse entre pessoas que talvez não chegassem até você sozinhas.','Funciona porque parte da confiança que o público tem no criador pode se estender à marca parceira, desde que haja afinidade real. O alcance depende de o público ser compatível com o seu e de o conteúdo ser útil ou interessante para quem assiste.',['Escolha criadores com público parecido com o seu e valores compatíveis, não apenas com muitos seguidores.','Combine objetivos, formato, prazos, divulgação e quem faz o quê antes de começar.','Crie um conteúdo que seja bom para os dois públicos e identifique claramente quando houver parceria comercial.','Divulgue nos dois perfis e acompanhe visitas, seguidores novos e cliques.'],'Exemplo hipotético: um perfil fictício de planilhas de finanças faz uma live com uma criadora de conteúdo sobre primeiro emprego. Elas respondem dúvidas de organização do salário, e a criadora indica o material gratuito, informando que é uma parceria.','Erros comuns: escolher parceiros só pelo número de seguidores, não alinhar expectativas, esconder que há parceria comercial quando existir, exigir resultados garantidos, não acompanhar os dados e fazer conteúdos que não interessam ao público de nenhum dos dois.','Compare seguidores novos, visitas ao perfil, cliques e vendas ou cadastros vindos da parceria, usando links ou códigos rastreáveis quando possível. Avalie também a qualidade das interações e se o público novo tem afinidade com seu produto.','Colaborar funciona melhor com público compatível, objetivos combinados e transparência. Ela pode ampliar o alcance, mas não garante vendas, e o resultado depende da afinidade entre os públicos e da qualidade do conteúdo criado.','Use quando quiser alcançar pessoas novas, lançar um produto, ganhar credibilidade em um nicho ou criar conteúdos diferentes. Evite quando não houver afinidade entre os públicos ou quando não for possível acompanhar os resultados.']});
function home(){E(`<div class='eb'>Plataforma de estudos</div><h1>BRYNOX</h1><p class='sub'>Uma plataforma de estudos que ensina marketing digital de forma prática: como divulgar, vender e desenvolver negócios com produtos físicos e digitais.</p><div class='card'><div class='eb'>O que é a BRYNOX</div><p>A BRYNOX funciona como um livro digital. Você escolhe o assunto que quer estudar no menu lateral, lê no seu ritmo e volta quando quiser. Não há login, cadastro, pontuação nem progresso salvo: cada pessoa decide por onde começar e lembra por conta própria onde parou.</p><p>O conteúdo é educacional. Explicamos conceitos, mostramos exemplos hipotéticos e indicamos passos práticos, mas nenhuma estratégia aqui garante vendas, lucro ou crescimento rápido. Os resultados dependem do produto, do público, do investimento e da execução de cada pessoa.</p></div><div class='card'><div class='eb'>O que você pode aprender</div><p>Você encontra aulas sobre marketing de afiliados, produtos e modelos de negócio, tráfego orgânico e pago, funis e conversão, psicologia do consumidor e métricas. Há também ferramentas práticas, como calculadoras, e uma biblioteca com 80 técnicas de marketing explicadas passo a passo.</p></div><div class='card'><div class='eb'>Por onde começar</div><p>Se você é iniciante, uma sugestão é começar por Marketing de Afiliados ou por Produtos e Modelos de Negócio, para entender como uma venda online acontece. Depois, avance para Tráfego e Funis. Mas a ordem é sua: abra qualquer aula quando quiser.</p></div><h2>Módulos disponíveis</h2><div class='grid'>${M.slice(1).map((x,k)=>`<div class='tile' onclick='location.hash="#/${k+1}"'>${x.n}<small>${x.d||'Abrir área'}</small></div>`).join('')}</div>`)}
M.find(x=>x.n==='Marketing de Afiliados').l=[L('O que é marketing de afiliados','<h2>O que é</h2><p>Marketing de afiliados é um modelo em que uma pessoa, o afiliado, divulga produtos de outra pessoa ou empresa, o produtor, e recebe uma comissão quando uma venda válida é feita pelo seu link de divulgação. O afiliado não cria o produto, não cuida do estoque nem faz a entrega: seu papel é atrair interessados e conduzi-los à oferta.</p><h2>Para que serve</h2><p>Serve como forma de ganhar comissão sem precisar produzir nada, e para o produtor, como forma de alcançar mais pessoas pagando apenas quando há venda. Também é uma boa porta de entrada para aprender como funcionam ofertas, público e divulgação.</p><h2>Como funciona</h2><p>São três papéis. O produtor cria e vende o produto. O afiliado recebe um link único e o divulga. O comprador clica, conhece a oferta e decide comprar. Quando a compra é confirmada, o sistema identifica que veio daquele link e registra a comissão. Valores, prazos e regras variam conforme cada programa de afiliados.</p><h2>Como aplicar</h2><ol><li>Entenda as regras do programa de afiliados antes de divulgar.</li><li>Escolha um produto que você conheça e que faça sentido para um público definido.</li><li>Crie conteúdo útil que mostre o problema que o produto resolve.</li><li>Divulgue seu link de forma clara e acompanhe cliques e vendas.</li></ol><h2>Exemplo hipotético</h2><p>Imagine uma planilha fictícia de finanças vendida por R$ 37 com comissão de 60%. Se alguém comprar pelo seu link e a venda for confirmada, você receberia R$ 22,20, conforme as regras do programa. Os valores são ilustrativos.</p><h2>Erros comuns</h2><p>Divulgar sem conhecer o produto, prometer resultados que ninguém pode garantir, enviar o link a pessoas que não têm interesse e ignorar as regras da plataforma, o que pode levar à perda da comissão ou da conta.</p><div class="card key"><div class="eb">Resumo prático</div><b>O afiliado conecta pessoas interessadas a uma oferta e recebe comissão por vendas válidas, sem garantia de resultado.</b></div>'),L('Como funciona o mercado de afiliados','<h2>O que é</h2><p>O mercado de afiliados é o conjunto de produtores, afiliados, plataformas e compradores que participam desse modelo. As plataformas de afiliados funcionam como intermediárias: guardam os produtos, geram links, registram as vendas e organizam o pagamento das comissões.</p><h2>Para que serve entender isso</h2><p>Entender o mercado ajuda a escolher onde atuar, evitar promessas irreais e perceber que cada plataforma tem regras próprias de cadastro, comissão, prazo de pagamento e política de reembolso.</p><h2>Como funciona</h2><p>O produtor cadastra o produto e define a comissão e as condições para os afiliados. O afiliado se cadastra, solicita ou escolhe um produto e recebe seu link. A plataforma acompanha os cliques e as vendas por meio de códigos de identificação. Quando termina o prazo de garantia da compra, a comissão costuma ser liberada, mas essas regras variam.</p><h2>Como aplicar</h2><ol><li>Pesquise plataformas conhecidas e leia seus termos de uso.</li><li>Compare comissões, prazos de pagamento, reembolso e suporte.</li><li>Verifique como o painel mostra cliques, vendas e comissões.</li><li>Comece por poucos produtos para aprender o processo.</li></ol><h2>Exemplo hipotético</h2><p>Duas plataformas fictícias oferecem produtos parecidos. Uma paga a comissão após 7 dias e a outra após 30 dias. Se você depende de um retorno mais rápido, esse prazo pode influenciar sua escolha, mas não garante melhor resultado.</p><h2>Erros comuns</h2><p>Entrar em uma plataforma sem ler as regras, confiar em promessas de ganhos fáceis e não conferir o painel de vendas com regularidade para detectar erros ou cancelamentos.</p><div class="card key"><div class="eb">Resumo prático</div><b>As plataformas registram cliques, vendas e comissões, mas cada uma tem regras próprias que você precisa ler.</b></div>'),L('Produtos físicos e digitais','<h2>O que é</h2><p>Afiliados podem divulgar produtos digitais, como e-books, cursos e ferramentas, e produtos físicos, como roupas, acessórios e eletrônicos. Cada tipo tem características diferentes que influenciam a divulgação.</p><h2>Para que serve entender a diferença</h2><p>Saber a diferença ajuda a escolher o que combina com seu público e com a forma de divulgar, além de preparar você para dúvidas diferentes, como entrega, prazo, suporte ou acesso ao conteúdo.</p><h2>Como funciona</h2><p>Produtos digitais costumam ser entregues na hora, têm margens de comissão maiores e dependem muito de confiança no produtor. Produtos físicos envolvem frete, estoque e trocas, e as comissões costumam ser menores, mas muitas pessoas se sentem mais seguras ao comprar algo tangível. Em ambos os casos, a divulgação precisa ser honesta.</p><h2>Como aplicar</h2><ol><li>Pesquise as regras de divulgação do produto escolhido.</li><li>Avalie a qualidade, a reputação do vendedor e as condições de entrega ou acesso.</li><li>Descreva o produto com informações verdadeiras e mostre para quem ele serve.</li><li>Informe a divulgação comercial quando as regras do canal exigirem.</li></ol><h2>Exemplo hipotético</h2><p>Você divulga uma planilha digital fictícia mostrando como ela funciona em um vídeo curto. Em outro conteúdo, divulga uma capinha de celular, mostrando testes de uso e informando prazo médio de entrega. Em cada caso, as dúvidas do público são diferentes.</p><h2>Erros comuns</h2><p>Divulgar sem testar ou entender o produto, esconder prazos e custos de frete, ignorar o suporte e usar imagens que não pertencem a você sem autorização.</p><div class="card key"><div class="eb">Resumo prático</div><b>Produtos digitais e físicos exigem cuidados diferentes: avalie qualidade, público, entrega e regras antes de divulgar.</b></div>'),L('Como escolher um produto','<h2>O que é</h2><p>Escolher um produto para divulgar é avaliar se ele merece sua indicação e se combina com o público que você alcança. A escolha afeta sua credibilidade e seus resultados.</p><h2>Para que serve</h2><p>Uma boa escolha reduz reclamações, devoluções e perda de confiança, e aumenta a chance de a divulgação ser útil para quem recebe.</p><h2>Como funciona</h2><p>Você analisa utilidade do produto, reputação do vendedor, qualidade da página de vendas, condições de comissão, política de reembolso e interesse do público. Uma comissão alta não torna uma oferta boa por si só.</p><h2>Como aplicar</h2><ol><li>Defina o público que você quer ajudar e o problema dele.</li><li>Pesquise produtos que resolvem esse problema e leia avaliações reais.</li><li>Confira a página de vendas: ela explica com clareza o que é entregue?</li><li>Veja a política de reembolso, o suporte e as regras de afiliação.</li></ol><h2>Exemplo hipotético</h2><p>Entre duas ofertas fictícias, uma tem comissão de 70% mas página confusa e promessas exageradas. A outra tem comissão de 40%, explica o conteúdo com clareza e tem suporte. A segunda tende a ser uma escolha mais segura para sua reputação.</p><h2>Erros comuns</h2><p>Escolher só pela comissão, divulgar produtos que você não conhece e ignorar sinais de promessas exageradas.</p><div class="card key"><div class="eb">Resumo prático</div><b>Escolha produtos úteis, bem explicados e adequados ao seu público, e não apenas os de maior comissão.</b></div>'),L('Como funcionam os links de afiliados','<h2>O que é</h2><p>O link de afiliado é um endereço exclusivo que contém um código de identificação. Ele permite que a plataforma saiba que o visitante veio da sua divulgação.</p><h2>Para que serve</h2><p>Serve para registrar cliques e vendas que vieram de você e calcular sua comissão.</p><h2>Como funciona</h2><p>Ao clicar, a plataforma registra a visita, normalmente por meio de cookies ou códigos. Se a pessoa comprar dentro do prazo definido pelo programa, a venda é atribuída ao afiliado. Cada programa define esse prazo e as regras de atribuição.</p><h2>Como aplicar</h2><ol><li>Gere o link no painel da plataforma e confira se abre a página correta.</li><li>Leia as regras sobre onde você pode ou não divulgar o link.</li><li>Informe com clareza que se trata de divulgação comercial quando necessário.</li><li>Acompanhe cliques e vendas no painel.</li></ol><h2>Exemplo hipotético</h2><p>Você coloca o link na biografia do perfil e escreve na legenda que ele leva a um produto de terceiros, com vídeo explicando para quem o produto serve. Depois, confere no painel quantos cliques viraram vendas.</p><h2>Erros comuns</h2><p>Esconder que é link de afiliado, divulgar em locais proibidos pelo programa, alterar o link e perder o rastreamento e enviar o link sem explicar para que serve.</p><div class="card key"><div class="eb">Resumo prático</div><b>O link identifica suas indicações; use-o seguindo as regras da plataforma e informando que se trata de divulgação.</b></div>')];
const K=t=>'<div class="card key"><div class="eb">Resumo prático</div><b>'+t+'</b></div>';
M.find(x=>x.n==='Marketing de Afiliados').l.push(L('Como divulgar produtos','<h2>O que é</h2><p>Divulgar um produto de afiliado é apresentá-lo a pessoas que podem se interessar, de forma honesta, usando canais como conteúdo orgânico, redes sociais, páginas próprias, comunidades e anúncios pagos, sempre respeitando as regras de cada canal e do programa de afiliados.</p><h2>Para que serve</h2><p>Serve para levar a oferta até quem tem o problema que ela resolve. Sem divulgação, o link não recebe visitas; com divulgação sem estratégia, as visitas não são das pessoas certas.</p><h2>Como funciona</h2><p>No conteúdo orgânico, você ensina ou mostra algo útil e apresenta o produto como parte da solução. Em páginas e comunidades, você responde dúvidas e indica o produto quando for adequado. Nos anúncios, você paga para alcançar públicos definidos, e precisa acompanhar custos e resultados com cuidado.</p><h2>Como aplicar</h2><ol><li>Escolha um canal que seu público realmente usa.</li><li>Leia as regras do canal e do programa antes de publicar links.</li><li>Crie conteúdos que ajudem antes de pedir o clique.</li><li>Informe que se trata de divulgação quando necessário e acompanhe os resultados.</li></ol><h2>Exemplo hipotético</h2><p>Um perfil fictício publica um vídeo sobre como organizar o salário em três passos e, no final, indica uma planilha de terceiros, explicando para quem ela serve e avisando que é um link de afiliado.</p><h2>Erros comuns</h2><p>Postar o link em todo lugar sem contexto, entrar em grupos só para fazer spam, prometer resultados e divulgar em canais que não permitem links de afiliados.</p>'+K('Divulgue com utilidade e transparência, no canal certo e seguindo as regras, em vez de repetir o link em todo lugar.')),L('Como conquistar as primeiras vendas','<h2>O que é</h2><p>É um plano simples e realista para ir da escolha do produto até a primeira comissão, aprendendo com os resultados. Não existe prazo garantido: algumas pessoas demoram semanas ou meses.</p><h2>Para que serve</h2><p>Serve para evitar a dispersão. Muitos iniciantes divulgam vários produtos sem foco e não conseguem saber o que funciona.</p><h2>Como funciona</h2><p>Você escolhe um produto e um público, cria alguns conteúdos focados no mesmo problema, divulga o link, mede cliques e vendas e ajusta o que não funcionou. Cada ciclo ensina algo novo.</p><h2>Como aplicar</h2><ol><li>Escolha um produto que você entenda e um público específico.</li><li>Produza de 5 a 10 conteúdos curtos sobre o problema que o produto resolve.</li><li>Publique com regularidade e coloque o link no lugar adequado.</li><li>Após algumas semanas, compare visualizações, cliques e vendas e ajuste.</li></ol><h2>Exemplo hipotético</h2><p>Depois de 10 vídeos, um perfil fictício nota que o vídeo sobre gastos fixos teve mais cliques que os demais. Ele passa a criar mais conteúdos sobre esse tema.</p><h2>Erros comuns</h2><p>Desistir cedo, mudar de produto toda semana, não olhar as métricas e investir dinheiro em anúncios sem testar antes o conteúdo.</p>'+K('A primeira venda costuma vir de foco, repetição e ajustes, e não de um conteúdo perfeito; não há prazo nem resultado garantido.')),L('Comissões e resultados','<h2>O que é</h2><p>A comissão é o valor que o afiliado recebe por uma venda válida. Pode ser um percentual do preço ou um valor fixo, conforme o programa. Resultado, porém, é o que sobra depois de descontar seus custos.</p><h2>Para que serve entender</h2><p>Serve para não confundir faturamento com lucro. Uma venda não significa dinheiro líquido: podem existir taxas, impostos, reembolsos e gastos com divulgação.</p><h2>Como funciona</h2><p>A comissão fica registrada no painel e costuma ser liberada depois do prazo de garantia. Se o comprador pedir reembolso, ela pode ser cancelada. Os percentuais variam bastante entre produtos e plataformas.</p><h2>Como aplicar</h2><ol><li>Anote a comissão prevista por venda.</li><li>Some seus custos: anúncios, ferramentas e outros gastos.</li><li>Calcule o resultado: comissões confirmadas menos custos.</li><li>Acompanhe cancelamentos e reembolsos.</li></ol><h2>Exemplo hipotético</h2><p>Você recebe R$ 22,20 de comissão por venda e faz 2 vendas, somando R$ 44,40. Se gastou R$ 60 em anúncios, o resultado foi negativo em R$ 15,60, embora tenha havido vendas. Valores ilustrativos.</p><h2>Erros comuns</h2><p>Comemorar apenas a quantidade de vendas, ignorar custos, não considerar reembolsos e gastar com anúncios sem calcular o retorno.</p>'+K('Venda não é lucro: considere custos, taxas e reembolsos antes de avaliar seu resultado.')),L('Erros de iniciantes','<h2>O que são</h2><p>São falhas frequentes de quem começa como afiliado, que atrasam resultados e podem prejudicar a reputação.</p><h2>Para que serve conhecê-los</h2><p>Saber quais são ajuda a evitá-los e a economizar tempo e dinheiro.</p><h2>Principais erros</h2><p>Divulgar muitos produtos sem estratégia, de modo que não dá para saber o que funciona. Escolher ofertas só pela comissão alta. Fazer promessas exageradas, como ganhos rápidos ou resultados garantidos. Ignorar métricas e não acompanhar cliques e vendas. Insistir em spam em grupos e mensagens. Investir em anúncios sem testar o conteúdo antes. Esconder que o link é de afiliado.</p><h2>Como aplicar a prevenção</h2><ol><li>Comece com um produto e um público.</li><li>Teste o conteúdo organicamente antes de investir.</li><li>Seja transparente sobre a divulgação.</li><li>Registre os resultados em uma planilha simples.</li></ol><h2>Exemplo hipotético</h2><p>Um iniciante fictício divulga seis produtos diferentes em uma semana. Sem saber qual conteúdo gerou cada clique, não consegue ajustar. Ao focar em um, passa a entender o que responde melhor.</p>'+K('Foco, honestidade e acompanhamento de dados evitam a maioria dos erros de quem está começando.')));
M.find(x=>x.n==='Produtos e Modelos de Negócio').l=[L('Como escolher o que vender','<h2>O que é</h2><p>Escolher o que vender é identificar um problema, necessidade ou desejo de um público e decidir qual produto pode atendê-lo, verificando se existe interesse real e se o negócio faz sentido para seus recursos.</p><h2>Para que serve</h2><p>Evita investir tempo e dinheiro em algo que ninguém quer comprar. Uma boa escolha começa pelo público, não pelo produto.</p><h2>Como funciona</h2><p>Você observa problemas recorrentes, conversa com pessoas, estuda concorrentes e avalia se pode oferecer algo útil com preço, qualidade e entrega adequados. Depois, valida a ideia com testes pequenos.</p><h2>Como aplicar</h2><ol><li>Liste problemas que você conhece ou pode pesquisar.</li><li>Converse com pessoas do público e pergunte como resolvem hoje.</li><li>Pesquise concorrentes e preços.</li><li>Teste o interesse antes de investir, por exemplo com uma página simples ou lista de espera.</li></ol><h2>Exemplo hipotético</h2><p>Você nota que muitos freelancers reclamam de não saber quanto reservar para impostos. Uma planilha simples para isso pode ser uma ideia a validar, perguntando a algumas pessoas se pagariam por ela.</p><h2>Erros comuns</h2><p>Escolher pelo que parece lucrativo sem conhecer o mercado, não conversar com o público, ignorar custos e investir demais antes de validar.</p>'+K('Comece pelo problema do público, valide o interesse e só depois invista; nenhum produto garante lucro.')),L('Produtos digitais','<h2>O que é</h2><p>Produtos digitais são aqueles entregues por meio eletrônico: e-books, cursos, planilhas, templates, arquivos, ferramentas e outros materiais que não precisam de estoque físico.</p><h2>Para que serve</h2><p>Permitem vender o mesmo material para várias pessoas, sem custo de estoque ou frete, e entregar de forma rápida.</p><h2>Como funciona</h2><p>Você cria o material uma vez, hospeda em uma plataforma e entrega por acesso ou download depois da compra. Existem custos de produção, tempo, taxas da plataforma e suporte, além da necessidade de manter o conteúdo atualizado.</p><h2>Como aplicar</h2><ol><li>Defina o problema que o material resolve.</li><li>Avalie o tempo e o custo para produzir.</li><li>Escolha a plataforma de entrega e defina o suporte.</li><li>Planeje atualizações e coleta de feedback.</li></ol><h2>Exemplo hipotético</h2><p>Uma planilha fictícia de finanças exige algumas horas de criação, é enviada automaticamente após a compra e recebe atualizações conforme o feedback dos clientes.</p><h2>Erros comuns</h2><p>Criar sem validar interesse, prometer resultados que o material não entrega, ignorar suporte e esquecer de atualizar.</p>'+K('Produtos digitais dispensam estoque, mas exigem utilidade real, boa entrega, suporte e atualização.'))];
M.find(x=>x.n==='Produtos e Modelos de Negócio').l.push(L('Produtos físicos','<h2>O que é</h2><p>Produtos físicos são itens tangíveis, como roupas, acessórios, eletrônicos, cosméticos e objetos de uso cotidiano, que precisam ser armazenados, embalados e enviados ao cliente.</p><h2>Para que serve entender</h2><p>Vender algo físico envolve custos e tarefas que não existem no digital. Conhecê-los evita surpresas e ajuda a calcular o preço corretamente.</p><h2>Como funciona</h2><p>Você compra ou produz o item, guarda em estoque, embala, envia por transportadora ou correio e cuida de atendimento, trocas e devoluções. Cada etapa tem custo e prazo, e a qualidade do produto influencia diretamente a reputação.</p><h2>Como aplicar</h2><ol><li>Liste todos os custos: produto, embalagem, frete, taxas e perdas.</li><li>Defina onde guardar e como enviar.</li><li>Crie uma política clara de trocas e prazos.</li><li>Teste a qualidade do item antes de vender em maior quantidade.</li></ol><h2>Exemplo hipotético</h2><p>Uma loja fictícia de capinhas precisa considerar o custo da capinha, da embalagem, do frete e das trocas por defeito antes de fixar o preço de venda.</p><h2>Erros comuns</h2><p>Esquecer o frete e as taxas no cálculo, prometer prazos que não consegue cumprir e comprar em grande quantidade sem testar a aceitação.</p>'+K('Produtos físicos exigem atenção a estoque, embalagem, entrega, atendimento e trocas, e todos esses custos entram no preço.')),L('Afiliados como modelo de negócio','<h2>O que é</h2><p>É a atividade de divulgar produtos de terceiros e receber comissão por vendas válidas, sem fabricar, estocar ou entregar.</p><h2>Para que serve</h2><p>Permite começar com pouco investimento inicial e testar nichos, mas a renda depende da sua capacidade de atrair pessoas e não é garantida.</p><h2>Como funciona</h2><p>Você escolhe produtos, divulga com seu link e recebe comissão conforme as regras do programa. Em comparação com ter o próprio produto, você tem menos controle sobre qualidade, preço, suporte e condições de venda.</p><h2>Como aplicar</h2><ol><li>Escolha um nicho que você conheça.</li><li>Selecione ofertas confiáveis e leia as regras.</li><li>Crie conteúdo útil que atraia o público.</li><li>Acompanhe resultados e custos.</li></ol><h2>Exemplo hipotético</h2><p>Um afiliado fictício divulga planilhas de terceiros, sem precisar criar ou entregar nada, mas depende das regras do produtor e da reputação dele.</p><h2>Erros comuns</h2><p>Achar que não há custo ou trabalho, depender de um único produto e ignorar a reputação do produtor.</p>'+K('Afiliado vende produto de terceiros: tem menos custo inicial, mas menos controle e nenhuma renda garantida.')),L('Loja virtual e marketplaces','<h2>O que é</h2><p>Loja virtual é um site próprio de vendas. Marketplace é uma plataforma que reúne vários vendedores e já tem público e estrutura de pagamento.</p><h2>Para que serve entender</h2><p>Ajuda a escolher onde vender conforme seu orçamento, controle desejado e capacidade de atrair visitas.</p><h2>Como funciona</h2><p>Na loja própria, você controla marca, preços e relacionamento, mas precisa atrair o público. No marketplace, há mais visitas prontas, porém com taxas, regras rígidas e muita concorrência. As condições variam conforme a plataforma.</p><h2>Como aplicar</h2><ol><li>Compare taxas, regras e custos de cada opção.</li><li>Avalie quem já vende o mesmo produto.</li><li>Comece em um canal e aprenda antes de abrir outro.</li><li>Cuide de fotos, descrições e atendimento.</li></ol><h2>Exemplo hipotético</h2><p>Uma vendedora fictícia começa em um marketplace para testar a demanda e, depois de entender o público, cria uma loja própria.</p><h2>Erros comuns</h2><p>Ignorar taxas, não ler as regras da plataforma e depender de um canal só.</p>'+K('Loja própria dá controle e exige divulgação; marketplace dá visitas e cobra taxas e regras.')),L('Fornecedores','<h2>O que é</h2><p>Fornecedor é quem produz ou vende os produtos que você revende. A escolha dele afeta qualidade, prazo, custo e atendimento.</p><h2>Para que serve</h2><p>Um bom fornecedor reduz problemas de entrega e devolução; um ruim prejudica sua reputação.</p><h2>Como funciona</h2><p>Você pesquisa opções, compara preços, pede informações, testa amostras e avalia a confiabilidade antes de comprar em quantidade.</p><h2>Como aplicar</h2><ol><li>Pesquise vários fornecedores e verifique a reputação.</li><li>Compare preços, prazos e quantidades mínimas.</li><li>Peça amostras quando possível.</li><li>Mantenha mais de uma opção.</li></ol><h2>Exemplo hipotético</h2><p>Antes de comprar 100 unidades, você encomenda 3 de um fornecedor fictício para testar acabamento e prazo.</p><h2>Erros comuns</h2><p>Escolher só pelo menor preço, não testar amostras e depender de um fornecedor único.</p>'+K('Pesquise, compare e teste fornecedores antes de comprar em quantidade, e não decida apenas pelo preço.')),L('Dropshipping','<h2>O que é</h2><p>Dropshipping é vender produtos sem manter estoque próprio: quando o cliente compra, o fornecedor envia o item diretamente a ele.</p><h2>Para que serve</h2><p>Reduz o capital inicial em estoque, mas você continua responsável por atendimento e pela experiência do cliente.</p><h2>Como funciona</h2><p>Você anuncia o produto, recebe o pedido e repassa ao fornecedor, que cuida da entrega. Você não controla diretamente qualidade, prazos e embalagem, e problemas do fornecedor viram problemas seus perante o cliente.</p><h2>Como aplicar</h2><ol><li>Escolha fornecedores com bom histórico.</li><li>Informe prazos reais ao cliente.</li><li>Defina como resolver atrasos e trocas.</li><li>Calcule margem incluindo taxas.</li></ol><h2>Exemplo hipotético</h2><p>Uma loja fictícia vende fones de ouvido e o fornecedor envia direto ao comprador. Se o envio atrasa, a loja precisa dar suporte.</p><h2>Erros comuns</h2><p>Prometer prazos curtos, não testar o produto e ignorar as margens reduzidas.</p>'+K('No dropshipping você não tem estoque, mas responde pelo atendimento e depende do fornecedor.')),L('Estoque próprio','<h2>O que é</h2><p>É comprar ou produzir os itens e mantê-los guardados até a venda.</p><h2>Para que serve</h2><p>Permite controlar qualidade, embalagem e prazo de envio, mas exige capital e espaço.</p><h2>Como funciona</h2><p>Você investe antes de vender. Parte do dinheiro fica parada em mercadorias, e itens que não vendem geram perda. É preciso controlar entradas e saídas.</p><h2>Como aplicar</h2><ol><li>Comece com pequenas quantidades.</li><li>Registre o que entra e sai.</li><li>Defina estoque mínimo.</li><li>Avalie giro e perdas.</li></ol><h2>Exemplo hipotético</h2><p>Você compra 50 unidades por R$ 1.000. Se vender só 20, ficam R$ 600 em mercadoria parada.</p><h2>Erros comuns</h2><p>Comprar demais, não controlar o estoque e esquecer custos de armazenamento.</p>'+K('Estoque próprio dá controle, mas prende dinheiro e traz risco de sobras.')),L('Como calcular custos e preços','<h2>O que é</h2><p>É somar todos os custos de vender um produto e definir um preço que cubra os gastos e deixe margem.</p><h2>Para que serve</h2><p>Evita vender com prejuízo sem perceber.</p><h2>Como funciona</h2><p>Você soma custo do produto, taxas de pagamento ou plataforma, frete, impostos aplicáveis, embalagem, comissões e despesas, e compara com o preço. A margem é a diferença, vista em percentual.</p><h2>Como aplicar</h2><ol><li>Liste todos os custos por unidade.</li><li>Some e defina a margem desejada.</li><li>Teste o preço contra a concorrência.</li><li>Reveja quando os custos mudarem.</li></ol><h2>Exemplo hipotético</h2><p>Custos de R$ 60 e preço de R$ 100 deixam R$ 40 de margem, ou 40% do preço. Valores ilustrativos.</p><h2>Erros comuns</h2><p>Esquecer taxas e frete, copiar o preço do concorrente e não recalcular.</p>'+K('Preço bom cobre todos os custos e deixa margem; use a calculadora em Ferramentas.')),L('Como validar uma ideia','<h2>O que é</h2><p>É testar o interesse real do público antes de investir muito dinheiro.</p><h2>Para que serve</h2><p>Reduz o risco de gastar em algo que ninguém quer.</p><h2>Como funciona</h2><p>Você conversa com potenciais compradores, mostra a oferta e observa sinais de interesse: perguntas, cadastros, pré-vendas ou compras de teste.</p><h2>Como aplicar</h2><ol><li>Descreva a oferta em poucas linhas.</li><li>Mostre a 10 pessoas do público e anote reclamações.</li><li>Faça um teste pequeno, como página simples ou lista de espera.</li><li>Decida ajustar, continuar ou parar.</li></ol><h2>Exemplo hipotético</h2><p>Antes de produzir um curso, você publica uma página de lista de espera e vê quantas pessoas se cadastram.</p><h2>Erros comuns</h2><p>Perguntar só a amigos, ignorar sinais negativos e investir antes de testar.</p>'+K('Valide com poucas pessoas e pouco dinheiro antes de investir; nenhum teste garante sucesso.')));
M.find(x=>x.n==='Tráfego').l=[L('Orgânico: o que é tráfego orgânico','<h2>O que é</h2><p>Tráfego orgânico são as visitas e o interesse que chegam até você sem que cada acesso dependa de um anúncio pago. Elas vêm de conteúdos, buscas, recomendações, compartilhamentos e do interesse do próprio público.</p><h2>Para que serve</h2><p>Serve para ser descoberto, gerar relacionamento e criar oportunidades de venda sem pagar por cada clique.</p><h2>Como funciona</h2><p>Você publica algo útil, as plataformas mostram a pessoas que podem se interessar e quem gosta salva, compartilha ou visita seu perfil. Por isso exige tempo e constância, e não tem resultado garantido.</p><h2>Como aplicar</h2><ol><li>Defina o público e o tema.</li><li>Publique com regularidade.</li><li>Observe o que gera interesse.</li></ol><h2>Exemplo hipotético</h2><p>Um perfil fictício ensina dicas de organização e algumas pessoas passam a segui-lo e visitar a página.</p><h2>Erros comuns</h2><p>Esperar resultado rápido, publicar sem tema definido e desistir cedo.</p>'+K('Orgânico não tem custo por clique, mas custa tempo e exige constância.')),L('Orgânico: para que serve','<h2>O que é</h2><p>É entender os usos do tráfego orgânico no negócio.</p><h2>Para que serve</h2><p>Ajuda na descoberta da marca, no relacionamento, nas visitas ao perfil ou página, no reconhecimento e nas oportunidades de venda, principalmente quando o conteúdo educa e conquista confiança antes da oferta.</p><h2>Como funciona</h2><p>A pessoa conhece o conteúdo, volta a ver outros, passa a confiar e, no momento certo, considera a oferta. Esse caminho pode levar dias ou meses.</p><h2>Como aplicar</h2><ol><li>Defina qual objetivo cada conteúdo tem: descobrir, aprender ou comprar.</li><li>Use um próximo passo claro.</li></ol><h2>Exemplo hipotético</h2><p>Um vídeo ensina um cálculo simples e convida a baixar uma calculadora gratuita.</p><h2>Erros comuns</h2><p>Querer vender em todo conteúdo e não dar nenhum caminho depois.</p>'+K('O orgânico funciona melhor para descoberta e confiança, e pode levar tempo a gerar vendas.')),L('Orgânico: como funciona','<h2>O que é</h2><p>É o processo pelo qual um conteúdo chega até pessoas que não são seus seguidores.</p><h2>Para que serve entender</h2><p>Ajuda a criar conteúdos com mais chance de serem recomendados.</p><h2>Como funciona</h2><p>Plataformas e buscadores observam sinais como tempo assistido, compartilhamentos, salvamentos e relevância para uma pesquisa. As regras exatas mudam e não são totalmente públicas, então o caminho é testar e medir.</p><h2>Como aplicar</h2><ol><li>Crie conteúdos claros para um público definido.</li><li>Teste formatos e horários.</li><li>Compare dados.</li></ol><h2>Exemplo hipotético</h2><p>Você nota que vídeos curtos com um passo a passo são mais salvos que os longos.</p><h2>Erros comuns</h2><p>Acreditar em fórmulas mágicas e não analisar os dados.</p>'+K('Ninguém controla o algoritmo: teste, meça e mantenha o que funciona.')),L('Orgânico: estratégias para Instagram','<h2>O que é</h2><p>É organizar o perfil e os conteúdos para atrair e reter pessoas no Instagram.</p><h2>Para que serve</h2><p>Para ser descoberto por reels, carrosséis e buscas e transformar visitas em seguidores e cliques.</p><h2>Como funciona</h2><p>O perfil explica quem você é, os conteúdos atraem e a chamada para ação leva ao próximo passo. Recursos e regras podem mudar com o tempo.</p><h2>Como aplicar</h2><ol><li>Ajuste nome, biografia e link.</li><li>Alterne vídeos curtos, carrosséis e stories.</li><li>Use chamadas para ação claras.</li><li>Analise os resultados toda semana.</li></ol><h2>Exemplo hipotético</h2><p>Um perfil de planilhas publica um carrossel de 6 telas e vídeos curtos com dicas.</p><h2>Erros comuns</h2><p>Perfil confuso, posts sem objetivo e foco apenas em curtidas.</p>'+K('No Instagram, perfil claro, conteúdos úteis e análise regular vão juntos.')),L('Orgânico: estratégias para TikTok','<h2>O que é</h2><p>É planejar vídeos curtos para o TikTok com assunto claro e bom ritmo.</p><h2>Para que serve</h2><p>Para ser descoberto por pessoas interessadas no tema, mesmo sem muitos seguidores.</p><h2>Como funciona</h2><p>O vídeo é mostrado a pequenos grupos e, se prende a atenção, pode ser exibido a mais pessoas. Nada garante isso.</p><h2>Como aplicar</h2><ol><li>Tenha uma ideia por vídeo.</li><li>Use gancho nos primeiros segundos.</li><li>Demonstre o produto em uso, quando houver.</li><li>Acompanhe retenção e compartilhamentos.</li></ol><h2>Exemplo hipotético</h2><p>Um vídeo de 20 segundos mostra um erro comum e como corrigi-lo.</p><h2>Erros comuns</h2><p>Enrolar no início, copiar tendências sem relação com o tema e desistir após poucos vídeos.</p>'+K('No TikTok, clareza, gancho e teste constante valem mais que um único vídeo perfeito.')),L('Orgânico: pesquisa de assuntos','<h2>O que é</h2><p>É descobrir as dúvidas, problemas e interesses do público para decidir o que publicar.</p><h2>Para que serve</h2><p>Para criar conteúdos relevantes em vez de adivinhar.</p><h2>Como funciona</h2><p>Você observa comentários, mensagens, perguntas em buscadores e conteúdos de outros criadores e agrupa os temas mais recorrentes.</p><h2>Como aplicar</h2><ol><li>Anote perguntas que as pessoas fazem.</li><li>Pesquise sugestões nos buscadores.</li><li>Priorize os assuntos mais frequentes.</li></ol><h2>Exemplo hipotético</h2><p>Se muitos perguntam como dividir o salário, isso vira uma série de conteúdos.</p><h2>Erros comuns</h2><p>Escolher temas só pelo que você quer falar e ignorar o que o público pergunta.</p>'+K('Pesquise as dúvidas reais do público antes de criar.')),L('Orgânico: distribuição de conteúdo','<h2>O que é</h2><p>É levar o mesmo conteúdo a diferentes canais, adaptando o formato.</p><h2>Para que serve</h2><p>Para alcançar mais pessoas e aproveitar o trabalho feito.</p><h2>Como funciona</h2><p>Cada plataforma tem formato e público próprios. Você adapta início, duração, texto e chamada para ação, sem copiar tudo igual.</p><h2>Como aplicar</h2><ol><li>Escolha um conteúdo bom.</li><li>Adapte para cada canal.</li><li>Compare resultados.</li></ol><h2>Exemplo hipotético</h2><p>Um roteiro vira vídeo curto, carrossel e newsletter.</p><h2>Erros comuns</h2><p>Copiar sem adaptar e repetir demais.</p>'+K('Distribuir é adaptar, e não simplesmente copiar e colar.')),L('Orgânico: conversão por tráfego orgânico','<h2>O que é</h2><p>É orientar pessoas interessadas para um perfil, página, produto ou link.</p><h2>Para que serve</h2><p>Para transformar atenção em ação sem tornar tudo propaganda.</p><h2>Como funciona</h2><p>Conteúdos úteis geram confiança e algumas publicações convidam ao próximo passo, como baixar um material ou ver o produto.</p><h2>Como aplicar</h2><ol><li>Use a regra: vários conteúdos úteis e poucos de oferta.</li><li>Dê um único próximo passo claro.</li><li>Acompanhe cliques.</li></ol><h2>Exemplo hipotético</h2><p>O link da biografia leva a uma página com o material gratuito.</p><h2>Erros comuns</h2><p>Vários links sem foco e chamadas confusas.</p>'+K('Conduza com utilidade e um próximo passo claro.')),L('Orgânico: análise e melhoria','<h2>O que é</h2><p>É avaliar visualizações, retenção, compartilhamentos, visitas ao perfil e cliques.</p><h2>Para que serve</h2><p>Para decidir o que repetir, ajustar ou abandonar.</p><h2>Como funciona</h2><p>Você compara conteúdos parecidos e olha tendências ao longo de semanas, não um único número.</p><h2>Como aplicar</h2><ol><li>Registre os dados toda semana.</li><li>Compare formatos e temas.</li><li>Teste uma mudança por vez.</li></ol><h2>Exemplo hipotético</h2><p>Vídeos com gancho de pergunta retêm mais que os com saudação.</p><h2>Erros comuns</h2><p>Decidir com poucos dados e confundir correlação com causa.</p>'+K('Analise para planejar os próximos testes, sem concluir demais de poucos dados.'))];
M.find(x=>x.n==='Tráfego').l.push(L('Pago: o que é tráfego pago','<h2>O que é</h2><p>Tráfego pago é a compra de espaços publicitários para mostrar anúncios a públicos definidos, em plataformas como redes sociais e buscadores.</p><h2>Para que serve</h2><p>Serve para alcançar pessoas mais rápido do que o orgânico, divulgar produtos, gerar visitas, captar contatos e buscar vendas.</p><h2>Como funciona</h2><p>Você escolhe um objetivo, público, anúncio e orçamento. A plataforma exibe e cobra conforme o modelo da campanha, como cliques ou impressões. O dinheiro é gasto mesmo que ninguém compre.</p><h2>Como aplicar</h2><ol><li>Tenha uma oferta e um destino prontos.</li><li>Comece com um orçamento baixo.</li><li>Acompanhe os resultados.</li></ol><h2>Exemplo hipotético</h2><p>Você investe R$ 50 para testar um anúncio da planilha e vê quantas pessoas clicam.</p><h2>Erros comuns</h2><p>Anunciar sem página pronta, sem objetivo e sem acompanhar custos.</p>'+K('Tráfego pago é rápido, mas tem custo e risco: comece pequeno e acompanhe.')),L('Pago: para que serve','<h2>O que é</h2><p>São os usos práticos do tráfego pago no negócio.</p><h2>Para que serve</h2><p>Para divulgar um produto, levar visitas a uma página, captar cadastros e buscar vendas, testando ofertas e públicos com mais rapidez.</p><h2>Como funciona</h2><p>Cada objetivo pede um tipo de campanha e uma métrica diferente. Anunciar para vendas, por exemplo, exige uma página de vendas funcionando.</p><h2>Como aplicar</h2><ol><li>Escolha um objetivo principal.</li><li>Defina como será medido.</li></ol><h2>Exemplo hipotético</h2><p>Uma campanha de cadastros leva ao checklist grátis, e depois uma sequência de e-mails apresenta a planilha.</p><h2>Erros comuns</h2><p>Querer vendas sem página e sem confiança construída.</p>'+K('Defina o objetivo antes de anunciar.')),L('Pago: como funciona uma campanha','<h2>O que é</h2><p>Uma campanha reúne objetivo, público, anúncios, texto, orçamento e destino.</p><h2>Para que serve</h2><p>Para organizar o investimento e comparar resultados.</p><h2>Como funciona</h2><p>Em muitas plataformas há três níveis: campanha, conjunto de anúncios e anúncio, mas os nomes e recursos variam conforme a plataforma. A campanha define o objetivo, o conjunto define público e orçamento e o anúncio traz imagem e texto.</p><h2>Como aplicar</h2><ol><li>Defina objetivo e destino.</li><li>Configure público e orçamento.</li><li>Crie 2 anúncios.</li><li>Acompanhe.</li></ol><h2>Exemplo hipotético</h2><p>Objetivo: cadastros. Público: jovens interessados em finanças. Orçamento: R$ 20 por dia durante 5 dias.</p><h2>Erros comuns</h2><p>Mudar tudo no meio do teste.</p>'+K('Campanha clara: objetivo, público, anúncio, orçamento e medição.')),L('Pago: plataformas de anúncios','<h2>O que é</h2><p>São os serviços onde você compra anúncios, como Meta Ads e Google Ads.</p><h2>Para que serve</h2><p>Cada plataforma alcança pessoas de forma diferente: redes mostram anúncios enquanto a pessoa navega, buscadores mostram quando ela pesquisa algo.</p><h2>Como funciona</h2><p>Os conceitos são parecidos, mas recursos, nomes, regras e políticas variam e mudam. Consulte sempre a documentação oficial atual.</p><h2>Como aplicar</h2><ol><li>Escolha a plataforma conforme onde seu público está.</li><li>Leia as políticas de anúncios.</li></ol><h2>Exemplo hipotético</h2><p>Quem procura planilha de gastos no buscador pode ser alcançado por anúncio de busca.</p><h2>Erros comuns</h2><p>Supor que as regras são iguais em todas as plataformas.</p>'+K('Os conceitos são parecidos, mas as regras mudam: confira a documentação atual.')),L('Pago: definição de público','<h2>O que é</h2><p>É escolher quem verá o anúncio por interesses, necessidades, localização e intenção.</p><h2>Para que serve</h2><p>Para evitar gastar com quem não tem interesse.</p><h2>Como funciona</h2><p>Você usa as opções permitidas pela plataforma, que podem mudar, e testa diferentes grupos.</p><h2>Como aplicar</h2><ol><li>Descreva seu cliente.</li><li>Escolha critérios disponíveis.</li><li>Evite públicos pequenos demais.</li><li>Compare os resultados.</li></ol><h2>Exemplo hipotético</h2><p>Público A: interessados em finanças. Público B: interessados em planilhas. Compare o custo por clique.</p><h2>Erros comuns</h2><p>Segmentar demais, usar critérios não permitidos.</p>'+K('Teste públicos e siga as regras da plataforma.')),L('Pago: criativos e textos','<h2>O que é</h2><p>São as imagens, vídeos, títulos e mensagens do anúncio.</p><h2>Para que serve</h2><p>Para chamar atenção e comunicar a oferta com clareza.</p><h2>Como funciona</h2><p>O criativo precisa combinar com a página de destino e não prometer o que o produto não entrega.</p><h2>Como aplicar</h2><ol><li>Mostre o benefício logo.</li><li>Use texto curto.</li><li>Faça 2 ou 3 versões.</li></ol><h2>Exemplo hipotético</h2><p>Vídeo de 15 segundos mostrando a planilha pronta.</p><h2>Erros comuns</h2><p>Anúncio chamativo e página diferente.</p>'+K('Criativo claro, honesto e coerente com a oferta.')),L('Pago: orçamento','<h2>O que é</h2><p>É o limite que você decide investir.</p><h2>Para que serve</h2><p>Para evitar perdas e testar com segurança.</p><h2>Como funciona</h2><p>Defina um valor que você pode perder, divida em testes e pause o que não funciona.</p><h2>Como aplicar</h2><ol><li>Defina o limite total.</li><li>Divida entre 2 ou 3 testes.</li><li>Revise todos os dias.</li></ol><h2>Exemplo hipotético</h2><p>R$ 100 divididos em 2 anúncios de R$ 50. Valores ilustrativos.</p><h2>Erros comuns</h2><p>Gastar tudo de uma vez e aumentar rapidamente o investimento.</p>'+K('Invista só o que pode perder e teste aos poucos.')),L('Pago: métricas','<h2>O que é</h2><p>São os números que mostram o desempenho: impressões, alcance, cliques, custo por clique, conversões e custo por aquisição.</p><h2>Para que serve</h2><p>Para decidir com dados.</p><h2>Como funciona</h2><p>CPC = gasto ÷ cliques. CPA = gasto ÷ vendas. Ex.: R$ 100 e 200 cliques geram CPC de R$ 0,50; 4 vendas geram CPA de R$ 25.</p><h2>Como aplicar</h2><ol><li>Registre os números.</li><li>Compare com seu ganho por venda.</li></ol><h2>Exemplo hipotético</h2><p>Se cada venda deixa R$ 20 de ganho e o CPA é R$ 25, há prejuízo.</p><h2>Erros comuns</h2><p>Olhar só cliques.</p>'+K('Cliques não são vendas: compare o custo com o ganho.')),L('Pago: testes e otimização','<h2>O que é</h2><p>É comparar versões e ajustar com base em dados.</p><h2>Para que serve</h2><p>Para reduzir desperdício e melhorar resultados.</p><h2>Como funciona</h2><p>Mude uma variável por vez, como o gancho, e compare em condições parecidas com dados suficientes.</p><h2>Como aplicar</h2><ol><li>Crie duas versões.</li><li>Rode o mesmo orçamento.</li><li>Mantenha a melhor.</li></ol><h2>Exemplo hipotético</h2><p>Anúncio A e B com ganchos diferentes e R$ 25 cada.</p><h2>Erros comuns</h2><p>Mudar várias coisas e decidir com poucos dados.</p>'+K('Teste uma coisa por vez e só conclua com dados suficientes.')),L('Pago: erros comuns','<h2>O que é</h2><p>São falhas que fazem o investimento não dar retorno.</p><h2>Para que serve conhecer</h2><p>Mostra que anúncio não garante vendas.</p><h2>Como funciona</h2><p>Resultado depende de oferta, página, público, preço e atendimento. Um anúncio bom com página fraca perde vendas.</p><h2>Como aplicar</h2><ol><li>Revise a oferta antes de anunciar.</li><li>Teste a página.</li><li>Comece pequeno.</li></ol><h2>Exemplo hipotético</h2><p>Muitos cliques e nenhuma venda podem indicar problema na página ou no preço.</p><h2>Erros comuns</h2><p>Culpar só o anúncio, ignorar riscos e investir demais.</p>'+K('Tráfego pago amplifica o que existe: oferta fraca perde dinheiro.')));
M.find(x=>x.n==='Funis e Conversão').l=[L('O que é um funil de vendas','<h2>O que é</h2><p>Funil de vendas é o caminho que uma pessoa percorre desde o primeiro contato com um produto até a ação desejada, como comprar, se cadastrar ou baixar um material. Ele se chama funil porque, a cada etapa, menos pessoas avançam.</p><h2>Para que serve</h2><p>Serve para organizar o caminho do cliente e identificar onde as pessoas desistem. Muita gente precisa conhecer melhor um produto antes de comprar, e o funil oferece esse caminho de forma planejada.</p><h2>Como funciona</h2><p>Cada etapa tem um objetivo: atrair, despertar interesse, tirar dúvidas e levar à decisão. Você mede quantas pessoas passam de uma etapa para a outra.</p><h2>Como aplicar</h2><ol><li>Defina a ação final.</li><li>Liste as etapas necessárias.</li><li>Meça cada passagem.</li></ol><h2>Exemplo hipotético</h2><p>Vídeo, perfil, página de vendas e checkout: 1.000 pessoas veem o vídeo, 72 clicam e 2 compram. Valores ilustrativos.</p><h2>Erros comuns</h2><p>Ter etapas demais e não medir.</p>'+K('Funil é um caminho com etapas medidas, e não uma fórmula mágica de vendas.')),L('Jornada do cliente','<h2>O que é</h2><p>É o percurso que o cliente faz: descoberta, interesse, consideração, decisão e relacionamento depois da compra.</p><h2>Para que serve</h2><p>Para entender o que a pessoa precisa saber em cada momento e preparar o conteúdo certo.</p><h2>Como funciona</h2><p>Na descoberta, ela conhece o problema. No interesse, busca informações. Na consideração, compara opções. Na decisão, escolhe. Depois, avalia a experiência. Nem toda jornada segue exatamente essa ordem.</p><h2>Como aplicar</h2><ol><li>Pense em uma pessoa real.</li><li>Liste as dúvidas de cada etapa.</li><li>Crie respostas para elas.</li></ol><h2>Exemplo hipotético</h2><p>Alguém descobre a planilha em um vídeo, compara com outras e decide após ler depoimentos.</p><h2>Erros comuns</h2><p>Falar de preço a quem ainda não entendeu o problema.</p>'+K('Cada etapa pede um tipo de informação, e a ordem pode variar.')),L('Tipos de funis','<h2>O que é</h2><p>São modelos de organização do caminho: funil de conteúdo orgânico, de página de vendas, de material gratuito, de produto de baixo valor e de afiliados.</p><h2>Para que serve</h2><p>Para escolher o modelo adequado ao produto e ao público.</p><h2>Como funciona</h2><p>No de conteúdo, o público chega por posts e vai ao link. No de material gratuito, troca contato por um recurso. No de baixo valor, compra algo simples antes de uma oferta maior. No de afiliados, o conteúdo leva ao link do produtor.</p><h2>Como aplicar</h2><ol><li>Escolha o modelo mais simples.</li><li>Teste antes de complicar.</li></ol><h2>Exemplo hipotético</h2><p>Checklist gratuito, e-mails e depois a planilha.</p><h2>Erros comuns</h2><p>Montar funis grandes sem testar o básico.</p>'+K('Comece pelo funil mais simples que atenda seu objetivo.')),L('Como montar um funil','<h2>O que é</h2><p>É transformar o planejamento em peças reais: ponto de entrada, próximo passo e destino da oferta.</p><h2>Para que serve</h2><p>Para que cada pessoa saiba o que fazer depois de cada etapa.</p><h2>Como funciona</h2><p>Você escolhe produto e público, cria o ponto de entrada, define a próxima ação e prepara a página ou o destino. Depois testa o caminho como se fosse cliente.</p><h2>Como aplicar</h2><ol><li>Escolha produto e público.</li><li>Crie o conteúdo de entrada.</li><li>Prepare a página.</li><li>Teste todos os links.</li></ol><h2>Exemplo hipotético</h2><p>Vídeo curto, link da biografia e página de download.</p><h2>Erros comuns</h2><p>Links quebrados e má mensagem entre etapas.</p>'+K('Monte, percorra como cliente e corrija antes de divulgar.')),L('Páginas de vendas','<h2>O que é</h2><p>É a página que apresenta a oferta e ajuda a decidir.</p><h2>Para que serve</h2><p>Para explicar o produto, reduzir dúvidas e levar à compra.</p><h2>Como funciona</h2><p>Em geral traz título claro, benefícios, explicação do conteúdo, provas verdadeiras, perguntas frequentes, preço e chamada para ação.</p><h2>Como aplicar</h2><ol><li>Escreva o benefício no título.</li><li>Explique o que é entregue.</li><li>Responda dúvidas.</li><li>Mostre preço e como comprar.</li></ol><h2>Exemplo hipotético</h2><p>Página da planilha com exemplos de telas e perguntas frequentes.</p><h2>Erros comuns</h2><p>Provas inventadas, texto confuso e preço escondido.</p>'+K('Página clara, honesta e completa ajuda a decidir.')),L('Checkout e processo de compra','<h2>O que é</h2><p>É a etapa final em que a pessoa informa dados e paga.</p><h2>Para que serve</h2><p>Concluir a compra com segurança e clareza.</p><h2>Como funciona</h2><p>Quanto mais simples e confiável, menos pessoas abandonam. Dúvidas comuns: formas de pagamento, prazo de acesso, segurança e reembolso.</p><h2>Como aplicar</h2><ol><li>Peça só dados necessários.</li><li>Mostre formas de pagamento.</li><li>Explique a entrega e a garantia.</li></ol><h2>Exemplo hipotético</h2><p>Checkout com 3 campos e aviso de acesso imediato.</p><h2>Erros comuns</h2><p>Formulários longos e custos surpresa.</p>'+K('Checkout simples, claro e confiável reduz abandono.')),L('O que é conversão','<h2>O que é</h2><p>Conversão é a realização de uma ação desejada: compra, cadastro, download ou clique.</p><h2>Para que serve</h2><p>Para medir se uma etapa cumpre seu objetivo.</p><h2>Como funciona</h2><p>Você define qual ação conta como conversão conforme o objetivo e conta quantas pessoas a realizam.</p><h2>Como aplicar</h2><ol><li>Defina a ação desejada.</li><li>Registre quantas pessoas a fazem.</li></ol><h2>Exemplo hipotético</h2><p>Em uma página de download, a conversão é o cadastro.</p><h2>Erros comuns</h2><p>Chamar de conversão tudo, inclusive curtidas.</p>'+K('Conversão depende do objetivo definido.')),L('Taxa de conversão','<h2>O que é</h2><p>É o percentual de pessoas que realizam a ação em relação ao total que chegou à etapa.</p><h2>Para que serve</h2><p>Para comparar etapas, públicos e versões.</p><h2>Como funciona</h2><p>Taxa = conversões ÷ visitas × 100. Exemplo: 2 vendas em 72 visitas = 2,8%.</p><h2>Como aplicar</h2><ol><li>Conte visitas e conversões do mesmo período.</li><li>Calcule.</li><li>Compare com semanas anteriores.</li></ol><h2>Exemplo hipotético</h2><p>Se 200 visitam e 10 se cadastram, a taxa é 5%.</p><h2>Erros comuns</h2><p>Comparar públicos diferentes ou poucos dados.</p>'+K('Taxa = conversões ÷ visitas × 100; interprete com contexto.')),L('Abandono e gargalos','<h2>O que é</h2><p>Abandono é quando a pessoa sai antes de concluir; gargalo é a etapa onde mais gente sai.</p><h2>Para que serve</h2><p>Para saber onde melhorar primeiro.</p><h2>Como funciona</h2><p>Você compara a passagem entre etapas e levanta hipóteses, como preço, página lenta ou dúvidas sem resposta.</p><h2>Como aplicar</h2><ol><li>Calcule a taxa de cada etapa.</li><li>Ache a menor.</li><li>Teste uma hipótese.</li></ol><h2>Exemplo hipotético</h2><p>Muitos clicam e poucos chegam ao checkout: a página pode estar confusa.</p><h2>Erros comuns</h2><p>Corrigir a etapa errada.</p>'+K('Ache o maior gargalo e teste hipóteses, sem presumir a causa.')),L('Otimização do funil','<h2>O que é</h2><p>É melhorar o funil por testes e comparações.</p><h2>Para que serve</h2><p>Para aumentar a taxa de conversão de modo seguro.</p><h2>Como funciona</h2><p>Você muda um elemento por vez, como título ou chamada, e compara os resultados. Sem dados suficientes, não dá para dizer que a mudança causou o resultado.</p><h2>Como aplicar</h2><ol><li>Escolha um gargalo.</li><li>Teste uma mudança.</li><li>Registre e compare.</li></ol><h2>Exemplo hipotético</h2><p>Trocar o título da página e comparar duas semanas.</p><h2>Erros comuns</h2><p>Mudar tudo ao mesmo tempo.</p>'+K('Teste uma mudança por vez e conclua com cautela.'))];
const Q=(a,b,c,d,e,f,g)=>`<h2>O que é</h2><p>${a}</p><h2>Para que serve</h2><p>${b}</p><h2>Como funciona</h2><p>${c}</p><h2>Como aplicar</h2><ol>${d.map(x=>`<li>${x}</li>`).join('')}</ol><h2>Exemplo prático (hipotético)</h2><p>${e}</p><h2>Erros comuns</h2><p>${f}</p>`+K(g);
M.find(x=>x.n==='Psicologia do Consumidor').l=[L('Como as pessoas tomam decisões',Q('A decisão de compra é o processo pelo qual uma pessoa percebe uma necessidade, busca informações, compara alternativas e escolhe se compra ou não. Ela é influenciada por necessidades, desejos, contexto, experiências anteriores, informações disponíveis e limite de orçamento.','Entender como as pessoas decidem ajuda a criar mensagens, ofertas e páginas que respondam ao que a pessoa realmente precisa saber em cada momento. Assim você evita pressionar quem ainda não está pronto e ajuda quem já está disposto a comprar.','Cada pessoa decide de forma um pouco diferente: algumas pesquisam muito, outras decidem rápido por confiança ou recomendação. O orçamento, a urgência real e experiências passadas pesam bastante. Por isso não existe uma regra única que funcione igual para todos.',['Pergunte a pessoas do seu público como escolheram produtos parecidos no passado.','Liste as informações que elas procuram antes de comprar, como preço, prazo e opiniões.','Responda a essas informações no conteúdo e na página da oferta.','Observe onde as pessoas desistem e ajuste as respostas dadas.'],'Exemplo hipotético: para uma planilha digital de R$ 37, a pessoa quer saber se é fácil de usar e se há garantia. Para uma capinha de celular fictícia, ela quer saber prazo de entrega, material e política de troca. Cada produto pede respostas diferentes.','Erros comuns: achar que todo mundo decide da mesma forma, ignorar o orçamento do público, apressar a decisão com pressão, esconder informações importantes e esquecer que uma pessoa pode precisar de vários contatos antes de comprar.','As pessoas decidem com base em necessidades, contexto, informações e orçamento. Quanto melhor você entende o que seu público precisa saber em cada etapa, mais úteis ficam sua comunicação e sua oferta, sem pressionar ninguém a comprar.')),L('Percepção de valor',Q('Percepção de valor é a avaliação que a pessoa faz sobre o que recebe em comparação com o que paga, considerando dinheiro, tempo e esforço. Duas pessoas podem avaliar o mesmo produto de formas muito diferentes, conforme suas necessidades e experiências.','Entender a percepção de valor ajuda a explicar melhor os benefícios reais do produto e a justificar o preço com clareza. Ela evita que a oferta seja vista apenas como um custo, mostrando o que a pessoa ganha ao usar o que está sendo oferecido.','O valor não está apenas no produto, mas na forma como ele resolve um problema para aquela pessoa. Clareza, exemplos concretos, garantia e comparação com alternativas ajudam a pessoa a enxergar o benefício. Se ela não entende o valor, tende a decidir apenas pelo preço.',['Liste os problemas que o produto resolve e o que a pessoa ganha com isso.','Traduza cada característica em um benefício prático e fácil de imaginar.','Mostre exemplos de uso, resultados possíveis com cautela e a política de garantia.','Compare com o custo de não resolver o problema, sem exagerar.'],'Exemplo hipotético: uma planilha de R$ 37 pode parecer cara para quem não entende o que faz, mas parecer justa para quem sabe que vai economizar horas por mês organizando contas. A página mostra telas, passos de uso e garantia para deixar isso claro.','Erros comuns: falar só de características técnicas, prometer ganhos exagerados, comparar com concorrentes de forma injusta, baixar o preço sem explicar o valor e supor que todas as pessoas valorizam as mesmas coisas.','O valor percebido muda de pessoa para pessoa. Mostre benefícios concretos, explique o que é entregue e seja honesto sobre os limites do produto, para que o preço seja avaliado junto com tudo o que a pessoa realmente recebe.')),L('Confiança',Q('Confiança é a segurança que a pessoa sente de que a marca é verdadeira, entrega o que promete e vai tratar bem quem comprar. Ela se constrói com informações claras, apresentação profissional, políticas transparentes, atendimento e consistência ao longo do tempo.','A confiança reduz o medo de errar na compra, principalmente quando a pessoa não conhece a marca. Sem ela, mesmo uma boa oferta e um preço justo podem ser ignorados, porque a pessoa teme perder dinheiro, tempo ou ser enganada.','A pessoa avalia sinais: quem está por trás da marca, se as informações são claras, se existe suporte e se as promessas parecem realistas. Cada sinal positivo aumenta a segurança, e uma única promessa exagerada ou informação escondida pode destruir meses de trabalho.',['Mostre quem está por trás da marca e como entrar em contato com facilidade.','Explique com clareza o que é entregue, os prazos, as regras de troca e reembolso.','Responda dúvidas com honestidade, incluindo o que o produto não faz.','Cumpra o que prometeu e peça feedback para corrigir falhas.'],'Exemplo hipotético: uma loja fictícia informa o prazo médio de entrega, mostra fotos reais, apresenta a política de troca em linguagem simples e responde mensagens no mesmo dia. Isso diminui a insegurança de quem compra pela primeira vez.','Erros comuns: esconder custos ou prazos, usar fotos e depoimentos que não são reais, demorar a responder, prometer mais do que entrega e mudar regras depois da compra, o que prejudica a reputação rapidamente.','Confiança se constrói com verdade, clareza e consistência: diga o que é o produto, cumpra o que prometeu e atenda bem. Ela leva tempo para ser conquistada e pode ser perdida rapidamente por uma promessa não cumprida.')),L('Desejos e necessidades',Q('Necessidades são carências concretas, como organizar as finanças ou ter um aparelho funcionando. Desejos são vontades que vêm do gosto, do estilo ou da aspiração de cada pessoa. Muitas compras misturam os dois, e a motivação varia de pessoa para pessoa.','Entender a diferença ajuda a comunicar de forma mais precisa o problema que o produto resolve e o benefício que ele traz. Também evita supor que todo mundo compra pelo mesmo motivo, o que leva a mensagens genéricas e pouco convincentes.','Você observa o que as pessoas dizem sobre o problema, que palavras usam e o que tentaram antes. A partir disso, escolhe qual necessidade ou desejo destacar. O mesmo produto pode ser comprado por motivos diferentes, e cada motivo pede uma abordagem distinta.',['Converse com pessoas do público e anote como elas descrevem o problema.','Separe o que é necessidade prática e o que é desejo ou aspiração.','Crie mensagens diferentes para cada motivação principal encontrada.','Teste qual mensagem gera mais interesse e perguntas.'],'Exemplo hipotético: uma pessoa compra uma capinha porque precisa proteger o celular, outra porque quer um visual que combine com seu estilo. A loja fictícia faz anúncios de resistência para o primeiro grupo e de design para o segundo.','Erros comuns: presumir que todos têm a mesma motivação, explorar medos ou inseguranças das pessoas, falar de desejo sem mostrar utilidade real e ignorar a linguagem do público ao descrever o problema.','Necessidades e desejos orientam a mensagem, mas variam de pessoa para pessoa. Escute o público, destaque motivos reais e verdadeiros e evite criar medo ou insegurança para vender, pois isso prejudica a confiança.')),L('Objeções de compra',Q('Objeções são dúvidas ou resistências que impedem a pessoa de comprar, como achar o preço alto, duvidar da qualidade, não ter certeza da utilidade, temer o prazo ou achar difícil de usar. Elas são normais e mostram o que a pessoa ainda precisa saber.','Identificar objeções permite responder antes que elas travem a decisão. Em vez de insistir, você oferece informação, prova ou garantia que ajude a pessoa a decidir com segurança, seja para comprar ou para perceber que o produto não serve.','Você reúne as perguntas e reclamações mais comuns em comentários, mensagens e avaliações e as organiza por tema. Depois responde a cada uma de forma clara e honesta no conteúdo, na página de vendas e no atendimento, sem diminuir a preocupação da pessoa.',['Liste as 5 dúvidas mais frequentes que você recebe sobre a oferta.','Escreva uma resposta clara e honesta para cada uma, com exemplos ou provas verdadeiras.','Coloque essas respostas na página de vendas, em perguntas frequentes e em conteúdos.','Atualize a lista conforme chegam novas dúvidas.'],'Exemplo hipotético: uma planilha de R$ 37 recebe a objeção: não sei usar planilhas. A página passa a mostrar um vídeo de 2 minutos com o passo a passo e uma garantia de reembolso conforme a política da plataforma.','Erros comuns: ignorar dúvidas, responder com pressão, minimizar a preocupação do cliente, prometer o que o produto não faz só para vencer a objeção e tentar convencer quem claramente não é o público do produto.','Objeções mostram o que falta para a pessoa decidir. Responda com clareza, provas verdadeiras e honestidade, aceitando que nem todos serão clientes. Isso melhora a oferta e evita compras que gerariam arrependimento.')),L('Prova social',Q('Prova social é a influência que as experiências e opiniões de outras pessoas têm sobre uma decisão. Aparece em depoimentos, avaliações, números de clientes atendidos e relatos de uso, e só é ética quando as informações são verdadeiras e autorizadas.','Ajuda a reduzir insegurança, principalmente quando a pessoa não conhece a marca. Ver que outras pessoas já usaram e explicaram como foi a experiência torna a decisão mais fácil, desde que o relato seja específico e honesto.','As pessoas tendem a observar o que outras fizeram para se sentirem mais seguras. Um depoimento detalhado, que cita o contexto e os limites, é mais confiável que elogios genéricos. Avaliações negativas respondidas com respeito também aumentam a credibilidade.',['Peça feedback a clientes reais e solicite autorização clara para divulgar.','Escolha relatos específicos, que mostrem contexto e não apenas elogios.','Proteja a privacidade, ocultando dados pessoais quando necessário.','Responda críticas com educação e use o que aprendeu para melhorar.'],'Exemplo hipotético: uma loja fictícia mostra, com autorização, a mensagem de uma cliente dizendo que recebeu a capinha em 5 dias e que o material é resistente. Abaixo, informa que a experiência pode variar de pessoa para pessoa.','Erros comuns: inventar ou alterar depoimentos, publicar sem autorização, mostrar só resultados excepcionais, esconder avaliações negativas, comprar avaliações e apresentar o resultado de um cliente como garantido para todos.','Prova social funciona quando é verdadeira, específica e autorizada. Nunca invente, exagere ou apresente resultados individuais como garantia para todos, pois isso engana as pessoas e pode trazer problemas éticos e legais.')),L('Urgência e escassez',Q('Urgência é a sensação de que existe um prazo para agir. Escassez é a limitação real de quantidade ou de vagas. Ambas influenciam a decisão, e só devem ser usadas quando forem verdadeiras e possíveis de verificar pelo cliente.','Servem para ajudar quem já está decidido a não perder uma condição que de fato acaba, como um desconto com data final ou um estoque limitado. Usadas com honestidade, ajudam a decidir; usadas de forma falsa, destroem a confiança.','Quando existe um prazo ou limite real, a pessoa percebe que esperar tem um custo. Isso pode acelerar uma decisão que ela já queria tomar. Mas, se o prazo é inventado e se repete sempre, o público percebe e passa a desconfiar da marca.',['Defina uma condição real, como data final de uma promoção ou número verdadeiro de vagas.','Comunique a data ou a quantidade com clareza e sem exageros.','Cumpra o que anunciou: quando o prazo acabar, encerre mesmo.','Evite pressionar quem ainda tem dúvidas e ofereça informação.'],'Exemplo hipotético: uma loja fictícia faz uma promoção com data final informada na página e termina no dia combinado. Outra produz um lote pequeno e informa a quantidade real disponível. Ambas explicam as condições com clareza.','Erros comuns: usar contagens regressivas falsas, dizer que restam poucas unidades quando há muitas, reabrir promoções encerradas, pressionar a pessoa a decidir e esconder condições importantes da oferta.','Use urgência e escassez somente quando forem reais e verificáveis. Elas ajudam a decidir quem já está interessado, mas jamais devem ser inventadas, pois o engano prejudica pessoas e a reputação da marca.')),L('Persuasão ética',Q('Persuasão ética é apresentar o valor real de um produto de forma clara e honesta para que a pessoa decida com informação. Ela respeita a liberdade de escolha, não engana, não pressiona de maneira abusiva e não explora vulnerabilidades.','Serve para vender de forma sustentável: clientes bem informados tendem a ficar satisfeitos, pedir menos reembolso e indicar a marca. A persuasão antiética pode gerar lucro rápido, mas costuma causar reclamações, perda de confiança e problemas legais.','Você usa conceitos como valor percebido, prova social e clareza para ajudar a pessoa a entender o produto. A diferença está no objetivo: ajudar a decidir bem, e não conduzir a pessoa a uma compra que ela provavelmente lamentará.',['Diga com clareza o que o produto faz e o que ele não faz.','Mostre preço, prazo e condições sem esconder custos.','Use provas verdadeiras e respeite a privacidade das pessoas.','Aceite que nem toda pessoa precisa comprar e deixe a decisão livre.'],'Exemplo hipotético: uma página de vendas explica para quem o curso serve e para quem não serve, mostra o conteúdo completo, informa o prazo de reembolso e não usa contagem falsa. Quem não se encaixa pode desistir sem pressão.','Erros comuns: prometer resultados garantidos, inventar depoimentos, criar medo para vender, explorar pessoas em situação vulnerável, esconder informações importantes e usar linguagem confusa para dificultar o cancelamento.','Persuadir com ética é informar com clareza, mostrar valor real e respeitar a decisão da pessoa. Resultados duradouros vêm de confiança, e o objetivo é ajudar quem realmente precisa do produto, sem enganar ou pressionar ninguém.'))];
M.find(x=>x.n==='Métricas e Análise').l=[L('Alcance e impressões',Q('Alcance é o número de pessoas diferentes que viram um conteúdo ou anúncio. Impressões é o número total de vezes que ele foi exibido, contando repetições. A mesma pessoa pode gerar várias impressões, mas conta uma única vez no alcance.','Essas métricas mostram o tamanho da audiência e a frequência com que ela vê sua mensagem. Servem para entender se o conteúdo está chegando a novas pessoas e se um anúncio está sendo mostrado vezes demais para o mesmo grupo.','Você encontra esses números nas estatísticas da plataforma. A frequência média é calculada dividindo impressões por alcance. Alcance alto sozinho não significa sucesso: é preciso verificar se essas pessoas assistem, clicam ou se interessam.',['Anote o alcance e as impressões de cada conteúdo na mesma semana.','Calcule a frequência: impressões dividido por alcance.','Compare conteúdos parecidos para ver quais chegam a mais pessoas.','Cruze com cliques e visualizações para saber se o alcance é qualificado.'],'Exemplo hipotético: um anúncio teve 10.000 impressões e alcançou 4.000 pessoas. A frequência média foi 2,5, ou seja, cada pessoa viu o anúncio em média duas vezes e meia. Valores ilustrativos para treinar o cálculo.','Erros comuns: comemorar apenas o alcance, confundir alcance com impressões, ignorar a frequência que pode cansar o público, comparar números de plataformas diferentes como se fossem iguais e esquecer de olhar o que veio depois.','Alcance mostra quantas pessoas viram e impressões mostram quantas vezes foi exibido. São métricas de atenção inicial: úteis, mas insuficientes para avaliar vendas sem observar cliques e conversões.')),L('Visualizações e retenção',Q('Visualizações indicam quantas vezes um vídeo ou conteúdo foi aberto ou assistido. Retenção mostra por quanto tempo as pessoas continuam assistindo, geralmente como tempo médio ou percentual do vídeo visto. As definições exatas variam conforme a plataforma.','A retenção indica se o conteúdo prende a atenção. Muitas visualizações com baixa retenção sugerem que o início chama atenção, mas o restante não entrega o prometido. Ajuda a decidir o que melhorar no roteiro e no gancho.','Normalmente você vê um gráfico de retenção mostrando em que momento as pessoas saem. Quedas bruscas nos primeiros segundos indicam problema no gancho, e quedas no meio indicam trechos longos ou confusos. Compare vídeos de duração parecida.',['Abra o gráfico de retenção de cada vídeo nas estatísticas.','Identifique em que segundo cai a maior parte da audiência.','Ajuste o roteiro nesse ponto, mudando gancho, ritmo ou ordem.','Publique outra versão e compare o resultado.'],'Exemplo hipotético: um vídeo de 30 segundos tem 5.000 visualizações e tempo médio de 6 segundos, ou seja, 20% do vídeo. Outro, com 2.000 visualizações, tem média de 18 segundos. O segundo prendeu mais a atenção. Valores ilustrativos.','Erros comuns: olhar apenas as visualizações, comparar vídeos de durações muito diferentes, concluir com poucos vídeos, copiar a estrutura de um vídeo viral sem entender o motivo e ignorar o contexto do público.','Visualizações mostram quantos abriram e retenção mostra quanto interesse houve. Use o gráfico de retenção para localizar problemas no roteiro e teste mudanças, mantendo a comparação justa entre vídeos parecidos.')),L('Engajamento',Q('Engajamento é o conjunto de interações que as pessoas têm com seu conteúdo: curtidas, comentários, compartilhamentos e salvamentos. Cada interação tem um significado diferente, e a taxa de engajamento costuma relacionar essas ações com o alcance ou com o número de seguidores.','Mostra se o conteúdo desperta reação e conversa. Compartilhamentos e salvamentos costumam indicar utilidade, comentários indicam conversa e curtidas indicam agrado rápido. É útil para entender o que o público valoriza.','Uma forma comum de cálculo é: soma das interações dividida pelo alcance, multiplicada por 100. As plataformas e profissionais usam f
