<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BRYNOX — Plataforma de Marketing Digital</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--sb:#0d0d0f;--card:#131316;--bd:#26262b;--tx:#f2f2f4;--mu:#9a9aa3;--ag:linear-gradient(135deg,#fff,#c9ccd3 45%,#8d919a 70%,#eceef2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 Inter,system-ui,Segoe UI,Arial,sans-serif}
aside{position:fixed;inset:0 auto 0 0;width:250px;background:var(--sb);border-right:1px solid var(--bd);padding:26px 16px;overflow:auto;z-index:5}
.logo{font:700 26px 'UnifrakturCook',Georgia,serif;padding:0 12px 22px;background:var(--ag);-webkit-background-clip:text;background-clip:text;color:transparent}
nav a{display:flex;gap:12px;align-items:center;padding:11px 12px;margin:2px 0;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500;cursor:pointer}
nav a:hover{color:var(--tx)}nav a.on{background:#1b1b1f;color:#fff;box-shadow:inset 2px 0 0 #dfe1e6}
nav i{font-style:normal;width:20px;text-align:center;opacity:.8}
main{margin-left:250px;padding:56px 44px 80px;max-width:1150px}
.eb{font-size:11px;letter-spacing:.22em;color:var(--mu);text-transform:uppercase;font-weight:600}
h1{font-size:44px;line-height:1.1;margin:10px 0 8px;letter-spacing:-.02em;background:var(--ag);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:21px;margin:26px 0 6px}.sub{color:var(--mu);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;font-weight:700;transition:.2s}
.tile:hover{border-color:#d5d8de;box-shadow:0 0 22px #ffffff18}.tile small{display:block;color:var(--mu);font-weight:400;margin-top:6px}
.key{border-left:3px solid #dfe1e6}
.btn{background:var(--ag);color:#0a0a0b;border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer;letter-spacing:.06em;font-size:12px;text-transform:uppercase}
.btn.g{background:#1b1b1f;color:var(--tx);border:1px solid var(--bd)}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}
.back{color:var(--mu);cursor:pointer;font-size:14px}.back:hover{color:#fff}
input{background:#0a0a0b;border:1px solid var(--bd);color:#fff;border-radius:10px;padding:11px 13px;width:100%;font:inherit;margin:4px 0 12px}
label{font-size:12px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.res{font-size:30px;font-weight:800;background:var(--ag);-webkit-background-clip:text;background-clip:text;color:transparent}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:700}
ul{padding-left:20px}.mb{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:9}
@media(max-width:820px){aside{transform:translateX(-100%);transition:.25s}aside.o{transform:none}main{margin:0;padding:64px 18px 60px}h1{font-size:32px}.mb{display:block}}
</style></head><body>
<button class="btn g mb" onclick="document.querySelector('aside').classList.toggle('o')">☰ Menu</button>
<aside><div class="logo">Brynox</div><nav id="nav"></nav></aside><main id="m"></main>
<script>
const L=(t,b)=>({t,b});
const M=[
{n:'Início',i:'⌂'},
{n:'Fundamentos do Marketing Digital',i:'▤',d:'Do zero, sem pré-requisitos.',l:[
L('O que é marketing digital','<p><b>Definição:</b> é o conjunto de ações para atrair, convencer e vender usando canais online (redes sociais, buscadores, e-mail, sites).</p><p><b>Para que serve:</b> fazer o produto certo chegar à pessoa certa, no momento certo, e facilitar a decisão de compra.</p><h2>Marketing, publicidade e vendas</h2><ul><li><b>Marketing:</b> entender o público e construir valor.</li><li><b>Publicidade:</b> divulgar (paga ou não) a oferta.</li><li><b>Vendas:</b> fechar a compra.</li></ul><h2>Exemplo fictício</h2><p>Uma "Planilha Finanças em Ordem" (produto inventado): um vídeo curto ensina a organizar o salário, o link na bio leva à página, a página explica o benefício e o checkout finaliza.</p><h2>Erros comuns</h2><ul><li>Postar sem saber quem é o público.</li><li>Esperar vendas sem oferta clara.</li></ul><div class="card key"><div class="eb">Ponto-chave</div><b>Toda venda online passa por: alguém viu → alguém confiou → alguém clicou → alguém comprou.</b></div><p><b>Exercício:</b> descreva em 3 linhas quem compraria a planilha e por quê.</p>'),
L('Tráfego orgânico x pago','<p><b>Orgânico:</b> atrai pessoas sem pagar direto por anúncios (conteúdo, busca, perfil). Mais lento, custa tempo.</p><p><b>Pago:</b> você paga a plataforma para exibir anúncios. Mais rápido, custa dinheiro e exige medição.</p><p>Nenhum dos dois garante vendas; ambos exigem testar e medir. Comece pequeno e compare os resultados.</p>')]},
{n:'Marketing de Afiliados',i:'◎',d:'Divulgar produtos de terceiros por comissão.',l:[
L('Como funciona o afiliado','<p><b>Definição:</b> o afiliado divulga um produto com link próprio e recebe comissão por venda confirmada.</p><p><b>Atores:</b> produtor (cria), afiliado (divulga) e comprador. Comissões e regras variam conforme o programa.</p><h2>Passo a passo</h2><ol><li>Escolha produto com oferta clara e boa reputação.</li><li>Crie conteúdo útil que mostre o problema que ele resolve.</li><li>Conduza ao link e acompanhe cliques e vendas.</li></ol><p><b>Evite:</b> spam e promessas enganosas.</p>')]},
{n:'Produtos e Modelos de Negócio',i:'▣',d:'Físicos, digitais e como validar.',l:[
L('Físico x digital','<ul><li><b>Digital:</b> e-books, cursos, planilhas. Sem estoque, mas exige confiança e conteúdo.</li><li><b>Físico:</b> roupas, acessórios. Tem estoque/logística e custos.</li></ul><p><b>Modelos:</b> estoque próprio, dropshipping, marketplace, produto de terceiros. Cada um tem custos e riscos; nenhum garante lucro.</p><p><b>Validar:</b> teste a ideia com pouco dinheiro antes de investir mais.</p>')]},
{n:'Criação de Conteúdo',i:'✎',d:'Ideias, roteiros e legendas.',l:[
L('Roteiro de vídeo curto','<p><b>Estrutura:</b> gancho (0–3s) → problema → dica/solução → chamada para ação.</p><h2>Exemplo (fictício)</h2><p><i>Gancho:</i> "3 erros que fazem seu dinheiro sumir." <i>Corpo:</i> explique um erro por vez. <i>CTA:</i> "Link na bio para a planilha."</p><p>Funciona porque é clara e específica, mas não existe fórmula garantida para viralizar.</p>')]},
{n:'Tráfego',i:'⇪',d:'Orgânico e pago.',l:[
L('Tráfego orgânico','<p>Atraia pessoas com conteúdo em TikTok, Instagram e busca. Analise alcance, retenção e cliques; teste formatos e mantenha o que funciona.</p>'),
L('Tráfego pago','<p>Campanha → conjunto de anúncios → anúncio. Defina objetivo, público, criativo e orçamento.</p><h2>Exemplo hipotético</h2><p>Gastou R$ 100, teve 200 cliques: custo por clique = R$ 0,50. Se 4 compraram, CAC = R$ 25. Valores fictícios.</p><p>Risco: investir sem planejamento. Comece com orçamento baixo.</p>')]},
{n:'Funis e Conversão',i:'▽',d:'Do primeiro contato à ação.',l:[
L('Funil e taxa de conversão','<p><b>Etapas:</b> descoberta → interesse → consideração → decisão.</p><p><b>Conversão:</b> ação desejada (compra, cadastro, clique).</p><p><b>Taxa = conversões ÷ visitas × 100.</b> Ex.: 2 vendas em 72 cliques = 2,8%. Meça cada etapa para achar onde as pessoas abandonam.</p>')]},
{n:'Psicologia do Consumidor',i:'☺',d:'Compreender com ética.',l:[
L('Por que as pessoas compram','<ul><li><b>Percepção de valor:</b> mostre o benefício real.</li><li><b>Confiança:</b> clareza e prova social verdadeira.</li><li><b>Objeções:</b> responda dúvidas antes da compra.</li><li><b>Urgência/escassez:</b> só se forem reais.</li></ul><p>Nunca fabrique depoimentos, escassez ou contagens falsas.</p>')]},
{n:'Métricas e Análise',i:'▮',d:'Decidir com dados.',l:[
L('Métricas essenciais','<ul><li><b>Ticket médio</b> = receita ÷ vendas.</li><li><b>Conversão</b> = vendas ÷ visitas.</li><li><b>ROI</b> = (ganho − custo) ÷ custo.</li></ul><p>Correlação não é causa: uma métrica isolada não define o sucesso.</p>')]},
{n:'Ferramentas de Marketing',i:'⚒',tools:1},
{n:'As 80 Técnicas de Marketing',i:'★',tech:1}];
const T=[['Pesquisa de público','Entrevista com clientes','Conversar com 5–10 pessoas do público para entender dúvidas e linguagem.','Liste perguntas abertas, converse, anote padrões.','Ex.: 5 conversas com quem organiza finanças.','Perguntas que induzem a resposta.'],
['Posicionamento','Proposta única de valor','Frase que diz para quem é o produto e o que muda na vida da pessoa.','Complete: "Ajudo [público] a [resultado] sem [obstáculo]".','Ex.: planilha para organizar o salário em 10 minutos.','Frases genéricas.'],
['Copywriting','Gancho específico','Primeira frase que prende atenção com algo concreto.','Escreva 5 ganchos, teste 2.','"3 erros que fazem seu dinheiro sumir."','Prometer o que o produto não entrega.'],
['Conteúdo','Calendário editorial','Planejar temas por semana.','Defina 3 pilares e distribua nos dias.','Seg dica, qua bastidor, sex oferta.','Planejar demais e não publicar.'],
['Tráfego orgânico','Teste de formatos','Comparar vídeo, carrossel e stories.','Publique cada formato 3 vezes e compare retenção.','Reels x carrossel.','Concluir com poucos dados.'],
['Tráfego pago','Teste A/B de criativo','Comparar dois anúncios mudando uma variável.','Mude só o gancho, mesmo orçamento.','Anúncio A x B, R$ 20 cada.','Mudar várias coisas ao mesmo tempo.'],
['Funis','Isca digital','Material gratuito em troca de cadastro.','Crie checklist útil, página simples, e-mail de boas-vindas.','Checklist "Perfil que vende".','Isca sem relação com a oferta.'],
['Retenção','Pós-venda','Acompanhar o cliente depois da compra.','Envie instruções, peça feedback, ofereça ajuda.','Mensagem 3 dias após a compra.','Sumir depois de vender.']];
['Fundamentos do Marketing Digital','Criação de Conteúdo'].forEach(n=>M.splice(M.findIndex(x=>x.n===n),1));
const nav=document.getElementById('nav'),m=document.getElementById('m');
M.forEach((x,k)=>{const a=document.createElement('a');a.innerHTML=`<i>${x.i}</i>${x.n}`;a.onclick=()=>{location.hash='#/'+k};a.dataset.k=k;nav.appendChild(a)});
const E=s=>m.innerHTML=s,w=()=>scrollTo(0,0);
function home(){E(`<div class="eb">Plataforma de estudos</div><h1>BRYNOX</h1><p class="sub">Livro digital interativo de marketing digital. Escolha qualquer aula, sem login e sem ordem obrigatória.</p><div class="card"><div class="eb">Por onde começar</div><b>Sugestão:</b> comece por Afiliados ou Tráfego. Mas você decide.</div><div class="grid">${M.slice(1).map((x,k)=>`<div class="tile" onclick="location.hash='#/${k+1}'">${x.n}<small>${x.d||'Abrir área'}</small></div>`).join('')}</div>`)}
function mod(k){const x=M[k];if(x.tools)return tools();if(x.tech)return tech();E(`<div class="eb">Módulo</div><h1>${x.n}</h1><p class="sub">${x.d}</p><div class="grid">${x.l.map((l,j)=>`<div class="tile" onclick="location.hash='#/${k}/${j}'">${l.t}<small>Aula ${j+1}</small></div>`).join('')}</div>`)}
function aula(k,j){const x=M[k],l=x.l[j];E(`<span class="back" onclick="location.hash='#/${k}'">← Voltar ao índice</span><div class="eb" style="margin-top:22px">${x.n} · Aula ${j+1}</div><h1>${l.t}</h1>${l.b}<div class="bar"><button class="btn g" ${j?'':'disabled style="opacity:.4"'} onclick="location.hash='#/${k}/${j-1}'">← Anterior</button><button class="btn" ${j<x.l.length-1?'':'disabled style="opacity:.4"'} onclick="location.hash='#/${k}/${j+1}'">Próxima →</button></div>`)}
function tools(){E(`<div class="eb">Ferramentas</div><h1>BRYNOX Tools</h1><p class="sub">Ferramentas práticas para aplicar o que você aprende.</p>
<div class="grid"><div class="card"><b>Calculadora de conversão</b><p class="sub" style="margin:6px 0 12px">Vendas ÷ visitas × 100. Ex.: 2 e 72.</p><label>Visitas</label><input id="a" type="number" oninput="c1()"><label>Vendas</label><input id="b" type="number" oninput="c1()"><div class="res" id="r1">—</div></div>
<div class="card"><b>Ticket médio</b><p class="sub" style="margin:6px 0 12px">Receita ÷ vendas. Ex.: 740 e 20.</p><label>Receita (R$)</label><input id="c" type="number" oninput="c2()"><label>Vendas</label><input id="d" type="number" oninput="c2()"><div class="res" id="r2">—</div></div>
<div class="card"><b>Margem e lucro</b><p class="sub" style="margin:6px 0 12px">Ex.: preço 100, custo 60, 10 vendas.</p><label>Preço (R$)</label><input id="e" type="number" oninput="c3()"><label>Custo (R$)</label><input id="f" type="number" oninput="c3()"><label>Vendas</label><input id="g" type="number" oninput="c3()"><div class="res" id="r3">—</div></div></div><p class="sub">Outras ferramentas (copy, calendário, checklists, planejador de funil) ainda não foram implementadas.</p>`)}
const v=i=>parseFloat(document.getElementById(i).value),f=n=>n.toLocaleString('pt-BR',{maximumFractionDigits:2});
function c1(){r1.textContent=v('a')>0&&v('b')>=0?f(v('b')/v('a')*100)+'%':'—'}
function c2(){r2.textContent=v('d')>0&&v('c')>=0?'R$ '+f(v('c')/v('d')):'—'}
function c3(){const p=v('e'),c=v('f'),q=v('g')||0;r3.textContent=p>0&&c>=0?'Margem '+f((p-c)/p*100)+'% · Lucro R$ '+f((p-c)*q):'—'}
function tech(q=''){q=q.toLowerCase();const r=T.filter(t=>(t[0]+t[1]).toLowerCase().includes(q));E(`<div class="eb">Biblioteca</div><h1>As 80 Técnicas</h1><p class="sub">Apenas ${T.length} técnicas implementadas por enquanto. Nenhuma é garantia de venda: teste e meça.</p>${r.map(t=>`<details open><summary>${t[1]} <span class="eb">· ${t[0]}</span></summary><p><b>O que é:</b> ${t[2]}</p><p><b>Como aplicar:</b> ${t[3]}</p><p><b>Exemplo (fictício):</b> ${t[4]}</p><p><b>Erro comum:</b> ${t[5]}</p></details>`).join('')}`);}
function route(){const p=location.hash.replace('#/','').split('/').filter(x=>x!=='').map(Number);const k=p[0]||0;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));document.querySelector('aside').classList.remove('o');if(!k)home();else if(p.length>1)(M[k].tech?tk(p[1]):aula(k,p[1]));else mod(k);w()}
const C=[['Estratégia e posicionamento',['Posicionamento de marca','Definição de público-alvo','Criação de persona','Proposta única de valor','Análise da concorrência','Diferenciação competitiva','Marketing de nicho','Construção de autoridade']],['Marketing de conteúdo',['Conteúdo educativo','Conteúdo de entretenimento','Conteúdo de identificação','Storytelling','Conteúdo baseado em problemas e soluções','Reaproveitamento de conteúdo','Calendário editorial','Conteúdo de prova social']],['Tráfego orgânico',['SEO para mecanismos de busca','Pesquisa de palavras-chave','Otimização de títulos e descrições','Estratégia de hashtags','Otimização de perfil nas redes sociais','Estratégia de vídeos curtos','Gancho nos primeiros segundos','Colaborações com criadores']],['Tráfego pago',['Segmentação de anúncios','Criativos publicitários','Testes A/B de anúncios','Remarketing','Retargeting de visitantes','Campanhas por objetivo','Controle de orçamento publicitário','Otimização de campanhas']],['Redes sociais e comunidade',['Construção de comunidade','Conteúdo interativo','Enquetes e perguntas','Respostas estratégicas a comentários','Marketing de influência','Conteúdo gerado por usuários','Distribuição multiplataforma','Estratégia de consistência de publicação']],['Copywriting e comunicação persuasiva',['AIDA: atenção, interesse, desejo e ação','PAS: problema, agitação e solução','Criação de headlines','Chamadas para ação (CTAs)','Benefícios em vez de apenas características','Tratamento de objeções','Demonstração de valor','Comunicação orientada a benefícios']],['Psicologia do consumidor',['Prova social','Autoridade e credibilidade','Reciprocidade','Escassez real','Urgência legítima','Redução de risco percebido','Ancoragem de preços','Simplificação da decisão de compra']],['Funis de vendas e conversão',['Isca digital','Página de captura','Página de vendas','Sequência de relacionamento','Oferta principal','Order bump','Upsell e cross-sell','Recuperação de carrinho abandonado']],['Marketing de afiliados e modelos de negócio',['Escolha estratégica de produtos para divulgar','Análise de comissões e condições de afiliação','Divulgação por conteúdo','Construção de confiança antes da oferta','Comparativos de produtos','Demonstrações e avaliações honestas','Estratégia de distribuição de ofertas','Relacionamento com potenciais compradores']],['E-mail marketing, retenção e fidelização',['Construção de lista de contatos com consentimento','Segmentação de contatos','Sequência de boas-vindas','Campanhas de e-mail marketing','Pós-venda estratégico','Programas de fidelização']],['Métricas, testes e otimização',['Análise de métricas de marketing','Experimentação contínua e otimização de resultados']]];
const N=C.flatMap(c=>c[1]),KT=M.findIndex(x=>x.tech),go=j=>location.hash='#/'+KT+'/'+j,goList=()=>location.hash='#/'+KT;
const D={0:['É a posição que a marca ocupa na mente do público: para quem é, o que oferece e por que é diferente.','Ajuda as pessoas a entenderem rápido por que escolher a marca e evita comunicação genérica.','O público compara opções em segundos. Uma mensagem clara e repetida com consistência facilita lembrar e confiar na marca.',['Descreva para quem a marca existe.','Escreva o problema que ela resolve.','Liste o que a diferencia das alternativas.','Resuma tudo em uma frase.','Use essa frase em perfil, página e anúncios.'],'Exemplo hipotético: uma loja fictícia de capas de celular se posiciona como capas resistentes para quem trabalha na rua, e todo conteúdo mostra testes de uso.','Querer falar com todo mundo; mudar a mensagem a cada semana; prometer o que não entrega.','Observe se as pessoas repetem sua ideia nos comentários e mensagens e se os cliques vêm do público certo.','Posicionar é escolher um lugar claro na mente do público e ser consistente.'],1:['É identificar o grupo de pessoas com maior chance de se interessar pelo seu produto, com base em necessidades, contexto e comportamento.','Evita gastar tempo e dinheiro falando com quem não tem interesse.','Quanto mais específico o público, mais fácil criar conteúdo e anúncios que façam sentido para ele.',['Liste quem tem o problema que o produto resolve.','Descreva idade aproximada, rotina, dúvidas e onde busca informação.','Converse com algumas pessoas reais desse grupo.','Escolha um grupo principal para começar.'],'Exemplo hipotético: uma planilha de finanças pode mirar jovens no primeiro emprego, não qualquer pessoa.','Definir público por suposição; escolher um grupo amplo demais.','Compare cliques, comentários e vendas entre públicos e veja qual responde melhor.','Conheça bem poucas pessoas antes de tentar agradar muitas.'],3:['Frase curta que explica o benefício principal do produto e o que o torna diferente.','Deixa a oferta compreensível em poucos segundos.','Ela une público, problema, resultado e diferencial em uma só mensagem.',['Complete: Ajudo [público] a [resultado] sem [obstáculo].','Troque termos vagos por detalhes concretos.','Teste a frase com 3 pessoas.','Aplique em bio, página e anúncios.'],'Exemplo hipotético: Planilha para organizar o salário do mês em 10 minutos, sem fórmulas.','Frases genéricas; prometer resultado que não pode ser comprovado.','Veja se a taxa de cliques e a clareza das perguntas melhoram após ajustar a frase.','Se não cabe em uma frase, ainda não está clara.'],22:['É usar a primeira frase ou imagem de um vídeo para prender atenção e dar motivo para continuar assistindo.','Reduz a saída rápida e melhora a retenção.','As plataformas e as pessoas tendem a seguir assistindo quando entendem logo o que vão ganhar.',['Diga o tema ou o problema logo no início.','Evite saudações longas.','Mostre um resultado ou uma pergunta concreta.','Teste 3 ganchos diferentes para o mesmo conteúdo.'],'Exemplo hipotético: 3 erros que fazem seu dinheiro sumir, dito já no primeiro segundo.','Prometer algo no gancho que o vídeo não entrega.','Compare a retenção nos primeiros segundos entre versões.','Gancho bom é específico e cumpre o que promete.'],40:['Modelo de texto em 4 etapas: chamar Atenção, gerar Interesse, despertar Desejo e levar à Ação.','Organiza uma mensagem de venda em uma ordem fácil de seguir.','A pessoa primeiro percebe, depois entende, depois quer e só então age.',['Atenção: abra com algo relevante.','Interesse: explique o problema e a solução.','Desejo: mostre benefícios e provas verdadeiras.','Ação: peça um passo claro.'],'Exemplo hipotético: legenda sobre uma planilha de finanças terminando com Link na bio.','Pular etapas; usar prova inventada; chamada para ação confusa.','Meça cliques e respostas por etapa do texto.','Ordem clara aumenta a chance de a pessoa agir, sem garantir venda.']};
Object.assign(D,{2:['É uma descrição de uma pessoa fictícia que representa seu cliente típico, com rotina, desejos, dúvidas e objeções.','Ajuda a escrever e decidir pensando em alguém concreto, não em um público abstrato.','Ao dar rosto ao público, fica mais fácil escolher o tom, o canal e a oferta.',['Reúna dados de conversas reais com clientes.','Dê um nome e uma rotina à persona.','Liste problemas, objeções e onde ela busca informação.','Use a persona para revisar textos e ideias.'],'Exemplo hipotético: Carla, 24 anos, primeiro emprego, quer controlar gastos e tem medo de planilhas complicadas.','Inventar a persona sem conversar com ninguém; criar muitas personas.','Veja se o conteúdo feito para ela gera mais respostas e cliques.','Persona boa nasce de pessoas reais, não de suposições.'],4:['É estudar quem vende algo parecido: oferta, preço, comunicação e pontos fracos.','Mostra onde há espaço para se diferenciar e evita copiar o que já existe.','Você compara concorrentes em critérios iguais e identifica lacunas.',['Liste 5 concorrentes diretos e indiretos.','Compare preço, promessa, canais e avaliações públicas.','Anote o que eles fazem bem e o que falta.','Defina onde você pode ser melhor ou diferente.'],'Exemplo hipotético: três lojas de capinhas vendem só por preço; você pode destacar durabilidade e garantia.','Copiar o concorrente; olhar só preço.','Confira se a sua mensagem ficou diferente das deles.','Concorrência é fonte de lacunas, não de modelos para copiar.'],5:['É oferecer algo que o público percebe como diferente e relevante em relação às alternativas.','Evita competir só por preço.','A diferença pode estar no produto, atendimento, entrega, garantia ou na forma de ensinar.',['Liste suas forças reais.','Escolha as que importam ao público.','Comunique com provas verdadeiras.','Mantenha a diferença em todos os pontos de contato.'],'Exemplo hipotético: curso curto em formato de checklist, com suporte por e-mail em 24h.','Inventar diferencial que não existe; diferença que o público não valoriza.','Pergunte aos clientes por que escolheram você.','Diferença só vale se o cliente a percebe e valoriza.'],6:['É focar em um grupo pequeno e específico, com necessidades bem definidas.','Facilita ser lembrado e reduzir a concorrência direta.','Um público específico se sente compreendido e tende a prestar mais atenção.',['Escolha um problema específico.','Defina o grupo que o tem.','Crie conteúdo e oferta só para ele.','Amplie depois, se fizer sentido.'],'Exemplo hipotético: planilha de finanças para freelancers de design.','Escolher nicho sem demanda; nicho tão pequeno que não sustenta o negócio.','Observe retorno de comentários, cliques e vendas do grupo.','Começar pequeno e específico pode ajudar, mas exige validar a demanda.'],7:['É ser reconhecido como fonte confiável sobre um assunto, por demonstrar conhecimento e consistência.','Aumenta a confiança antes da oferta.','Conteúdo útil e verdadeiro, repetido ao longo do tempo, constrói reputação.',['Escolha um tema principal.','Publique conteúdos úteis com regularidade.','Mostre processos e resultados reais, sem exagero.','Responda dúvidas com clareza.'],'Exemplo hipotético: perfil que explica uma métrica de marketing por semana.','Fingir expertise; mostrar resultados inventados.','Veja salvamentos, compartilhamentos e perguntas recebidas.','Autoridade se constrói com utilidade e verdade, ao longo do tempo.'],8:['É conteúdo que ensina algo útil ao público: dicas, passo a passo, explicações.','Atrai pessoas com uma dúvida real e gera confiança.','Quem aprende algo útil tende a voltar e a considerar a marca depois.',['Liste dúvidas frequentes do público.','Escolha uma por conteúdo.','Explique em passos simples.','Termine com um próximo passo.'],'Exemplo hipotético: vídeo de 30s sobre como calcular a taxa de conversão.','Ensinar demais num só conteúdo; só falar do produto.','Veja retenção, salvamentos e compartilhamentos.','Ensine uma coisa por vez e de forma aplicável.'],9:['É conteúdo feito para divertir, usando humor, histórias ou curiosidades.','Gera alcance e aproximação com a marca.','O prazer de assistir faz as pessoas compartilharem.',['Escolha um formato leve.','Conecte ao universo do seu produto.','Mantenha a identidade da marca.','Alterne com conteúdo útil.'],'Exemplo hipotético: esquete sobre os erros de quem nunca organizou as finanças.','Humor sem relação com o tema; ofender pessoas.','Compare alcance, comentários e seguidores novos.','Entretenimento atrai, mas precisa conversar com a marca.'],10:['É conteúdo em que o público se reconhece: situações, sentimentos e rotinas comuns.','Cria conexão e sensação de ser compreendido.','Quando a pessoa pensa: isso sou eu, a chance de interagir aumenta.',['Observe situações do dia a dia do público.','Retrate-as com sinceridade.','Convide a comentar a própria experiência.'],'Exemplo hipotético: post sobre a sensação de o salário acabar antes do fim do mês.','Estereótipos; exagero que afasta.','Observe comentários e compartilhamentos.','Se o público se reconhece, ele conversa.'],11:['É contar uma história para transmitir uma ideia ou valor de forma memorável.','Torna mensagens abstratas mais fáceis de entender e lembrar.','Histórias têm começo, conflito e resolução, o que prende atenção.',['Defina a mensagem principal.','Apresente o problema.','Mostre a virada ou solução.','Feche com um aprendizado.'],'Exemplo hipotético: a história fictícia de alguém que organizou as contas em uma semana.','Inventar história como se fosse real; história longa sem objetivo.','Veja retenção e comentários.','Boa história serve a uma mensagem clara.'],12:['É criar conteúdo que apresenta um problema real e uma forma de resolvê-lo.','Mostra utilidade e conecta o produto a uma necessidade.','O público procura soluções; quem explica o caminho ganha atenção.',['Escolha um problema específico.','Explique a causa.','Mostre a solução em passos.','Apresente o produto como uma das opções, se fizer sentido.'],'Exemplo hipotético: Por que a pele resseca no inverno e como cuidar, antes de mostrar um hidratante.','Falar só do produto; esconder limitações.','Veja cliques e perguntas sobre o produto.','Problema claro, solução honesta.'],13:['É adaptar um conteúdo para vários formatos e canais.','Economiza tempo e amplia o alcance.','Uma mesma ideia pode virar vídeo, carrossel, texto e e-mail.',['Escolha um conteúdo que funcionou.','Adapte o formato a cada canal.','Mude o início para cada público.'],'Exemplo hipotético: roteiro de vídeo que vira carrossel de 6 telas.','Copiar sem adaptar; repetir demais.','Compare desempenho por formato.','Reaproveitar é adaptar, não duplicar.'],14:['É planejar o que publicar, quando e onde.','Dá consistência e evita improviso.','Um calendário organiza temas, formatos e objetivos.',['Defina 3 pilares de conteúdo.','Distribua nas semanas.','Reserve espaço para ajustes.','Revise a cada mês.'],'Exemplo hipotético: seg dica, qua bastidor, sex oferta.','Planejar demais e não publicar; calendário rígido.','Veja se você manteve a frequência e quais temas performaram.','Planejar ajuda a manter constância.'],15:['É mostrar experiências reais de clientes com o produto.','Reduz dúvidas e aumenta a confiança.','Pessoas observam o que outras já viveram.',['Peça feedback com autorização.','Mostre o contexto real.','Respeite a privacidade.'],'Exemplo hipotético: print de mensagem de cliente (autorizado) sobre a planilha.','Inventar depoimentos; mostrar só os melhores sem contexto.','Observe cliques e perguntas depois da publicação.','Prova social só funciona se for verdadeira.']});
Object.assign(D,{16:['É otimizar páginas e conteúdos para aparecerem em buscadores como o Google quando alguém pesquisa um assunto.','Atrai visitas que já procuram uma solução, sem pagar por clique.','Os buscadores analisam relevância, clareza e utilidade do conteúdo para a pesquisa feita.',['Escolha um tema que as pessoas pesquisam.','Escreva um conteúdo completo e claro.','Use o termo pesquisado no título e no texto, naturalmente.','Atualize quando necessário.'],'Exemplo hipotético: artigo Como calcular ticket médio, para quem busca essa dúvida.','Repetir palavras sem naturalidade; esperar resultado imediato.','Acompanhe visitas vindas de busca e tempo de leitura.','SEO é útil e lento: exige conteúdo bom e paciência.'],17:['É descobrir os termos que o público digita ao pesquisar um assunto.','Mostra o que as pessoas querem saber.','Ferramentas de busca indicam interesse e variações de pesquisa.',['Liste temas do seu nicho.','Pesquise variações em buscadores e ferramentas.','Agrupe por intenção: aprender ou comprar.','Crie um conteúdo por termo principal.'],'Exemplo hipotético: como organizar salário vs planilha de gastos grátis.','Focar só em termos muito disputados.','Veja se o conteúdo recebe visitas pelo termo escolhido.','Pesquise antes de escrever.'],18:['É escrever títulos e descrições claros que incentivem o clique nos resultados de busca e nas redes.','Melhora a taxa de cliques.','É a primeira informação que a pessoa vê antes de decidir abrir.',['Inclua o assunto principal.','Mostre o benefício.','Mantenha curto.','Evite exageros.'],'Exemplo hipotético: Como organizar o salário em 10 minutos.','Título enganoso; texto longo demais.','Compare cliques entre versões.','Título claro atrai quem realmente se interessa.'],19:['São palavras-chave marcadas com # que ajudam a classificar o conteúdo.','Contextualizam o assunto para a plataforma e o público.','Podem ajudar na descoberta, mas não garantem alcance.',['Escolha hashtags relevantes ao tema.','Misture amplas e específicas.','Use poucas, coerentes.','Observe quais trazem visitas.'],'Exemplo hipotético: #financaspessoais e #organizacaofinanceira em um vídeo de dicas.','Usar dezenas sem relação com o conteúdo.','Veja o alcance de não seguidores.','Hashtag complementa, não substitui bom conteúdo.'],20:['É ajustar foto, nome, bio, link e destaques para que o perfil explique quem você é.','Converte visitantes em seguidores e cliques.','O perfil é a vitrine para quem chega por um conteúdo.',['Nome e bio claros com o benefício.','Foto reconhecível.','Link para o próximo passo.','Destaques com perguntas frequentes.'],'Exemplo hipotético: bio Planilhas para organizar suas finanças + link.','Bio vaga; muitos links sem foco.','Veja visitas ao perfil e cliques no link.','Perfil claro transforma curiosidade em ação.'],21:['É planejar vídeos curtos com uma ideia por vídeo.','Gera alcance e descoberta.','Vídeos curtos são distribuídos a quem se interessa pelo assunto.',['Escolha uma ideia.','Faça gancho, desenvolvimento e chamada para ação.','Mantenha ritmo.','Publique e compare.'],'Exemplo hipotético: vídeo de 20s sobre 1 erro ao organizar o orçamento.','Muitas ideias num vídeo; enrolar no início.','Observe retenção, compartilhamentos e cliques.','Uma ideia, um vídeo, um próximo passo.'],23:['É produzir conteúdo em parceria com outro criador.','Apresenta a marca a um público novo.','O público do parceiro conhece você por uma pessoa que já confia.',['Escolha um criador com público parecido.','Combine objetivos e regras.','Crie conteúdo conjunto.','Divulgue nos dois perfis.'],'Exemplo hipotético: live conjunta sobre finanças pessoais.','Escolher só pelo tamanho; não alinhar expectativas.','Compare seguidores novos e cliques.','Parceria funciona com público compatível.'],24:['É definir quem verá seus anúncios por interesses, localização, comportamento e outros critérios permitidos.','Evita mostrar anúncios para quem não tem interesse.','As plataformas permitem limitar o público conforme opções disponíveis.',['Defina o público.','Escolha critérios disponíveis.','Comece com público médio.','Compare resultados.'],'Exemplo hipotético: jovens de 20 a 30 anos interessados em finanças pessoais.','Público pequeno demais; muito amplo.','Compare custo por clique e conversões por público.','Segmentar é testar, não adivinhar.'],25:['É a imagem, o vídeo e o texto do anúncio.','Chama atenção e comunica a oferta.','O criativo é o que o público vê e decide clicar ou não.',['Mostre o benefício logo.','Use imagem clara.','Texto curto.','Crie 2 ou 3 versões.'],'Exemplo hipotético: vídeo de 15s mostrando a planilha preenchida.','Imagem confusa; promessa exagerada.','Compare CTR entre criativos.','Criativo claro faz o anúncio render mais, sem garantias.'],26:['É comparar duas versões de um anúncio mudando uma só variável.','Mostra o que funciona melhor.','As duas versões rodam em condições parecidas.',['Mude só uma coisa.','Mesmo orçamento.','Rode tempo suficiente.','Mantenha a melhor.'],'Exemplo hipotético: o mesmo vídeo com dois ganchos.','Mudar várias coisas; decidir com poucos dados.','Compare CTR e custo por resultado.','Teste uma variável por vez.'],27:['É mostrar anúncios para quem já interagiu com sua marca.','Reconquista pessoas que já demonstraram interesse.','A plataforma lembra quem visitou ou interagiu.',['Defina quem entra: visitantes ou vídeo assistido.','Crie anúncio específico.','Limite a frequência.','Meça conversões.'],'Exemplo hipotético: anúncio para quem viu a página de vendas.','Insistir demais e irritar.','Veja custo por conversão.','Fale diferente com quem já conhece você.'],28:['É reencontrar visitantes do site com anúncios, normalmente por cookies ou eventos.','Traz de volta quem saiu sem comprar.','Um código registra a visita e a plataforma exibe anúncios depois.',['Instale a ferramenta de medição.','Crie listas por página.','Faça anúncios coerentes.','Respeite as regras de privacidade.'],'Exemplo hipotético: lembrar quem abriu o checkout.','Ignorar privacidade; não excluir quem comprou.','Compare vendas recuperadas.','Retargeting lembra, mas não substitui uma boa oferta.'],29:['É criar campanhas conforme o objetivo: alcance, tráfego, leads ou vendas.','Direciona a plataforma ao resultado que importa.','O sistema otimiza a entrega para o objetivo escolhido.',['Defina o objetivo.','Escolha o tipo de campanha.','Configure o destino.','Avalie por esse objetivo.'],'Exemplo hipotético: campanha de leads para um checklist grátis.','Escolher vendas sem página pronta; trocar de objetivo a toda hora.','Meça a métrica ligada ao objetivo.','Um objetivo claro por campanha.'],30:['É definir quanto investir e como distribuir o gasto.','Evita perdas e dá previsibilidade.','O orçamento limita o gasto e influencia a velocidade de aprendizado.',['Defina um valor que pode perder.','Divida entre testes.','Acompanhe diariamente.','Pause o que não funciona.'],'Exemplo hipotético: R$ 20 por dia por 5 dias em 2 anúncios.','Gastar tudo sem testar; aumentar rápido.','Acompanhe custo por resultado.','Invista só o que pode perder.'],31:['É ajustar campanhas com base nos dados para melhorar os resultados.','Reduz desperdício.','Você identifica o que funciona e o que não funciona.',['Analise métricas.','Pause o que não rende.','Teste uma mudança por vez.','Registre as mudanças.'],'Exemplo hipotético: trocar o gancho de um anúncio com CTR baixo.','Mudar tudo ao mesmo tempo; reagir a poucos dados.','Compare antes e depois, com cautela.','Otimizar é testar e medir.']});
Object.assign(D,{0:['Posicionamento de marca é o lugar que sua marca ocupa na cabeça das pessoas em comparação com as alternativas. Ele responde a três perguntas: para quem você existe, o que você oferece e por que alguém deveria escolher você. Não é um logotipo nem um slogan: é a ideia que fica depois que a pessoa vê seu conteúdo, sua página ou seu anúncio.','Serve para tornar a marca fácil de entender e de lembrar. Sem posicionamento, a comunicação fica genérica, parecida com a de todo mundo, e o cliente decide apenas pelo preço. Com ele, você orienta o que publicar, que tom usar, que produtos oferecer e que público atrair.','Funciona por associação e repetição. As pessoas veem muitas marcas por dia e não analisam cada uma a fundo; elas guardam uma impressão simples. Quando sua mensagem é clara e aparece de forma consistente em perfil, conteúdos, página de vendas e atendimento, essa impressão se forma e passa a gerar confiança. Se a mensagem muda toda semana, a impressão fica confusa.',['Escreva para quem a marca existe, com o máximo de detalhes que conseguir.','Descreva o problema ou desejo principal desse público.','Liste o que você faz de diferente das alternativas e que seja verdadeiro.','Junte tudo em uma frase simples: Para [público], a [marca] é [categoria] que [benefício], diferente de [alternativa].','Use essa frase como guia em bio, títulos, anúncios e página de vendas.','Revise depois de alguns meses, com base no que o público realmente respondeu.'],'Exemplo hipotético: uma loja fictícia de capas de celular decide se posicionar como a capa resistente para quem trabalha na rua. Todo conteúdo mostra testes de queda e uso no dia a dia, e o anúncio fala de durabilidade, não só de preço. Quem vê entende em segundos para quem a loja é.','Querer falar com todo mundo e acabar não falando com ninguém; mudar a mensagem a cada semana; copiar o posicionamento do concorrente; prometer algo que o produto não entrega, o que destrói a confiança assim que o cliente compra.','Posicionamento não tem um número único, mas você pode observar sinais: as pessoas repetem sua ideia nos comentários e mensagens? Os cliques vêm do público que você queria? As perguntas que chegam fazem sentido com a sua proposta? Se não, ajuste e teste de novo.','Posicionar é escolher um lugar claro na mente do público e manter a mensagem consistente.','Use no início de um negócio ou perfil, ao lançar um produto, quando as vendas dependem só de preço, ou quando a comunicação parece confusa ou parecida com a dos concorrentes.'],1:['Definir o público-alvo é identificar o grupo de pessoas com maior chance de se interessar pelo seu produto, com base em necessidades, contexto, hábitos e capacidade de compra. Em vez de dizer meu público é todo mundo, você descreve quem realmente tem o problema que você resolve.','Serve para direcionar esforço e dinheiro. Conteúdo, anúncios, preço e linguagem funcionam melhor quando são pensados para alguém específico. Também ajuda a decidir onde divulgar: não adianta investir em um canal onde seu público quase não está.','Funciona como um filtro. Quanto mais clara a definição, mais fácil escolher temas, ganchos, canais e ofertas. Você parte de hipóteses, conversa com pessoas reais e confirma ou corrige com dados, como quem clica, comenta, pergunta e compra.',['Liste quem tem o problema que seu produto resolve.','Descreva rotina, dúvidas, linguagem e onde essas pessoas buscam informação.','Converse com 5 a 10 pessoas desse grupo e anote o que elas dizem.','Escolha um grupo principal para começar.','Crie conteúdos e ofertas pensando só nele.','Compare resultados e refine a definição.'],'Exemplo hipotético: uma planilha de finanças pode mirar jovens no primeiro emprego, que ganham o primeiro salário e não sabem como organizá-lo. Os vídeos falam de contas básicas, e os anúncios aparecem para essa faixa etária em redes que eles usam.','Definir o público por suposição; escolher um grupo amplo demais; confundir público com quem você gostaria que comprasse; não revisar depois que os dados chegam.','Compare cliques, comentários e vendas entre grupos diferentes. O público certo tende a responder com mais interesse e perguntas mais próximas da compra.','Conheça bem poucas pessoas antes de tentar agradar muitas.','Use antes de criar conteúdo ou anúncios, ao escolher um produto para divulgar, ao entrar em um novo canal e sempre que os resultados estiverem fracos.'],2:['Persona é uma descrição de uma pessoa fictícia que representa seu cliente típico. Ela tem nome, idade aproximada, rotina, desejos, dúvidas e objeções. Deve ser baseada em conversas e dados reais, não em imaginação.','Serve para escrever e decidir pensando em alguém concreto. Fica mais fácil escolher o tom, o canal, os exemplos e a oferta quando você imagina uma pessoa real lendo.','Funciona porque transforma um grupo abstrato em um retrato. Ao revisar um texto, você pergunta: a Carla entenderia isso? Ela confiaria? Isso resolve a dúvida dela?',['Reuna informações de conversas, perguntas e comentários reais.','Dê um nome e descreva a rotina.','Liste objetivos, problemas, objeções e onde ela busca informação.','Escreva como ela falaria sobre o problema.','Use a persona para revisar conteúdos e ofertas.','Atualize quando conhecer melhor o público.'],'Exemplo hipotético: Carla, 24 anos, primeiro emprego, quer controlar gastos, tem medo de planilhas complicadas e pesquisa dicas em vídeos curtos. Os conteúdos para ela usam linguagem simples e passos curtos.','Inventar a persona sem falar com ninguém; criar muitas personas e se perder; usar estereótipos; esquecer de atualizar.','Veja se conteúdos feitos pensando nela geram mais respostas, salvamentos e cliques do que antes.','Persona boa nasce de pessoas reais, não de suposições.','Use ao planejar conteúdo, escrever páginas de vendas, definir ofertas e treinar quem atende o público.'],3:['Proposta única de valor é uma frase curta que explica o principal benefício do produto e o que o torna diferente das alternativas. Ela diz, em poucos segundos, por que a pessoa deveria prestar atenção.','Serve para deixar a oferta compreensível. Ela aparece no perfil, no título da página e nos anúncios, e evita que a pessoa tenha que adivinhar o que você vende.','Ela une quatro elementos: público, problema, resultado e diferencial. Quando eles estão claros em uma só frase, o cliente avalia mais rápido se aquilo serve para ele.',['Complete: Ajudo [público] a [resultado] sem [obstáculo].','Troque palavras vagas por detalhes concretos.','Peça a 3 pessoas do público que expliquem com as próprias palavras o que entenderam.','Ajuste até que elas entendam sem ajuda.','Aplique em bio, página e anúncios.'],'Exemplo hipotético: Planilha para organizar o salário do mês em 10 minutos, sem fórmulas complicadas. Em uma linha diz para quem, o benefício e o diferencial.','Frases genéricas como soluções completas; prometer resultados que não podem ser comprovados; copiar a frase de outra marca; tentar caber vários benefícios em uma frase.','Veja se a taxa de cliques melhora, se as perguntas ficam mais alinhadas ao produto e se as pessoas repetem sua frase.','Se não cabe em uma frase, ainda não está clara.','Use ao criar ou renomear perfil, página de vendas e anúncios, ou quando perceber que as pessoas não entendem o que você vende.']});
Object.assign(D,{4:['Análise da concorrência é o estudo organizado de quem já vende algo parecido com o que você oferece. Você observa produto, preço, promessa, canais de divulgação, avaliações de clientes e pontos fracos, para entender como o mercado funciona antes de decidir como entrar nele.','Serve para descobrir lacunas e oportunidades. Ao ver o que os concorrentes fazem bem e o que deixam de fazer, você evita repetir o que todos já fazem, ajusta preço e comunicação com mais segurança e encontra um espaço em que sua oferta pareça realmente diferente.','Você compara os concorrentes usando os mesmos critérios, como preço, benefícios prometidos, formato de entrega, atendimento e presença nas redes. Ao colocar tudo lado a lado, os padrões aparecem: o que é comum no mercado, o que é raro e onde há reclamações frequentes dos clientes.',['Liste de 5 a 8 concorrentes diretos, que vendem o mesmo, e indiretos, que resolvem o mesmo problema de outro jeito.','Monte uma tabela com preço, promessa, canais, formato do produto e avaliações públicas de cada um.','Leia comentários e avaliações para encontrar reclamações e elogios que se repetem.','Defina onde você pode fazer melhor ou diferente e escreva isso em uma frase.'],'Exemplo hipotético: ao comparar três lojas fictícias de capinhas, você percebe que todas competem só por preço e quase não falam de durabilidade. Você decide destacar resistência e garantia, mostrando testes de uso, e assim ocupa um espaço que os outros deixaram livre.','Erros comuns: copiar o concorrente em vez de aprender com ele, olhar apenas o preço e ignorar o restante da oferta, analisar poucos concorrentes, tirar conclusões de uma só avaliação e nunca atualizar a pesquisa, mesmo quando o mercado muda com frequência.','Avalie se, depois da análise, sua mensagem ficou claramente diferente da deles. Pergunte a clientes por que escolheram você e observe se a taxa de cliques, as perguntas recebidas e as vendas indicam que a diferença está sendo percebida pelo público.','Analisar a concorrência não é copiar: é entender o mercado para encontrar lacunas, ajustar sua oferta e se comunicar de forma diferente, com base em comparações justas, dados observáveis e revisões periódicas conforme o mercado muda.','Use antes de lançar um produto, ao definir preço, ao criar a comunicação da marca, quando as vendas caírem sem explicação clara ou quando um novo concorrente ganhar espaço no seu nicho. Repita a análise de tempos em tempos para manter as informações atuais.'],5:['Diferenciação competitiva é oferecer algo que o público percebe como diferente e relevante em comparação às alternativas. A diferença pode estar no produto, no atendimento, na entrega, na garantia, na forma de ensinar ou na experiência de compra, desde que seja real e importe para o cliente.','Serve para sair da disputa apenas por preço. Quando o cliente enxerga um motivo claro para escolher você, ele aceita pagar mais, compara menos e confia mais. Também ajuda a orientar decisões de produto, de comunicação e de investimento em divulgação.','Funciona quando a diferença atende a três condições: é verdadeira, é percebida pelo cliente e é valorizada por ele. Uma vantagem que só você acha importante não diferencia. Por isso a diferenciação nasce da escuta do público e é reforçada com provas e exemplos concretos.',['Liste suas forças reais, como suporte rápido, material didático claro, entrega confiável ou garantia.','Pergunte ao público quais dessas forças importam para ele na hora de comprar.','Escolha uma ou duas diferenças principais e escreva como prová-las.','Mostre essas provas em perfil, página e anúncios de forma consistente.'],'Exemplo hipotético: um curso curto em formato de checklist, com suporte por e-mail em até 24 horas, se diferencia de cursos longos e sem resposta. O anúncio mostra o checklist pronto e a promessa de suporte, em vez de apenas citar o preço.','Erros comuns: inventar um diferencial que não existe, escolher uma diferença que o público não valoriza, tentar se diferenciar em muitos pontos ao mesmo tempo, esquecer de comprovar a vantagem e deixar de cumprir na prática o que foi prometido.','Pergunte a clientes por que escolheram você, acompanhe se o preço deixa de ser a principal objeção e compare a taxa de conversão antes e depois de passar a comunicar o diferencial. Observe também se as avaliações citam a vantagem que você divulgou.','Diferenciar-se é oferecer algo verdadeiro, percebido e valorizado pelo cliente, provando a vantagem com fatos e mantendo a promessa na entrega, sem tentar competir apenas por preço nem inventar benefícios.','Use quando seu produto parece igual aos outros, quando a concorrência só compete por preço, ao lançar uma oferta nova ou quando as objeções do público mostram que ele não enxerga motivos claros para escolher a sua marca.'],6:['Marketing de nicho é a estratégia de focar em um grupo pequeno e específico de pessoas, com necessidades bem definidas, em vez de tentar atender um público amplo. O nicho pode ser definido por interesse, profissão, estilo de vida, problema ou tipo de produto.','Serve para reduzir a concorrência direta e facilitar a comunicação. Quando você fala com um grupo específico, as pessoas se sentem compreendidas, prestam mais atenção e tendem a confiar mais, o que facilita ser lembrado e recomendado dentro daquela comunidade.','Funciona porque a mensagem fica mais precisa. Em um nicho, você conhece melhor as dúvidas, a linguagem e os canais do público, cria conteúdos e ofertas sob medida e gasta menos para alcançar as pessoas certas, desde que exista demanda suficiente para sustentar o negócio.',['Escolha um problema específico que você consiga resolver bem.','Defina o grupo que mais sofre com esse problema e descreva seu dia a dia.','Crie conteúdo e oferta feitos apenas para esse grupo, com a linguagem dele.','Valide a demanda com poucas vendas ou cadastros antes de investir muito.'],'Exemplo hipotético: em vez de vender planilha de finanças para qualquer pessoa, você cria uma planilha para freelancers de design, com campos para projetos, impostos e meses sem renda. O conteúdo fala diretamente desse dia a dia e atrai quem se identifica.','Erros comuns: escolher um nicho sem validar se existem compradores, definir um nicho tão pequeno que não sustenta o negócio, entrar em um assunto só porque parece lucrativo sem conhecê-lo e abandonar o foco ao primeiro resultado fraco.','Observe se os comentários, as mensagens e os cadastros vêm de pessoas do grupo escolhido, compare a taxa de conversão do nicho com a de públicos amplos e acompanhe se a demanda se mantém ao longo de semanas, e não apenas em um dia.','Marketing de nicho é falar de forma específica com um grupo bem definido, o que pode facilitar a conexão e a confiança, mas exige validar demanda, conhecer o público de verdade e acompanhar os resultados ao longo do tempo.','Use quando o mercado amplo está saturado, quando você tem pouco orçamento, quando conhece bem um grupo específico ou quando quer testar uma oferta antes de ampliar para outros públicos. Evite se não houver sinais de demanda suficiente.'],7:['Construção de autoridade é o processo de ser reconhecido como fonte confiável sobre um assunto. Isso acontece quando você demonstra conhecimento, publica com consistência, explica com clareza e mostra experiências reais, sem exagerar resultados nem fingir uma experiência que não tem.','Serve para aumentar a confiança antes da oferta. Quem confia em você ouve com mais atenção, tem menos dúvidas na hora de comprar e tende a indicar seu trabalho. A autoridade também ajuda a justificar preços e a diferenciar você de quem apenas divulga produtos.','Funciona por acúmulo. Cada conteúdo útil, cada resposta bem explicada e cada resultado real mostrado com honestidade forma uma imagem de competência. Com o tempo, o público associa seu nome a um tema e passa a procurá-lo quando precisa daquele assunto.',['Escolha um tema principal em que você possa se aprofundar de verdade.','Publique conteúdos úteis e verdadeiros em uma frequência que consiga manter.','Mostre processos, aprendizados e resultados reais, citando limites e contexto.','Responda dúvidas do público com clareza e reúna as melhores respostas em destaques ou posts fixados.'],'Exemplo hipotético: um perfil fictício explica uma métrica de marketing por semana, com exemplos numéricos simples e avisos de que os valores são ilustrativos. Em meses, os seguidores passam a procurar o perfil quando têm dúvidas sobre aquela métrica.','Erros comuns: fingir expertise, mostrar resultados inventados, mudar de assunto toda semana, publicar de forma irregular, responder dúvidas com arrogância ou ignorar críticas legítimas, o que enfraquece a confiança que você está tentando construir.','Observe salvamentos, compartilhamentos, perguntas recebidas, menções ao seu nome e pedidos de indicação. Esses sinais mostram se o público passou a ver você como referência no tema. Acompanhe também se as pessoas chegam à oferta com menos dúvidas.','Autoridade se constrói com utilidade, verdade e constância ao longo do tempo: mostre o que sabe com clareza, admita limites e deixe que o público perceba sua competência pelas explicações e pelos resultados que você realmente tem.','Use ao entrar em um nicho novo, antes de lançar uma oferta mais cara, quando o público ainda não conhece você ou quando as pessoas têm dúvidas sobre sua credibilidade. Exige tempo e consistência, não funciona de um dia para o outro.'],8:['Conteúdo educativo é aquele que ensina algo útil ao público: dicas, passo a passo, explicações de termos, comparações e respostas a dúvidas frequentes. Seu objetivo principal é ajudar a pessoa a entender ou resolver algo, e não vender diretamente.','Serve para atrair pessoas com uma dúvida real, gerar confiança e mostrar que você domina o assunto. Quem aprende algo útil com você tende a voltar, seguir, salvar o conteúdo e considerar a sua oferta quando precisar de uma solução mais completa.','Funciona porque responde a uma necessidade concreta. As pessoas procuram informação antes de comprar. Quando você explica de forma simples e aplicável, o conteúdo é salvo e compartilhado, ampliando o alcance, e sua marca passa a ser associada à ajuda.',['Liste as dúvidas mais frequentes do público, usando comentários, mensagens e pesquisas.','Escolha uma dúvida por conteúdo e defina o que a pessoa terá aprendido ao final.','Explique em passos curtos, com um exemplo simples, evitando termos difíceis sem explicação.','Termine com um próximo passo claro, como salvar, comentar ou acessar um material.'],'Exemplo hipotético: um vídeo de 30 segundos explica como calcular a taxa de conversão com um exemplo simples, de 2 vendas em 72 cliques. No final, convida a baixar uma calculadora gratuita, sem tentar vender nada de imediato.','Erros comuns: tentar ensinar tudo em um único conteúdo, usar linguagem técnica sem explicar, falar só do próprio produto, copiar informações sem verificar se estão corretas e esquecer de convidar o público para o próximo passo depois da explicação.','Observe retenção, salvamentos, compartilhamentos, comentários com dúvidas novas e cliques no próximo passo. Se o conteúdo é salvo e compartilhado, provavelmente foi útil. Compare formatos e temas para descobrir o que o seu público mais valoriza.','Conteúdo educativo ensina uma coisa por vez, de forma simples e aplicável, com exemplos claros e um próximo passo, criando confiança e lembrança de marca antes da venda, sem prometer resultados que dependem de outros fatores.','Use no início da relação com o público, quando ele ainda não conhece seu produto, para responder dúvidas frequentes, reduzir objeções antes da oferta e manter o perfil ativo com utilidade, sem depender sempre de conteúdos de venda direta.']});
Object.assign(D,{9:['Conteúdo de entretenimento é aquele criado principalmente para divertir ou prender a atenção: humor, esquetes, curiosidades, desafios e histórias leves. Ele não precisa ensinar nada, mas deve combinar com o universo da marca e com os interesses do público que você quer atrair.','Serve para ampliar o alcance e aproximar as pessoas da marca. Conteúdos leves costumam ser compartilhados com amigos, o que ajuda a marca a ser descoberta por quem ainda não a conhece, além de tornar o perfil mais humano e fácil de lembrar.','Funciona pela emoção e pelo compartilhamento. Quando algo diverte, a pessoa assiste até o fim, comenta ou envia a alguém. Esses sinais mostram à plataforma que o conteúdo agrada. A conexão com o tema da marca faz com que quem riu também entenda o que você vende.',['Escolha um formato leve que você consiga repetir, como esquete curta, meme original ou curiosidade.','Conecte a piada ou a história a uma situação real do seu público e do seu produto.','Mantenha o tom e os valores da marca, evitando ofender pessoas ou grupos.','Alterne com conteúdos úteis e ofertas para não atrair apenas quem busca diversão.'],'Exemplo hipotético: um perfil de planilhas de finanças publica uma esquete engraçada sobre o salário que acaba antes do dia 15. Muita gente se identifica, compartilha e visita o perfil, onde encontra dicas e a planilha.','Erros comuns: fazer humor sem relação com o tema, atrair pessoas que nunca comprariam, depender só de piadas, copiar o conteúdo de outros criadores, usar estereótipos ofensivos ou publicar sem pensar no efeito para a imagem da marca.','Observe tempo de visualização, compartilhamentos, comentários e seguidores novos, mas acompanhe também visitas ao perfil e cliques. Se muito alcance não vira interesse pelo produto, ajuste a conexão entre o humor e a oferta.','Entretenimento atrai atenção e amplia o alcance, mas precisa conversar com a marca e ser equilibrado com conteúdos úteis e ofertas, para que a audiência conquistada também se interesse pelo que você realmente oferece.','Use para ganhar alcance, apresentar a marca a pessoas novas, humanizar o perfil e quebrar a rotina de conteúdos sérios. Evite como estratégia única quando o objetivo for vender diretamente ou quando a marca exigir tom mais formal.'],10:['Conteúdo de identificação é aquele em que o público se reconhece: situações do dia a dia, sentimentos, dificuldades e hábitos comuns. A pessoa lê ou assiste e pensa: isso acontece comigo. Ele mostra que a marca entende a realidade de quem a acompanha.','Serve para criar conexão emocional e sensação de ser compreendido. Essa proximidade aumenta comentários e compartilhamentos e prepara o terreno para que o público confie mais quando a marca apresentar uma solução para o problema retratado.','Funciona porque as pessoas prestam mais atenção ao que se parece com a própria vida. Ao reconhecer a situação, ela marca amigos, comenta a própria experiência e passa a associar a marca ao assunto, o que fortalece lembrança e relacionamento.',['Observe dúvidas, frustrações e rotinas do público em comentários, mensagens e conversas.','Escolha uma situação comum e descreva com sinceridade, usando linguagem natural.','Convide as pessoas a contar a própria experiência nos comentários.','Se fizer sentido, finalize indicando como a marca ajuda a lidar com aquela situação.'],'Exemplo hipotético: um perfil de organização financeira publica um post sobre a sensação de abrir o aplicativo do banco e se assustar com o saldo. Muitos comentam que passam pela mesma coisa, e o perfil responde com uma dica simples.','Erros comuns: usar estereótipos, exagerar a situação até perder credibilidade, falar de dores que o público não tem, ironizar quem passa por dificuldades reais ou usar sofrimento alheio apenas para vender um produto.','Observe comentários do tipo comigo também, marcações de amigos, compartilhamentos e salvamentos. Verifique se, depois do conteúdo, aumentam as mensagens com dúvidas e se o público passa a interagir mais com os posts seguintes.','Conteúdo de identificação mostra que você entende a realidade do público, cria conexão e abre espaço para ajudar. Funciona melhor quando é sincero, respeitoso e baseado em situações que as pessoas realmente vivem.','Use para fortalecer relação com quem já acompanha a marca, para introduzir um problema que sua solução resolve e para aumentar comentários. Evite quando o assunto for sensível e você não tiver conhecimento ou cuidado suficiente.'],11:['Storytelling é a técnica de contar uma história para transmitir uma ideia, um valor ou uma mensagem de venda. Uma boa história tem personagem, desafio, virada e resultado, e ajuda a explicar de forma mais memorável do que uma lista de características.','Serve para tornar mensagens abstratas mais fáceis de entender, de lembrar e de sentir. Histórias mostram como o produto ou a ideia funcionam na vida real, criam empatia e ajudam o público a se imaginar na mesma situação.','Funciona porque o cérebro acompanha sequências com início, conflito e resolução com mais facilidade. Ao seguir a história, a pessoa se envolve e chega à mensagem principal sem sentir que está apenas sendo informada ou pressionada a comprar.',['Defina a mensagem que a história deve transmitir antes de escrevê-la.','Apresente um personagem e o problema que ele enfrenta de forma clara.','Mostre a virada, ou seja, o que mudou e como a solução entrou na história.','Termine com o aprendizado e um convite simples para a próxima ação.'],'Exemplo hipotético: a história fictícia de Marina, que vivia sem saber para onde ia o salário, testou anotar gastos por uma semana e descobriu onde estava errando. O vídeo termina convidando a baixar um modelo de planilha gratuito.','Erros comuns: inventar uma história e apresentá-la como real, contar histórias longas sem objetivo, usar personagens irreais, esconder limitações do produto e esquecer de ligar a história à mensagem ou ao próximo passo que a pessoa deve dar.','Observe retenção até o fim, comentários que citam trechos da história, compartilhamentos e cliques depois do conteúdo. Compare com conteúdos sem narrativa para entender se a história ajudou a prender a atenção e a gerar ação.','Storytelling transforma uma ideia em algo fácil de entender e lembrar. Use histórias verdadeiras ou identificadas como fictícias, com começo, virada e conclusão claros, sempre ligadas a uma mensagem específica.','Use para explicar benefícios difíceis de resumir, apresentar a origem da marca, criar conexão emocional, introduzir um produto ou quando os conteúdos técnicos estão cansativos. Evite quando a pessoa só precisa de uma resposta rápida e direta.'],12:['Conteúdo baseado em problemas e soluções apresenta uma dificuldade real do público e mostra caminhos para resolvê-la. O produto pode entrar como uma das alternativas, mas o foco está em ajudar a pessoa a entender o problema e escolher uma saída adequada.','Serve para conectar sua oferta a uma necessidade concreta. As pessoas pesquisam soluções para o que as incomoda; quando você explica o problema com clareza e mostra como resolver, ganha atenção, confiança e a chance de ser considerado na decisão.','Funciona porque segue a lógica da pessoa: ela sente um problema, procura informação, compara alternativas e só depois decide. Ao acompanhar esse caminho, o conteúdo aparece na hora certa e reduz dúvidas, em vez de interromper com propaganda.',['Escolha um problema específico e frequente do seu público.','Explique a causa do problema em linguagem simples, com um exemplo.','Mostre as soluções possíveis, inclusive as gratuitas, de forma honesta.','Apresente seu produto como uma das opções, dizendo para quem ele serve e para quem não serve.'],'Exemplo hipotético: um conteúdo fictício explica por que a pele resseca no inverno, lista cuidados simples como beber água e evitar banhos muito quentes, e só depois menciona um hidratante, indicando para quais tipos de pele ele pode ser indicado.','Erros comuns: falar apenas do produto, exagerar o problema para assustar, esconder limitações da solução, prometer resultados garantidos, copiar conteúdos sem checar a informação e tratar todos os problemas do público como se fossem iguais.','Observe visualizações, salvamentos, perguntas sobre o produto e cliques para a oferta. Verifique se as pessoas comentam que o problema era exatamente aquele e se a explicação ajudou, pois isso indica que o conteúdo está bem alinhado.','Mostre o problema, explique a causa, apresente soluções honestas e coloque seu produto como uma opção adequada para quem o precisa, respeitando os limites e dizendo claramente para quem ele não é indicado.','Use quando o público já sente o problema e procura respostas, ao lançar um produto que resolve uma dificuldade específica ou ao preparar o terreno para uma oferta. Evite inventar problemas que o público não tem apenas para vender.'],13:['Reaproveitamento de conteúdo é a técnica de transformar uma ideia ou material já criado em novos formatos e para outros canais. Um vídeo pode virar carrossel, artigo, sequência de stories, e-mail ou checklist, sempre adaptando linguagem, tamanho e chamada para ação.','Serve para economizar tempo, manter a frequência de publicação e alcançar pessoas que preferem formatos diferentes. Também permite aproveitar o que já funcionou, em vez de recomeçar do zero a cada nova publicação.','Funciona porque diferentes pessoas consomem conteúdo de formas distintas e em canais distintos. Ao adaptar a mesma ideia a vários formatos, você aumenta a chance de ela ser vista e entendida, sem exigir uma produção totalmente nova cada vez.',['Escolha um conteúdo que teve bom desempenho ou que ensina algo importante.','Liste os formatos possíveis: vídeo curto, carrossel, texto, e-mail ou checklist.','Adapte o início, a duração e a chamada para ação ao canal escolhido, sem apenas copiar.','Publique em momentos diferentes e compare os resultados de cada versão.'],'Exemplo hipotético: um roteiro de vídeo de 40 segundos sobre taxa de conversão vira um carrossel de 6 telas com a fórmula e um exemplo, e depois um e-mail curto com a calculadora gratuita anexada para quem se cadastrou.','Erros comuns: copiar e colar o mesmo conteúdo em todos os canais, repetir demais para o mesmo público, reaproveitar conteúdo desatualizado ou ruim, ignorar o formato de cada plataforma e não acompanhar qual versão realmente funciona melhor.','Compare alcance, retenção, salvamentos e cliques entre os formatos e os canais. Veja qual versão atrai mais interesse e use essa informação para decidir os próximos formatos e para melhorar os conteúdos originais.','Reaproveitar é adaptar com critério, e não duplicar. Uma boa ideia pode ganhar vários formatos, desde que cada um respeite o canal, o público e o objetivo, e que os resultados sejam acompanhados para orientar as próximas decisões.','Use quando um conteúdo teve bom desempenho, quando falta tempo para produzir algo novo, ao querer alcançar canais diferentes ou ao montar uma sequência de publicações sobre um mesmo tema. Evite com conteúdos desatualizados ou fracos.']});
Object.assign(D,{14:['Calendário editorial é o planejamento do que será publicado, em quais dias, em quais canais e com qual objetivo. Ele organiza temas, formatos, datas importantes e responsáveis em um quadro simples, que pode ser uma planilha, um documento ou um aplicativo de organização.','Serve para manter constância, evitar improvisos de última hora e equilibrar tipos de conteúdo, como educativo, entretenimento e oferta. Também ajuda a ligar as publicações aos objetivos do negócio, em vez de postar sem direção.','Funciona como um mapa: você define pilares de conteúdo, distribui os temas ao longo das semanas e reserva espaço para ajustes. Com tudo planejado, fica mais fácil produzir em lote, revisar a qualidade e analisar depois quais temas e formatos tiveram melhor resultado.',['Defina de 3 a 4 pilares, como dicas, bastidores, prova social e ofertas.','Escolha a frequência que você realmente consegue manter durante meses.','Distribua temas e formatos pelas semanas, incluindo datas relevantes para o público.','Reserve espaço para ajustes e revise o calendário uma vez por mês com base nos resultados.'],'Exemplo hipotético: um perfil fictício de finanças publica dica na segunda, bastidor na quarta e oferta na sexta. No fim do mês, percebe que as dicas geram mais salvamentos e passa a dedicar mais dias a esse tipo de conteúdo.','Erros comuns: planejar demais e não publicar, criar um calendário rígido que não aceita mudanças, escolher uma frequência impossível de manter, repetir sempre o mesmo tema e nunca comparar o que foi planejado com os resultados obtidos.','Avalie se você manteve a frequência planejada e compare alcance, retenção, salvamentos e cliques entre os temas e os formatos. Use esses dados para decidir o que repetir, o que testar e o que retirar do calendário no mês seguinte.','Planejar ajuda a publicar com constância e inteligência, desde que o calendário seja realista, flexível e revisado com base nos resultados. Ele organiza o trabalho, mas não substitui a qualidade dos conteúdos.','Use ao iniciar um perfil, ao lançar um produto, quando as publicações estão irregulares ou quando mais de uma pessoa cuida do conteúdo. Para quem está começando, um calendário simples de uma semana já ajuda bastante.'],15:['Conteúdo de prova social mostra experiências reais de clientes ou usuários com seu produto, como depoimentos autorizados, avaliações, resultados contados com contexto e mensagens espontâneas. A ideia é permitir que o público veja o que outras pessoas realmente viveram.','Serve para reduzir dúvidas e aumentar a confiança antes da compra. Pessoas tendem a observar o que outras fizeram e como se sentiram, principalmente quando não conhecem a marca, e esse tipo de conteúdo ajuda a decidir com mais segurança.','Funciona porque traz uma visão externa, que não parte apenas de quem vende. Quando o depoimento é verdadeiro, específico e vem acompanhado de contexto, o público consegue avaliar se aquela experiência se parece com a sua situação e se o produto pode ajudá-lo.',['Peça feedback aos clientes depois da compra e solicite autorização clara para divulgar.','Escolha relatos específicos, que expliquem o contexto, e não apenas elogios genéricos.','Proteja a privacidade, ocultando dados pessoais quando necessário.','Publique em formatos variados, como imagem, vídeo curto ou carrossel, citando a origem de cada relato.'],'Exemplo hipotético: um perfil fictício publica, com autorização, a mensagem de uma cliente dizendo que organizou as contas em duas semanas usando a planilha. O post informa o contexto e avisa que os resultados variam de pessoa para pessoa.','Erros comuns: inventar ou alterar depoimentos, publicar sem autorizar, mostrar só resultados excepcionais como se fossem comuns, usar elogios genéricos, expor dados pessoais e esquecer de informar que o resultado de um cliente não garante o mesmo para os demais.','Observe cliques na oferta depois da publicação, perguntas sobre o produto, taxa de conversão da página com e sem depoimentos e comentários das pessoas. Se as dúvidas diminuírem e as vendas aumentarem, isso pode indicar efeito positivo, sem provar causa.','Prova social só funciona quando é verdadeira, autorizada e contextualizada. Ela mostra experiências reais para ajudar na decisão, e nunca deve ser inventada, exagerada ou apresentada como garantia de resultado para todos.','Use quando o público tem dúvidas sobre a qualidade, quando a marca é nova, antes de uma oferta ou na página de vendas. Se ainda não há clientes, não invente: colete feedbacks de testes reais antes de usar essa técnica.'],16:['SEO, sigla em inglês para otimização para mecanismos de busca, é o conjunto de práticas para que suas páginas e conteúdos apareçam em buscadores como o Google quando alguém pesquisa um assunto relacionado. Envolve conteúdo, estrutura da página, velocidade e reputação do site.','Serve para atrair visitas de pessoas que já estão procurando uma resposta ou solução, sem pagar por cada clique. Por isso, costuma gerar um público com interesse mais claro e ajuda a construir uma fonte de visitas que pode crescer ao longo do tempo.','Funciona porque os buscadores tentam mostrar o resultado mais útil para cada pesquisa. Eles analisam relevância do conteúdo, clareza, atualização e outros sinais. Como as regras exatas mudam e não são totalmente públicas, o caminho mais seguro é criar conteúdo realmente útil.',['Escolha um assunto que o público pesquisa e entenda o que a pessoa espera encontrar.','Escreva um conteúdo completo, claro e organizado em títulos e subtítulos.','Use os termos pesquisados de forma natural no título, nos subtítulos e no texto.','Atualize o conteúdo periodicamente e verifique se ele continua respondendo à dúvida.'],'Exemplo hipotético: uma loja fictícia de planilhas escreve o artigo Como calcular ticket médio, com fórmula, exemplo numérico e uma calculadora. Com o tempo, o artigo pode passar a receber visitas de quem faz essa pesquisa.','Erros comuns: repetir palavras de forma artificial, copiar textos de outros sites, esperar resultado imediato, ignorar a experiência no celular, prometer conteúdo que a página não entrega e não atualizar páginas antigas, que podem perder relevância.','Acompanhe visitas vindas de busca, termos que levaram até a página, tempo de leitura, taxa de saída e conversões geradas pela página. Como o SEO costuma levar tempo, compare períodos longos antes de concluir se uma mudança funcionou.','SEO é útil, mas lento: depende de conteúdo bom, organização e paciência. Nenhuma técnica garante a primeira posição, e os resultados variam conforme a concorrência e as mudanças nos buscadores.','Use quando seu público costuma pesquisar dúvidas antes de comprar, quando você tem um site ou blog e deseja gerar visitas de longo prazo. Evite como única estratégia se precisa de vendas imediatas.'],17:['Pesquisa de palavras-chave é o processo de descobrir quais termos as pessoas digitam em buscadores e plataformas ao procurar um assunto, produto ou solução. Ela mostra a linguagem real do público, que muitas vezes é diferente da linguagem técnica usada por quem vende.','Serve para criar conteúdos que respondam a dúvidas reais, escolher títulos mais claros e entender a intenção por trás de cada busca, como aprender, comparar ou comprar. Também ajuda a perceber quais assuntos têm interesse e quais são muito disputados.','Funciona observando sugestões dos buscadores, perguntas relacionadas, ferramentas de pesquisa e comentários do público. Você reune termos, agrupa por tema e intenção e decide quais conteúdos criar primeiro, equilibrando interesse do público e dificuldade de aparecer.',['Liste os temas centrais do seu produto e as dúvidas que o público costuma ter.','Pesquise variações nos buscadores, nas sugestões automáticas e nas perguntas relacionadas.','Agrupe os termos por intenção: aprender, comparar ou comprar.','Escolha um termo principal por conteúdo e use variações de forma natural no texto.'],'Exemplo hipotético: ao pesquisar sobre organizar salário, você nota variações como planilha de gastos grátis e como dividir o salário. Cada uma vira um conteúdo, com respostas diretas e, quando fizer sentido, um convite ao material.','Erros comuns: escolher apenas termos muito disputados, ignorar a intenção da busca, criar conteúdo que não responde ao termo, usar palavras que o público não utiliza, e não revisar a pesquisa com o tempo, já que o interesse das pessoas muda.','Acompanhe se o conteúdo recebe visitas pelo termo escolhido, se as pessoas ficam na página e se avançam para o próximo passo. Se o termo traz visitas que não interessam ao seu negócio, revise a intenção ou escolha termos mais específicos.','Pesquisar palavras-chave é escutar o público antes de produzir. Ela orienta o que escrever com a linguagem de quem busca, mas deve ser combinada com conteúdo realmente útil, e não apenas com a repetição de termos.','Use antes de criar artigos, páginas, vídeos para plataformas de busca e títulos de conteúdo. Também é útil ao lançar produtos, para descobrir como as pessoas nomeiam o problema que seu produto resolve.'],18:['Otimização de títulos e descrições é o ajuste dos textos que aparecem antes do clique: o título de uma página nos resultados de busca, a descrição abaixo dele, o título de um vídeo ou a primeira linha de uma legenda. Eles resumem o conteúdo e convidam a pessoa a abrir.','Serve para aumentar a taxa de cliques e atrair a pessoa certa. Um título claro mostra rapidamente o assunto e o benefício, enquanto a descrição ajuda a decidir se vale a pena abrir. Isso melhora a descoberta e reduz cliques de quem não tem interesse.','Funciona porque, em buscas e feeds, as pessoas decidem em segundos. O título precisa comunicar o assunto e o benefício de forma honesta, e a descrição precisa complementar com um detalhe relevante. Se a promessa não for cumprida, a pessoa sai rapidamente e isso prejudica os resultados.',['Inclua o assunto principal ou o termo pesquisado no começo do título.','Mostre o benefício ou o resultado que a pessoa pode obter, de forma realista.','Mantenha o texto curto o suficiente para não ser cortado e evite exageros.','Crie duas versões, compare os cliques e fique com a que funcionar melhor.'],'Exemplo hipotético: em vez de Planilha financeira, um título mais claro seria Como organizar o salário em 10 minutos com uma planilha simples. A descrição completa: veja o passo a passo e baixe o modelo gratuito para começar hoje.','Erros comuns: títulos vagos, exagerados ou enganosos, repetição artificial de palavras, textos longos demais que são cortados, descrições copiadas de outras páginas e promessas que o conteúdo não cumpre, o que aumenta a saída rápida.','Compare a taxa de cliques entre versões, acompanhe o tempo na página e a taxa de saída. Um título com muitos cliques e saída rápida pode indicar promessa exagerada, então analise os indicadores em conjunto, e não apenas os cliques.','Um bom título é claro, honesto e específico: atrai quem realmente se interessa e cumpre o que promete, melhorando a descoberta e a confiança do público sem depender de truques nem de exageros.','Use ao publicar páginas, artigos, vídeos e legendas, e também ao revisar conteúdos antigos com poucos cliques. Vale testar versões diferentes quando houver volume suficiente de visualizações para comparar.']});
Object.assign(D,{19:['Estratégia de hashtags é o uso planejado de palavras-chave marcadas com o símbolo # para classificar suas publicações por assunto. Elas ajudam as plataformas e as pessoas a entenderem o tema do conteúdo e a encontrarem publicações relacionadas ao que procuram.','Serve para dar contexto ao conteúdo e facilitar a descoberta por pessoas interessadas no assunto, além de organizar seu próprio perfil por temas. Elas complementam um bom conteúdo, mas não garantem alcance nem substituem qualidade, clareza e consistência.','Funciona como etiquetas. Ao pesquisar ou seguir uma hashtag, a pessoa pode ver conteúdos do mesmo tema. A eficiência varia conforme a plataforma e muda com o tempo, por isso vale observar na prática quais hashtags trazem visitas de pessoas novas e interessadas.',['Liste os temas principais do seu conteúdo e as palavras que o público usa para buscá-los.','Escolha hashtags amplas, mas relacionadas, e outras mais específicas do seu nicho.','Use poucas hashtags por publicação, todas coerentes com o assunto do conteúdo.','Observe quais trazem alcance de não seguidores e ajuste a lista a cada algumas semanas.'],'Exemplo hipotético: em um vídeo de dicas de organização financeira, um perfil fictício usa uma hashtag ampla sobre finanças pessoais, outra sobre planejamento mensal e uma terceira ligada a quem recebe o primeiro salário. Depois compara o alcance entre posts.','Erros comuns: usar dezenas de hashtags sem relação com o conteúdo, copiar listas prontas sem testar, escolher apenas hashtags muito populares onde o conteúdo se perde, repetir sempre as mesmas e acreditar que apenas elas vão gerar resultados.','Verifique nas estatísticas da plataforma quanto do alcance vem de pessoas que não seguem você e de onde elas chegaram. Compare publicações com conjuntos diferentes de hashtags e mantenha as que parecem trazer público mais alinhado.','Hashtags ajudam a contextualizar e a facilitar a descoberta quando são relevantes e usadas com moderaç
